<h1 id="java%E9%AB%98%E7%BA%A7%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1">Java高级程序设计</h1>
<h2 id="%E6%B3%9B%E5%9E%8B">泛型</h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="1" style="" data-marpit-pagination-total="69" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B-1">泛型</h2>
<p>泛型程序设计（generic programming）是程序设计语言的一种风格或范式。泛型允许程序员在强类型程序设计语言中编写代码时使用一些以后才指定的类型，在实例化时作为参数指明这些类型。... Ada、Delphi、Eiffel、Java、C#、F#、Swift 和 Visual Basic .NET 称之为泛型（generics）；ML、Scala 和 Haskell 称之为参数多态（parametric polymorphism）；C++ 和 D称之为模板。《Design Patterns》一书称之为参数化类型（parameterized type）。</p>
<p><small><a href="https://zh.wikipedia.org/wiki/%E6%B3%9B%E5%9E%8B">https://zh.wikipedia.org/wiki/泛型</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="java-generics">Java Generics</h2>
<ul>
<li>A way to control a class type definitions</li>
<li>A way of improving the clarity of code</li>
<li>A way of avoiding (<strong>casts</strong>) in code, turning run-time errors (typically <strong>ClassCastException</strong>) into compile-time errors.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E8%91%AB%E8%8A%A6%E5%A8%83%E4%B8%AD%E7%9A%84%E4%BE%8B%E5%AD%90">葫芦娃中的例子</h2>
<p><code>Position</code>第一版</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Position</span> {
    <span class="hljs-keyword">private</span> Object sth;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Position</span><span class="hljs-params">(Object sth)</span> { 
        <span class="hljs-built_in">this</span>.sth = sth; 
    }
    Object <span class="hljs-title function_">get</span><span class="hljs-params">()</span> { 
        <span class="hljs-keyword">return</span> sth; 
    }
}
</code></pre>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%94%B9%E8%BF%9B">改进</h2>
<p><code>Position</code>第二版</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Position</span> {

    Creature <span class="hljs-title function_">get</span><span class="hljs-params">()</span> { 
        <span class="hljs-keyword">return</span> sth; 
    }
}
</code></pre>

<div style="text-align:center; ">通过构造方法和get方法我们能看出Position里放的是Creature</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E4%BD%86%E5%A6%82%E6%9E%9C%E6%98%AF%E8%BF%99%E6%A0%B7%E5%91%A2">但如果是这样呢？</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Position</span> {
    <span class="hljs-keyword">private</span> Creature sth;
}
</code></pre>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E7%94%A8%E6%B3%9B%E5%9E%8B%E6%98%BE%E5%BC%8F%E8%AF%B4%E6%98%8E%E4%B8%80%E4%B8%8B">用“泛型”显式说明一下</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Position</span>&lt;T&gt;{
    <span class="hljs-keyword">private</span> T sth;
}
</code></pre>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E5%86%8D%E6%98%8E%E7%99%BD%E4%B8%80%E7%82%B9">再明白一点</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Position</span>&lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Creature</span>&gt;{
    <span class="hljs-keyword">private</span> T sth;
}
</code></pre>
<div style="text-align:center; ">显式表达Position是跟某种Creature有关系的</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E4%B8%8D%E7%94%A8%E6%B3%9B%E5%9E%8B%E7%9A%84stack">不用泛型的Stack</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Stack</span>{
  <span class="hljs-keyword">void</span> <span class="hljs-title function_">push</span><span class="hljs-params">(Object o)</span>{...}
  Object <span class="hljs-title function_">pop</span><span class="hljs-params">()</span>{...}
}

<span class="hljs-type">String</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;Hello&quot;</span>;
<span class="hljs-type">Stack</span> <span class="hljs-variable">st</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>();
...
st.push(s);
...
s = (String)st.pop();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E7%94%A8%E4%BA%86%E6%B3%9B%E5%9E%8B%E7%9A%84stack">用了泛型的Stack</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Stack</span>&lt;A&gt;{ <span class="hljs-comment">// 类参数</span>
  <span class="hljs-keyword">void</span> <span class="hljs-title function_">push</span><span class="hljs-params">(A a)</span>{...}
  A <span class="hljs-title function_">pop</span><span class="hljs-params">()</span>{...}
}
<span class="hljs-type">String</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;Hello&quot;</span>;
Stack&lt;String&gt; st = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>&lt;String&gt;();
st.push(s);
...
s = st.pop();

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E5%86%8D%E5%AE%9A%E4%B9%89%E4%B8%80%E4%B8%AAcomputer-%08">再定义一个Computer </h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Computer</span>{

    <span class="hljs-keyword">private</span> HDD mHarddisk;   <span class="hljs-comment">// 机械硬盘</span>
    
    Computer(HDD harddisk){

    }
    <span class="hljs-keyword">public</span> Data <span class="hljs-title function_">readDisk</span><span class="hljs-params">()</span>{
        <span class="hljs-keyword">return</span> mHarddisk.read();
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeDisk</span><span class="hljs-params">(Data data)</span>{
        mHarddisk.write(data);

}
</code></pre>
<div style="text-align:center; ">如果安装的是SSD怎么办？</div>

<h2 id="%E5%AE%9A%E4%B9%89%E4%B8%80%E4%B8%AAssdcomputer-%08">定义一个SSDComputer ？</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SSDComputer</span>{

    <span class="hljs-keyword">private</span> SSD mHarddisk;   <span class="hljs-comment">// SSD硬盘</span>

    Computer(SSD harddisk){
        mHarddisk = harddisk;
    }
    <span class="hljs-keyword">public</span> Data <span class="hljs-title function_">readDisk</span><span class="hljs-params">()</span>{
        <span class="hljs-keyword">return</span> mHarddisk.read();
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeDisk</span><span class="hljs-params">(Data data)</span>{

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%8A%BD%E8%B1%A1%E4%B8%80%E4%B8%8B">抽象一下</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Disk</span>{};
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SSD</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Disk</span>{};
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HHD</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Disk</span>{};
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Computer</span>{
    <span class="hljs-keyword">private</span> Disk disk;   <span class="hljs-comment">// 抽象的硬盘</span>
    Computer(Disk disk){
        <span class="hljs-built_in">this</span>.disk = disk;
    }
    <span class="hljs-keyword">public</span> Data <span class="hljs-title function_">readDisk</span><span class="hljs-params">()</span>{ <span class="hljs-keyword">return</span> disk.read(); }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeDisk</span><span class="hljs-params">(Data data)</span>{ disk.write(data); }
    <span class="hljs-keyword">public</span> Disk <span class="hljs-title function_">getDisk</span><span class="hljs-params">()</span>{ <span class="hljs-keyword">return</span> disk; }
}
</code></pre>
<div style="text-align:center; ">基于多态实现设计抽象（解耦）</div>
<div style="text-align:center; ">但你还要cast</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E7%94%A8%E6%B3%9B%E5%9E%8B%E6%9D%A5%E5%81%9A">用泛型来做</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Computer</span>&lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Disk</span>&gt;{

    <span class="hljs-keyword">public</span> Data <span class="hljs-title function_">readDisk</span><span class="hljs-params">()</span>{ <span class="hljs-keyword">return</span> disk.read(); }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeDisk</span><span class="hljs-params">(Data data)</span>{ disk.write(data); }
    <span class="hljs-keyword">public</span> T <span class="hljs-title function_">getDisk</span><span class="hljs-params">()</span>{ <span class="hljs-keyword">return</span> disk; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setDisk</span><span class="hljs-params">(T disk)</span>{ <span class="hljs-built_in">this</span>.disk = disk; }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        Computer&lt;SSD&gt; computer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Computer</span>&lt;SSD&gt;(<span class="hljs-keyword">new</span> <span class="hljs-title class_">SSD</span>());
        <span class="hljs-type">SSD</span> <span class="hljs-variable">disk</span> <span class="hljs-operator">=</span> computer.getDisk(); <span class="hljs-comment">// No cast needed</span>
        <span class="hljs-comment">//computer.setDisk(new HHD()); // error!</span>
    }
}
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Computer</span>&lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Disk</span>&gt; {

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Disk</span> {};

<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E5%AE%9E%E9%99%85%E5%AE%9E%E7%8E%B0">泛型的实际实现</h2>
<ul>
<li>对泛型的处理全部集中在编译期，在编译时，编译器会执行如下操作。
<ul>
<li>会将泛型类的类型参数都用边界类型替换。</li>
<li>对于传入对象给方法形参的指令，编译器会执行一个类型检查，看传入的对象是不是类型参数所指定的类型。</li>
<li>对于返回类型参数表示对象的指令，也会执行一个类型检查，还会插入一个自动的向下转型，将对象从边界类型向下转型到类型参数所表示的类型。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">

        <span class="hljs-keyword">if</span> (arg <span class="hljs-keyword">instanceof</span> T){ ... } <span class="hljs-comment">//编译错误</span>

<h2 id="%E5%A6%82%E6%9E%9C%E7%9C%9F%E6%83%B3%E7%94%9F%E6%88%90%E6%B3%9B%E5%9E%8B%E5%AF%B9%E8%B1%A1">如果真想生成泛型对象？</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Holder</span>&lt;T&gt;{
    <span class="hljs-keyword">private</span> T t;
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">init</span><span class="hljs-params">(IFactory&lt;T&gt; factory)</span>{
        <span class="hljs-built_in">this</span>.t = factory.create();  <span class="hljs-comment">// 此处即为new T()的工厂方法的实现</span>
    }
}
<span class="hljs-keyword">interface</span> <span class="hljs-title class_">IFactory</span>&lt;T&gt;{  <span class="hljs-comment">//接口也可以参数化</span>
    T <span class="hljs-title function_">create</span><span class="hljs-params">()</span>;
}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">IntegerFactory</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">IFactory</span>&lt;Integer&gt;{
    <span class="hljs-keyword">public</span> Integer <span class="hljs-title function_">create</span><span class="hljs-params">()</span>{
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Integer</span>(<span class="hljs-number">10</span>);
    }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">newTwithFactory</span>{

        holder.init(<span class="hljs-keyword">new</span> <span class="hljs-title class_">IntegerFactory</span>());
    }
}
</code></pre>

<h2 id="%E6%88%96%E8%80%85%E5%8F%AF%E4%BB%A5%E4%BD%BF%E7%94%A8rtti">或者可以使用RTTI</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Holder</span>&lt;T&gt;{
    <span class="hljs-keyword">private</span> T t;
    <span class="hljs-keyword">private</span> Class&lt;T&gt; kind;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Holder</span><span class="hljs-params">(Class&lt;T&gt; kind)</span>{ <span class="hljs-built_in">this</span>.kind = kind; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">init</span><span class="hljs-params">()</span>{
        <span class="hljs-keyword">try</span>{
            <span class="hljs-built_in">this</span>.t = kind.newInstance();
        }<span class="hljs-keyword">catch</span> (Exception e){
            e.printStackTrace();
        }
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        Holder&lt;Integer&gt; holder = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Holder</span>&lt;&gt;(Integer.class);
        holder.init();
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E8%BE%B9%E7%95%8C-bounds">边界 Bounds</h2>
<p>用<code>extends</code>申明对参数类型的限制条件</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">interface</span> <span class="hljs-title class_">HasColor</span>{ java.awt.Color <span class="hljs-title function_">getColor</span><span class="hljs-params">()</span>; }

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Colored</span> &lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">HasColor</span>&gt;{ ... }

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dimension</span> { <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> x,y,z; }

<span class="hljs-keyword">class</span> <span class="hljs-title class_">ColoredDimension</span> &lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">HasColor</span> &amp; Dimension&gt;{ ... } <span class="hljs-comment">//错误！</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">ColoredDimension</span> &lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Dimension</span> &amp; HasColor&gt;{ ... }<span class="hljs-comment">//正确！类必须在前，接口在后</span>
    

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%84%8F%E4%B9%89%E7%B1%BB%E5%9E%8B%E5%AE%89%E5%85%A8type-safety">泛型的意义：类型安全（Type Safety）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 没有泛型 - 容易出错</span>
<span class="hljs-type">List</span> <span class="hljs-variable">list</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>();
list.add(<span class="hljs-string">&quot;Hello&quot;</span>);
list.add(<span class="hljs-number">123</span>);
<span class="hljs-type">String</span> <span class="hljs-variable">str</span> <span class="hljs-operator">=</span> (String) list.get(<span class="hljs-number">0</span>); <span class="hljs-comment">// 需要强制类型转换</span>
<span class="hljs-type">Integer</span> <span class="hljs-variable">num</span> <span class="hljs-operator">=</span> (Integer) list.get(<span class="hljs-number">1</span>); <span class="hljs-comment">// 运行时可能出错</span>


<span class="hljs-comment">// 有泛型 - 编译时类型检查</span>
List&lt;String&gt; list = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
list.add(<span class="hljs-string">&quot;Hello&quot;</span>);
list.add(<span class="hljs-number">123</span>); <span class="hljs-comment">// 编译错误！类型不匹配</span>
<span class="hljs-type">String</span> <span class="hljs-variable">str</span> <span class="hljs-operator">=</span> list.get(<span class="hljs-number">0</span>); <span class="hljs-comment">// 无需强制转换，类型安全</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%84%8F%E4%B9%89%E6%B6%88%E9%99%A4%E5%BC%BA%E5%88%B6%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2">泛型的意义：消除强制类型转换</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 没有泛型</span>
<span class="hljs-type">List</span> <span class="hljs-variable">list</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>();
list.add(<span class="hljs-string">&quot;Hello&quot;</span>);
<span class="hljs-type">String</span> <span class="hljs-variable">str</span> <span class="hljs-operator">=</span> (String) list.get(<span class="hljs-number">0</span>); <span class="hljs-comment">// 需要强制转换</span>

<span class="hljs-comment">// 有泛型</span>
List&lt;String&gt; list = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
list.add(<span class="hljs-string">&quot;Hello&quot;</span>);
<span class="hljs-type">String</span> <span class="hljs-variable">str</span> <span class="hljs-operator">=</span> list.get(<span class="hljs-number">0</span>); <span class="hljs-comment">// 自动类型推断，无需转换</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%84%8F%E4%B9%89%E6%8F%90%E9%AB%98%E4%BB%A3%E7%A0%81%E5%8F%AF%E8%AF%BB%E6%80%A7">泛型的意义：提高代码可读性</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 没有泛型 - 不清楚存储什么类型</span>
<span class="hljs-type">Map</span> <span class="hljs-variable">userCache</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>();
userCache.put(<span class="hljs-string">&quot;user1&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>(<span class="hljs-string">&quot;张三&quot;</span>));

<span class="hljs-comment">// 有泛型 - 一目了然</span>
Map&lt;String, User&gt; userCache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
userCache.put(<span class="hljs-string">&quot;user1&quot;</span>, <span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>(<span class="hljs-string">&quot;张三&quot;</span>));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%84%8F%E4%B9%89%E4%BB%A3%E7%A0%81%E5%A4%8D%E7%94%A8">泛型的意义：代码复用</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 没有泛型 - 需要为每种类型写重复代码</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">StringBox</span>/IntegerBox {
    <span class="hljs-keyword">private</span> String/Integer value;
    <span class="hljs-keyword">public</span> String/Integer <span class="hljs-title function_">get</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> value; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">set</span><span class="hljs-params">(String/Integer value)</span> { <span class="hljs-built_in">this</span>.value = value; }
}

<span class="hljs-comment">// 有泛型 - 一个类处理所有类型</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Box</span>&lt;T&gt; {
    <span class="hljs-keyword">private</span> T value;
    <span class="hljs-keyword">public</span> T <span class="hljs-title function_">get</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> value; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">set</span><span class="hljs-params">(T value)</span> { <span class="hljs-built_in">this</span>.value = value; }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%84%8F%E4%B9%89%E7%AE%97%E6%B3%95%E9%80%9A%E7%94%A8%E6%80%A7">泛型的意义：算法通用性</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 泛型排序算法</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> &lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Comparable</span>&lt;T&gt;&gt; <span class="hljs-keyword">void</span> <span class="hljs-title function_">sort</span><span class="hljs-params">(List&lt;T&gt; list)</span> {
    <span class="hljs-comment">// 可以对任何实现了Comparable接口的类型进行排序</span>
    Collections.sort(list);
}

<span class="hljs-comment">// 使用示例</span>
List&lt;String&gt; strings = Arrays.asList(<span class="hljs-string">&quot;c&quot;</span>, <span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>);
List&lt;Integer&gt; numbers = Arrays.asList(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>);
sort(strings);  <span class="hljs-comment">// 排序字符串</span>
sort(numbers);  <span class="hljs-comment">// 排序数字</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E5%AE%9E%E9%99%85%E9%A1%B9%E7%9B%AE%E4%B8%AD%E7%9A%84%E5%BA%94%E7%94%A8">实际项目中的应用</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">//数据访问层</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Repository</span>&lt;T, ID&gt; {
    T <span class="hljs-title function_">findById</span><span class="hljs-params">(ID id)</span>;
    List&lt;T&gt; <span class="hljs-title function_">findAll</span><span class="hljs-params">()</span>;
    T <span class="hljs-title function_">save</span><span class="hljs-params">(T entity)</span>;
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">deleteById</span><span class="hljs-params">(ID id)</span>;
}

<span class="hljs-comment">//事件系统</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">EventHandler</span>&lt;T <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Event</span>&gt; {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">handle</span><span class="hljs-params">(T event)</span>;
    Class&lt;T&gt; <span class="hljs-title function_">getEventType</span><span class="hljs-params">()</span>;
}

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%B3%9B%E5%9E%8B%E7%9A%84%E6%A0%B8%E5%BF%83%E4%BB%B7%E5%80%BC">泛型的核心价值</h2>
<ul>
<li><strong>类型安全</strong>：编译时发现类型错误，避免运行时异常</li>
<li><strong>代码简洁</strong>：消除强制类型转换，代码更清晰</li>
<li><strong>代码复用</strong>：一个泛型类可以处理多种类型</li>
<li><strong>性能提升</strong>：避免装箱拆箱，减少类型转换开销</li>
<li><strong>维护性</strong>：代码更易读、易维护、易扩展</li>
<li><strong>设计灵活性</strong>：支持复杂的设计模式和架构</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E7%9C%8B%E7%9C%8B%E8%BF%99%E4%B8%AA%E4%BE%8B%E5%AD%90">看看这个例子</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Fruit</span>{}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Apple</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>{}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NonConvariantGeneric</span> {
    List&lt;Fruit&gt; flist = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;Apple&gt;(); <span class="hljs-comment">//编译错误</span>
}
</code></pre>
<p>Apple的<code>List</code>不是Fruit的<code>List</code>。Apple的<code>List</code>将持有Apple和Apple的子类型，Fruit的<code>List</code>将持有任何类型的<code>Fruit</code>。是的，这包括Apple，但是它不是一个Apple的<code>List</code>，它仍然是Fruit的<code>List</code>。Apple的<code>List</code>在类型上不等价于<code>Fruit</code>的List，即使Apple是一种Fruit类型。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E5%86%8D%E7%9C%8B%E7%9C%8B%E8%BF%99%E4%B8%AA%E4%BE%8B%E5%AD%90">再看看这个例子</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Fruit</span> {}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Apple</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span> {}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Plate</span>&lt;T&gt;{
    <span class="hljs-keyword">private</span> T item;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Plate</span><span class="hljs-params">(T t)</span>{item=t;}
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">set</span><span class="hljs-params">(T t)</span>{item=t;}
    <span class="hljs-keyword">public</span> T <span class="hljs-title function_">get</span><span class="hljs-params">()</span>{<span class="hljs-keyword">return</span> item;}
}

<span class="hljs-comment">//现在我定义一个“水果盘子”，逻辑上水果盘子当然可以装苹果。</span>
<span class="hljs-comment">//但实际上Java编译器不允许这个操作。会报错，“装苹果的盘子”无法转换成“装水果的盘子”。</span>
Plate&lt;Fruit&gt; p = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Plate</span>&lt;Apple&gt;(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Apple</span>()); <span class="hljs-comment">//编译错误！</span>
</code></pre>
<div style="text-align:center; color:red;">“苹果” IS-A “水果”， BUT “装苹果的盘子” NOT-IS-A “装水果的盘子”！</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E9%80%9A%E9%85%8D%E7%AC%A6">通配符</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Fruit</span>{}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Apple</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>{}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">GenericsAndCovariance</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span>{
        <span class="hljs-comment">//一个能放水果以及一切是水果派生类的盘子,啥水果都能放的盘子</span>
        <span class="hljs-comment">//Plate&lt;？ extends Fruit&gt;和Plate&lt;Apple&gt;最大的区别就是：</span>
        <span class="hljs-comment">//Plate&lt;？ extends Fruit&gt;是Plate&lt;Fruit&gt;以及Plate&lt;Apple&gt;的基类。</span>
        Plate&lt;? <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>&gt; p=<span class="hljs-keyword">new</span> <span class="hljs-title class_">Plate</span>&lt;Apple&gt;(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Apple</span>());
        <span class="hljs-comment">// a list of any type that&#x27;s inherited from Fruit</span>
        List&lt;? <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>&gt; flist = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;Apple&gt;();
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E6%89%A9%E5%B1%95%E4%B8%80%E4%B8%8B">扩展一下</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Food</span>{}
<span class="hljs-comment">//Lev 2</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Fruit</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Food</span>{}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Meat</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Food</span>{}
<span class="hljs-comment">//Lev 3</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Apple</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>{}
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Banana</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Fruit</span>{}

<div style="text-align:center; font-size:30pt; color:red ">Covariant return types</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h2 id="%E5%8D%8F%E5%8F%98%E4%B8%8E%E9%80%86%E5%8F%98">协变与逆变</h2>
<p>协变与逆变(Covariance and contravariance )是在计算机科学中，描述具有父/子型别关系的多个型别通过型别构造器、构造出的多个复杂型别之间是否有父/子型别关系的用语。</p>
<p><small><a href="https://zh.wikipedia.org/wiki/%E5%8D%8F%E5%8F%98%E4%B8%8E%E9%80%86%E5%8F%98">https://zh.wikipedia.org/wiki/协变与逆变</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="java-%E6%B3%9B%E5%9E%8B-vs-c-%E6%A8%A1%E6%9D%BF">Java 泛型 vs C++ 模板</h1>
<p>Java 泛型和 C++ 模板虽然语法相似，但实现机制完全不同。</p>
<table>
<thead>
<tr>
<th>特性</th>
<th>Java 泛型</th>
<th>C++ 模板</th>
</tr>
</thead>
<tbody>
<tr>
<td>实现机制</td>
<td><strong>类型擦除</strong></td>
<td><strong>代码生成</strong></td>
</tr>
<tr>
<td>编译结果</td>
<td>单一字节码</td>
<td>每个类型生成独立代码</td>
</tr>
<tr>
<td>运行时类型信息</td>
<td>丢失</td>
<td>保留</td>
</tr>
<tr>
<td>性能</td>
<td>装箱开销（基本类型）</td>
<td>无装箱，完全优化</td>
</tr>
<tr>
<td>特化</td>
<td>不支持</td>
<td>支持模板特化</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="java-%E6%B3%9B%E5%9E%8B%E7%B1%BB%E5%9E%8B%E6%93%A6%E9%99%A4">Java 泛型：类型擦除</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 源代码</span>
List&lt;String&gt; strings = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
List&lt;Integer&gt; integers = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

<span class="hljs-comment">// 编译后（字节码）</span>
<span class="hljs-type">List</span> <span class="hljs-variable">strings</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>();  <span class="hljs-comment">// 类型信息被擦除</span>
<span class="hljs-type">List</span> <span class="hljs-variable">integers</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>(); <span class="hljs-comment">// 同样的字节码</span>

<span class="hljs-comment">// 运行时</span>
System.out.println(strings.getClass() == integers.getClass()); <span class="hljs-comment">// true</span>
</code></pre>
<p>再次强调：泛型只存在于编译期，用于类型检查</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="56" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="c-%E6%A8%A1%E6%9D%BF%E4%BB%A3%E7%A0%81%E7%94%9F%E6%88%90">C++ 模板：代码生成</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// 源代码</span>
<span class="hljs-keyword">template</span>&lt;<span class="hljs-keyword">typename</span> T&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Container</span> {
    T value;
<span class="hljs-keyword">public</span>:
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">set</span><span class="hljs-params">(T v)</span> </span>{ value = v; }
    <span class="hljs-function">T <span class="hljs-title">get</span><span class="hljs-params">()</span> </span>{ <span class="hljs-keyword">return</span> value; }
};
<span class="hljs-comment">// 编译后：生成了3份完全不同的代码！</span>
Container&lt;<span class="hljs-type">int</span>&gt; intContainer;      <span class="hljs-comment">// 生成 Container_int 类</span>
Container&lt;<span class="hljs-type">double</span>&gt; doubleContainer; <span class="hljs-comment">// 生成 Container_double 类</span>
Container&lt;string&gt; strContainer;    <span class="hljs-comment">// 生成 Container_string 类</span>
</code></pre>
<p>每个类型实例化生成独立代码，运行时类型信息完全保留</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="57" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="%E6%80%A7%E8%83%BD%E5%AF%B9%E6%AF%94">性能对比</h1>
<p><strong>Java 泛型</strong>：装箱和拆箱有性能开销</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;Integer&gt; list = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
list.add(<span class="hljs-number">42</span>);        <span class="hljs-comment">// 装箱：int → Integer</span>
<span class="hljs-type">int</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> list.get(<span class="hljs-number">0</span>); <span class="hljs-comment">// 拆箱：Integer → int</span>
</code></pre>
<p><strong>C++ 模板</strong>：编译器生成针对 <code>int</code> 的优化代码</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::vector&lt;<span class="hljs-type">int</span>&gt; vec;
vec.<span class="hljs-built_in">push_back</span>(<span class="hljs-number">42</span>);   <span class="hljs-comment">// 直接存储 int，无开销</span>
<span class="hljs-type">int</span> value = vec[<span class="hljs-number">0</span>];  <span class="hljs-comment">// 直接访问，无开销</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="58" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="c-%E6%A8%A1%E6%9D%BF%E7%9A%84%E7%BC%96%E8%AF%91%E6%97%B6%E8%83%BD%E5%8A%9B">C++ 模板的编译时能力</h1>
<p>C++ 模板支持<strong>编译时计算</strong>和<strong>元编程</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">template</span>&lt;<span class="hljs-type">int</span> N&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Factorial</span> {
    <span class="hljs-type">static</span> <span class="hljs-type">const</span> <span class="hljs-type">int</span> value = N * Factorial&lt;N<span class="hljs-number">-1</span>&gt;::value;
};

<span class="hljs-keyword">template</span>&lt;&gt;
<span class="hljs-keyword">struct</span> <span class="hljs-title class_">Factorial</span>&lt;<span class="hljs-number">0</span>&gt; {
    <span class="hljs-type">static</span> <span class="hljs-type">const</span> <span class="hljs-type">int</span> value = <span class="hljs-number">1</span>;
};

<span class="hljs-comment">// 编译时计算阶乘，编译时就计算出结果！</span>
<span class="hljs-type">int</span> result = Factorial&lt;<span class="hljs-number">5</span>&gt;::value;  <span class="hljs-comment">// 120，编译期就是常量</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="59" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="kokkos">Kokkos</h1>
<p>一个可移植计算框架，通过模板参数在编译时选择不同的硬件后端。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">template</span>&lt;<span class="hljs-keyword">class</span> ExecutionSpace&gt;
<span class="hljs-type">void</span> <span class="hljs-title">compute</span><span class="hljs-params">()</span> </span>{
    Kokkos::<span class="hljs-built_in">parallel_for</span>(
        Kokkos::<span class="hljs-built_in">RangePolicy</span>&lt;ExecutionSpace&gt;(<span class="hljs-number">0</span>, N),
        <span class="hljs-built_in">KOKKOS_LAMBDA</span>(<span class="hljs-type">int</span> i) { data[i] = data[i] * <span class="hljs-number">2</span>; <span class="hljs-comment">// 计算代码 }</span>
    );
}
<span class="hljs-comment">// 同一份代码，编译时根据 ExecutionSpace 生成不同代码</span>
<span class="hljs-built_in">compute</span>&lt;Kokkos::Cuda&gt;();      <span class="hljs-comment">// → CUDA GPU 代码</span>
<span class="hljs-built_in">compute</span>&lt;Kokkos::OpenMP&gt;();    <span class="hljs-comment">// → OpenMP 多线程代码</span>
<span class="hljs-built_in">compute</span>&lt;Kokkos::Serial&gt;();    <span class="hljs-comment">// → 串行 CPU 代码</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="60" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="kokkos-%E7%9A%84%E7%BC%96%E8%AF%91%E6%97%B6%E4%BB%A3%E7%A0%81%E7%94%9F%E6%88%90">Kokkos 的编译时代码生成</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// ExecutionSpace 是编译时参数</span>
<span class="hljs-keyword">template</span>&lt;<span class="hljs-keyword">class</span> <span class="hljs-title class_">ExecutionSpace</span> = Kokkos::DefaultExecutionSpace&gt;
<span class="hljs-keyword">class</span> MyKernel {
<span class="hljs-keyword">public</span>:
    <span class="hljs-type">void</span> <span class="hljs-built_in">run</span>(<span class="hljs-type">int</span> n) {
        Kokkos::<span class="hljs-built_in">parallel_for</span>(
            Kokkos::<span class="hljs-built_in">RangePolicy</span>&lt;ExecutionSpace&gt;(<span class="hljs-number">0</span>, n),
            *<span class="hljs-keyword">this</span>
        );
    }
    
    <span class="hljs-function">KOKKOS_INLINE_FUNCTION
    <span class="hljs-type">void</span> <span class="hljs-title">operator</span><span class="hljs-params">()</span><span class="hljs-params">(<span class="hljs-type">int</span> i)</span> <span class="hljs-type">const</span> </span>{
        <span class="hljs-comment">// 这段代码会根据 ExecutionSpace 生成：</span>
        <span class="hljs-comment">// - CUDA 设备代码（GPU）</span>
        <span class="hljs-comment">// - OpenMP 并行代码（多核 CPU）</span>
        <span class="hljs-comment">// - 或串行代码（单核 CPU）</span>
        result[i] = <span class="hljs-built_in">compute</span>(data[i]);
    }
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="61" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="%E7%BC%96%E8%AF%91%E6%97%B6%E5%B9%B3%E5%8F%B0%E9%80%89%E6%8B%A9">编译时平台选择</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// 编译时通过模板参数选择执行策略，同一份代码编译出3个不同版本的二进制文件！</span>
<span class="hljs-meta">#<span class="hljs-keyword">if</span> defined(KOKKOS_ENABLE_CUDA)</span>
    <span class="hljs-keyword">using</span> ExecutionSpace = Kokkos::Cuda;
    <span class="hljs-keyword">using</span> MemorySpace = Kokkos::CudaSpace;
<span class="hljs-meta">#<span class="hljs-keyword">elif</span> defined(KOKKOS_ENABLE_OPENMP)</span>
    <span class="hljs-keyword">using</span> ExecutionSpace = Kokkos::OpenMP;
    <span class="hljs-keyword">using</span> MemorySpace = Kokkos::HostSpace;
<span class="hljs-meta">#<span class="hljs-keyword">else</span></span>
    <span class="hljs-keyword">using</span> ExecutionSpace = Kokkos::Serial;
    <span class="hljs-keyword">using</span> MemorySpace = Kokkos::HostSpace;
<span class="hljs-meta">#<span class="hljs-keyword">endif</span></span>

<span class="hljs-function">Kokkos::View&lt;<span class="hljs-type">double</span>*, MemorySpace&gt; <span class="hljs-title">data</span><span class="hljs-params">(<span class="hljs-string">&quot;data&quot;</span>, N)</span></span>;
Kokkos::<span class="hljs-built_in">parallel_for</span>(
    Kokkos::<span class="hljs-built_in">RangePolicy</span>&lt;ExecutionSpace&gt;(<span class="hljs-number">0</span>, N),
    <span class="hljs-built_in">KOKKOS_LAMBDA</span>(<span class="hljs-type">int</span> i) { data[i] = i * <span class="hljs-number">2.0</span>; }
);
<span class="hljs-comment">// myapp_cuda    - GPU 版本</span>
<span class="hljs-comment">// myapp_openmp  - 多线程版本</span>
<span class="hljs-comment">// myapp_serial  - 串行版本</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="62" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="kokkos-%E7%9A%84%E7%B1%BB%E5%9E%8B%E7%B3%BB%E7%BB%9F">Kokkos 的类型系统</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">template</span>&lt;<span class="hljs-keyword">class</span> <span class="hljs-title class_">MemorySpace</span>&gt;
<span class="hljs-keyword">class</span> <span class="hljs-title class_">View</span> {
    <span class="hljs-comment">// MemorySpace 可以是：</span>
    <span class="hljs-comment">// - Kokkos::CudaSpace         → GPU 显存</span>
    <span class="hljs-comment">// - Kokkos::CudaUVMSpace      → 统一虚拟内存</span>
    <span class="hljs-comment">// - Kokkos::HostSpace         → CPU 内存</span>
    <span class="hljs-comment">// - Kokkos::CudaHostPinnedSpace → 锁页内存</span>
};
<span class="hljs-comment">// 编译器根据模板参数生成不同的内存访问代码</span>
Kokkos::View&lt;<span class="hljs-type">double</span>*, Kokkos::CudaSpace&gt; gpu_data;  <span class="hljs-comment">// GPU 访问</span>
Kokkos::View&lt;<span class="hljs-type">double</span>*, Kokkos::HostSpace&gt; cpu_data;  <span class="hljs-comment">// CPU 访问</span>

<span class="hljs-comment">// 编译时类型检查</span>
gpu_data = cpu_data;  <span class="hljs-comment">// 编译错误！不同内存空间</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="63" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="kotlin-%E7%9A%84%E8%A7%A3%E5%86%B3%E6%96%B9%E6%A1%88inline--reified">Kotlin 的解决方案：inline + reified</h1>
<p>Kotlin 作为运行在 JVM 上的语言，也面临类型擦除问题，但提供了 <strong><code>reified</code></strong> 关键字（与<code>inline</code>配合）来保留运行时类型信息。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// public &lt;T&gt; void printType() {</span>
<span class="hljs-comment">//     System.out.println(T.class);  // Java 无法实现,编译错误</span>
<span class="hljs-comment">// }</span>

<span class="hljs-keyword">inline</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-type">&lt;<span class="hljs-keyword">reified</span> T&gt;</span> <span class="hljs-title">printType</span><span class="hljs-params">()</span></span> {
    println(T::<span class="hljs-keyword">class</span>.java)  <span class="hljs-comment">// Kotlin可以运行时获取类型</span>
}

<span class="hljs-comment">// 使用</span>
printType&lt;String&gt;()  <span class="hljs-comment">// 输出：class java.lang.String</span>
printType&lt;<span class="hljs-built_in">Int</span>&gt;()     <span class="hljs-comment">// 输出：class java.lang.Integer</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="64" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="reified-%E7%9A%84%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86">reified 的工作原理</h1>
<p><code>inline</code> 函数会在调用处展开，泛型类型被具体类型替换</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">inline</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-type">&lt;<span class="hljs-keyword">reified</span> T&gt;</span> <span class="hljs-title">createInstance</span><span class="hljs-params">()</span></span>: T {
    <span class="hljs-keyword">return</span> T::<span class="hljs-keyword">class</span>.java.newInstance() <span class="hljs-keyword">as</span> T
}

<span class="hljs-keyword">val</span> str: String = createInstance&lt;String&gt;()
<span class="hljs-keyword">val</span> list: ArrayList&lt;<span class="hljs-built_in">Int</span>&gt; = createInstance&lt;ArrayList&lt;<span class="hljs-built_in">Int</span>&gt;&gt;()
</code></pre>
<p><strong>编译后（Java示意代码）</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">str</span> <span class="hljs-operator">=</span> (String) String.class.newInstance();
<span class="hljs-type">ArrayList</span> <span class="hljs-variable">list</span> <span class="hljs-operator">=</span> (ArrayList) ArrayList.class.newInstance();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="65" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="kotlin-%E7%9A%84%E6%B3%9B%E5%9E%8B">Kotlin 的“泛型”</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">inline</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-type">&lt;<span class="hljs-keyword">reified</span> T&gt;</span> <span class="hljs-title">isInstance</span><span class="hljs-params">(obj: <span class="hljs-type">Any</span>)</span></span>: <span class="hljs-built_in">Boolean</span> {
    <span class="hljs-keyword">return</span> obj <span class="hljs-keyword">is</span> T  <span class="hljs-comment">// 可以使用 T 进行类型检查</span>
}

<span class="hljs-comment">// 调用</span>
isInstance&lt;String&gt;(<span class="hljs-string">&quot;hello&quot;</span>)  <span class="hljs-comment">// true</span>
isInstance&lt;<span class="hljs-built_in">Int</span>&gt;(<span class="hljs-string">&quot;hello&quot;</span>)     <span class="hljs-comment">// false</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="66" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="reified-%E7%9A%84%E5%AE%9E%E9%99%85%E5%BA%94%E7%94%A8">reified 的实际应用</h1>
<p><strong>Android 中的常见场景</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// Java 的繁琐写法</span>
Intent intent = new Intent(context, TargetActivity.<span class="hljs-keyword">class</span>);
startActivity(intent);

<span class="hljs-comment">// Kotlin + reified 的优雅写法</span>
<span class="hljs-keyword">inline</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-type">&lt;<span class="hljs-keyword">reified</span> T : Activity&gt;</span> Context.<span class="hljs-title">startActivity</span><span class="hljs-params">()</span></span> {
    startActivity(Intent(<span class="hljs-keyword">this</span>, T::<span class="hljs-keyword">class</span>.java))
}

<span class="hljs-comment">// 使用</span>
context.startActivity&lt;TargetActivity&gt;()  <span class="hljs-comment">// 简洁！</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="67" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="69">
<h1 id="%E4%B8%89%E7%A7%8D%E6%B3%9B%E5%9E%8B%E5%AE%9E%E7%8E%B0%E5%AF%B9%E6%AF%94">三种泛型实现对比</h1>
<table>
<thead>
<tr>
<th>特性</th>
<th>Java 泛型</th>
<th>Kotlin reified</th>
<th>C++ 模板</th>
</tr>
</thead>
<tbody>
<tr>
<td>运行时类型信息</td>
<td>擦除</td>
<td>有限支持</td>
<td>完整保留</td>
</tr>
<tr>
<td>实现方式</td>
<td>类型擦除</td>
<td>内联展开</td>
<td>代码生成</td>
</tr>
