<h1 id="java%E9%AB%98%E7%BA%A7%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1">Java高级程序设计</h1>
<h2 id="%E8%AF%AD%E8%A8%80%E5%9F%BA%E7%A1%80">语言基础</h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="java-%E7%A8%8B%E5%BA%8F%E7%9A%84%E6%9E%84%E6%88%90">Java 程序的构成</h1>
<p>下面的代码展示类、方法、块、语句和表达式之间的关系：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Counter</span> { <span class="hljs-comment">// 类：组织字段和方法</span>
    <span class="hljs-type">int</span> <span class="hljs-variable">count</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; <span class="hljs-comment">// 字段和标识符；这是一个声明语句</span>

    <span class="hljs-keyword">void</span> <span class="hljs-title function_">increment</span><span class="hljs-params">()</span> { <span class="hljs-comment">// 方法：包含返回类型、方法名和方法体</span>
        <span class="hljs-keyword">if</span> (count &gt;= <span class="hljs-number">0</span>) { <span class="hljs-comment">// 控制语句；count &gt;= 0 是表达式；{} 形成块和作用域</span>
            count++; <span class="hljs-comment">// 表达式语句：修改字段的值</span>
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%A0%87%E8%AF%86%E7%AC%A6">标识符</h1>
<ul>
<li>程序中要用到许多名字，诸如类、对象、变量、方法等。标识符用于标识这些程序实体。</li>
<li>标识符没有语言规定的固定长度上限，但会受到编译器和开发工具的限制。标识符包括：
<ul>
<li>关键字和保留字：由 Java 语言规定，具有特殊含义或被保留，不能用作自定义名称。</li>
<li>用户定义标识符：程序设计者为类、对象、变量、方法等定义的名称。</li>
</ul>
</li>
<li>Java 源代码和标识符支持 Unicode；<code>char</code> 是 16 位的 UTF-16 代码单元，不能单独表示所有 Unicode 码点。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E7%94%A8%E6%88%B7%E8%87%AA%E5%AE%9A%E4%B9%89%E6%A0%87%E8%AF%86%E7%AC%A6%E7%9A%84%E5%AE%9A%E4%B9%89%E8%A7%84%E5%88%99">用户自定义标识符的定义规则</h1>
<ul>
<li>以 Java 字母、下划线 <code>_</code> 或美元符号 <code>$</code> 开头，后面可跟 Java 字母、数字、下划线或美元符号。</li>
<li><code>$</code> 主要用于工具生成的名称，实际开发中应避免使用；Java 9 起，单独的 <code>_</code> 不能作为标识符。</li>
<li>标识符区分大小写。</li>
<li>标识符不能与保留字同名。</li>
<li>局部变量必须先声明并完成赋值后才能使用；字段和方法可以在源文件后面声明。</li>
<li>虽然<code>true</code>、<code>false</code>和<code>null</code>并不是关键字，但其代表的是值，也不可以用。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E5%88%86%E9%9A%94%E7%AC%A6">分隔符</h1>
<ul>
<li>空白字符和注释可以帮助编译器区分相邻的词法记号，但不是任意两个记号之间都必须有空格。
<ul>
<li>空白字符：空格、TAB、换行符与回车符</li>
<li>常见分隔符：<code>( ) [ ] { } , . ;</code>
<ul>
<li><code>{ }</code> 用于定义类体、方法体、代码块以及数组初始化等</li>
<li><code>;</code> 通常表示一条语句的结束</li>
<li><code>:</code> 用于标签、<code>switch</code> 的 <code>case</code>/<code>default</code> 和条件运算符</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%B3%A8%E9%87%8A">注释</h1>
<p>注释用来对程序中的代码做出解释。注释部分对程序的执行不产生任何影响，可增加程序的可读性，有利于程序的修改、调试、交流。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 这是一个单行注释             </span>
<span class="hljs-comment">/* 这是也是注释 *／
/*
  这是还是注释
  可以多行
*／

/**
 * 这也是多行注释
 * 但称为说明注释，跟代码文档相关
 */</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B">数据类型</h1>
<ul>
<li>基本数据类型</li>
<li>引用类型</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E5%9F%BA%E6%9C%AC%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B">基本数据类型</h1>
<h3 id="%E6%95%B0%E5%80%BC%E5%9E%8B">数值型</h3>
<ul>
<li>字节型：<code>byte</code>，短整型：<code>short</code>，整型：<code>int</code>，长整型：<code>long</code></li>
<li>单精度：<code>float</code>，双精度：<code>double</code></li>
<li>字符型：<code>char</code></li>
<li>布尔型：<code>boolean</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h6 id="%E6%95%B0%E6%8D%AE%E5%AD%98%E5%82%A8%E7%A9%BA%E9%97%B4%E5%A4%A7%E5%B0%8F">数据存储空间大小</h6>
<table>
<thead>
<tr>
<th>类型</th>
<th style="text-align:center">内存字节数</th>
<th style="text-align:right">数值范围</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>byte</code></td>
<td style="text-align:center">1</td>
<td style="text-align:right"><code>-128</code>～<code>127</code></td>
</tr>
<tr>
<td><code>short</code></td>
<td style="text-align:center">2</td>
<td style="text-align:right"><code>-32768</code>～<code>32767</code></td>
</tr>
<tr>
<td><code>int</code></td>
<td style="text-align:center">4</td>
<td style="text-align:right"><code>-2147483648</code>～<code>2147483647</code></td>
</tr>
<tr>
<td><code>long</code></td>
<td style="text-align:center">8</td>
<td style="text-align:right">whatever</td>
</tr>
<tr>
<td><code>float</code></td>
<td style="text-align:center">4</td>
<td style="text-align:right">who cares</td>
</tr>
<tr>
<td><code>double</code></td>
<td style="text-align:center">8</td>
<td style="text-align:right">holy crap</td>
</tr>
<tr>
<td><code>char</code></td>
<td style="text-align:center">2</td>
<td style="text-align:right"><code>\u0000</code>~<code>\uFFFF</code></td>
</tr>
<tr>
<td><code>boolean</code></td>
<td style="text-align:center">1</td>
<td style="text-align:right"><code>true</code> or <code>false</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E5%9F%BA%E6%9C%AC%E7%B1%BB%E5%9E%8B%E7%9A%84%E4%BD%8D%E5%AE%BD">基本类型的位宽</h1>
<p>在 C/C++ 中，<code>sizeof</code> 可用于查询类型或对象的大小。Java 不提供对应的语言运算符；基本类型的取值范围和规范规定的位宽是固定的，但对象、数组和引用的实际内存布局由具体 JVM 决定。下面的代码读取包装类提供的位宽常量，但不是对象内存占用的测量。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">sizeOf</span><span class="hljs-params">()</span> {  
    System.out.println(<span class="hljs-string">&quot;Integer: &quot;</span> + Integer.SIZE/<span class="hljs-number">8</span>);           <span class="hljs-comment">// 4  </span>
    System.out.println(<span class="hljs-string">&quot;Short: &quot;</span> + Short.SIZE/<span class="hljs-number">8</span>);               <span class="hljs-comment">// 2</span>
    System.out.println(<span class="hljs-string">&quot;Long: &quot;</span> + Long.SIZE/<span class="hljs-number">8</span>);                 <span class="hljs-comment">// 8  </span>
    System.out.println(<span class="hljs-string">&quot;Byte: &quot;</span> + Byte.SIZE/<span class="hljs-number">8</span>);                 <span class="hljs-comment">// 1  </span>
    System.out.println(<span class="hljs-string">&quot;Character: &quot;</span> + Character.SIZE/<span class="hljs-number">8</span>);       <span class="hljs-comment">// 2  </span>
    System.out.println(<span class="hljs-string">&quot;Float: &quot;</span> + Float.SIZE/<span class="hljs-number">8</span>);               <span class="hljs-comment">// 4  </span>
    System.out.println(<span class="hljs-string">&quot;Double: &quot;</span> + Double.SIZE/<span class="hljs-number">8</span>);             <span class="hljs-comment">// 8  </span>
}  
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E5%B8%B8%E9%87%8F">常量</h2>
<ul>
<li><code>final</code> 变量只能赋值一次，但 <code>final</code> 引用不代表引用的对象不可变。</li>
<li>通常使用 <code>static final</code> 声明类常量；基本类型或 <code>String</code> 使用常量表达式初始化时，才是编译期常量。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">WIDTH</span> <span class="hljs-operator">=</span> <span class="hljs-number">100</span>;
</code></pre>
<p>此处<code>100</code>称为字面值(Literal)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%95%B0%E5%AD%97%E5%AD%97%E9%9D%A2%E9%87%8F%E4%B8%AD%E7%9A%84%E4%B8%8B%E5%88%92%E7%BA%BF">数字字面量中的下划线</h1>
<p>Java SE 7 及更高版本允许在数字字面量的数字之间使用下划线 <code>_</code>，以分隔数字组并提高可读性。下划线不能出现在数字字面量的开头、结尾或小数点两侧。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">long</span> <span class="hljs-variable">creditCardNumber</span> <span class="hljs-operator">=</span> <span class="hljs-number">1234_5678_9012_3456L</span>;
</code></pre>
<p><a href="https://docs.oracle.com/javase/7/docs/technotes/guides/language/underscores-literals.html">Oracle 文档：数字字面量中的下划线</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E5%8F%98%E9%87%8F">变量</h2>
<ul>
<li>变量用来存放指定类型的数据，其值在程序运行过程中是可变的。</li>
<li>使用一个变量之前必须先声明它。一方面给该变量分配内存空间，另一方面防止在以后使用此变量时因错误输入而对不存在的变量进行操作。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span> a;
<span class="hljs-type">boolean</span> found=<span class="hljs-literal">false</span>;
<span class="hljs-type">float</span> b=<span class="hljs-number">0f</span>,c,d=<span class="hljs-number">1.3f</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E5%8F%98%E9%87%8F%E4%BD%9C%E7%94%A8%E5%9F%9F">变量作用域</h2>
<ul>
<li>变量有一定的生存期和有效范围；作用域指明名称可以被访问的代码区域，生存期则指变量或对象存在的时间。
<ul>
<li>局部变量：在方法或代码块中声明，作用域为声明它的代码块；</li>
<li>实例字段：属于对象，可以在类的实例方法中访问；</li>
<li>静态字段：属于类，可以通过类名访问；</li>
<li>方法参数：作用域为对应的方法或构造器；</li>
<li>异常参数：作用域为对应的 <code>catch</code> 代码块。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E8%BF%90%E7%AE%97%E7%AC%A6">运算符</h2>
<ul>
<li>程序中用来处理数据、表示数据运算、赋值和比较的符号称为运算符，参与运算的数据称为操作数。
<ul>
<li>算术运算符：<code>+</code>,<code>-</code>,<code>*</code>,<code>/</code>,<code>%</code>,<code>++</code>,<code>--</code>...</li>
<li>比较运算符: <code>&gt;</code>,<code>&lt;</code>,<code>==</code>,<code>!=</code>,<code>&gt;=</code>...</li>
<li>逻辑运算符：<code>!</code>,<code>&amp;&amp;</code>,<code>||</code>；对 <code>boolean</code> 使用 <code>&amp;</code>、<code>|</code>、<code>^</code> 时也可进行非短路逻辑运算</li>
<li>位运算符：<code>~</code>,<code>&amp;</code>,<code>|</code>,<code>^</code>,<code>&lt;&lt;</code>,<code>&gt;&gt;</code>,<code>&gt;&gt;&gt;</code></li>
<li>条件运算符：<code>?:</code></li>
<li>赋值运算符：<code>=</code>,<code>+=</code>,<code>-=</code>,<code>/=</code>...</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E8%A1%A8%E8%BE%BE%E5%BC%8Fexpression">表达式（Expression）</h2>
<ul>
<li>表达式是由操作数和运算符按照一定的语法形式组成的符号序列，计算出单一值。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">a = <span class="hljs-number">0</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">value1==value2
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-number">1</span> * <span class="hljs-number">2</span> * <span class="hljs-number">3</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E8%AF%AD%E5%8F%A5statement">语句（Statement）</h2>
<ul>
<li>赋值、递增递减、方法调用和对象创建等表达式加上 <code>;</code> 可以构成表达式语句</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">a=<span class="hljs-number">0</span>;
</code></pre>
<ul>
<li>还有局部变量声明语句、控制流语句、<code>return</code> 和 <code>throw</code> 等语句</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span> <span class="hljs-variable">cadence</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
anArray[<span class="hljs-number">0</span>] = <span class="hljs-number">100</span>;
System.out.println(<span class="hljs-string">&quot;Element 1 at index 0: &quot;</span> + anArray[<span class="hljs-number">0</span>]);

<span class="hljs-type">int</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span> + <span class="hljs-number">2</span>; <span class="hljs-comment">// result is now 3</span>
<span class="hljs-keyword">if</span> (value1 == value2)
    System.out.println(<span class="hljs-string">&quot;value1 == value2&quot;</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E5%9D%97block">块（Block）</h2>
<ul>
<li>块是位于成对大括号之间的零个或多个语句的语句组，可以在允许使用单一语句的任何位置使用块。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">BlockDemo</span> {
     <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
          <span class="hljs-type">boolean</span> <span class="hljs-variable">condition</span> <span class="hljs-operator">=</span> <span class="hljs-literal">true</span>;
          <span class="hljs-keyword">if</span> (condition) { <span class="hljs-comment">// begin block 1</span>
               System.out.println(<span class="hljs-string">&quot;Condition is true.&quot;</span>);
          } <span class="hljs-comment">// end block one</span>
          <span class="hljs-keyword">else</span> { <span class="hljs-comment">// begin block 2</span>
               System.out.println(<span class="hljs-string">&quot;Condition is false.&quot;</span>);
          } <span class="hljs-comment">// end block 2</span>
     }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E7%BC%96%E7%A0%81%E8%A7%84%E8%8C%83">编码规范</h1>
<ul>
<li>规范原则
<ul>
<li>尽量使用完整的英文描述符；</li>
<li>采用大小写混合使名字可读，采用适用于相关领域的术语；</li>
<li>尽量少用缩写，若已使用尽量明智，且在整个文件或工程中通用；</li>
<li>避免使用长的和类似的名字，或仅仅是大小写不同的名字；</li>
<li>除静态常量外，尽量少用下划线。</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E7%BA%A6%E5%AE%9A%E7%BB%86%E5%88%99---i">约定细则 - I</h1>
<ul>
<li>源文件命名规则
<ul>
<li>源程序中包含公共顶层类、接口或枚举的定义时，源文件名必须与该公共类型的名字一致；一个源文件至多只能有一个公共顶层类型；</li>
<li>源程序中不包含公共类时，文件名可以不与任何类名相同；</li>
<li>源程序中有多个类的定义，编译时将会为每个类生成一个class文件</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E7%BA%A6%E5%AE%9A%E7%BB%86%E5%88%99---ii">约定细则 - II</h1>
<ul>
<li>包：包名通常使用全小写字母，层级之间用点分隔，如 <code>java.awt.event</code></li>
<li>类／接口：类／接口名首字母大写，若由多个单词合成一个类名，要求每个单词的字母也要大写，如<code>MyFirstJava</code></li>
<li>方法：由多个单词组成的方法名首字母小写，中间的每个单词首字母大写，如<code>isButtonPressed</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E7%BA%A6%E5%AE%9A%E7%BB%86%E5%88%99---iii">约定细则 - III</h1>
<ul>
<li>变量：通常使用小驼峰命名法，如 <code>length</code>、<code>studentCount</code></li>
<li>常量：通常指 <code>static final</code> 字段，命名一般全大写，多个单词用下划线连接，如 <code>MAX_RETRY_COUNT</code></li>
<li>组件：使用完整的英文描述来说明组件的用途，尾部应该加上组件类型，如<code>okButton</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h3 id="%E7%A4%BA%E4%BE%8B">示例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">/*
Find Largest and Smallest Number in an Array Example
*/</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FindLargestSmallestNumber</span> {
        <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
                <span class="hljs-comment">//array of 10 numbers</span>
                <span class="hljs-type">int</span> numbers[] = <span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">32</span>,<span class="hljs-number">43</span>,<span class="hljs-number">53</span>,<span class="hljs-number">54</span>,<span class="hljs-number">32</span>,<span class="hljs-number">65</span>,<span class="hljs-number">63</span>,<span class="hljs-number">98</span>,<span class="hljs-number">43</span>,<span class="hljs-number">23</span>};
                <span class="hljs-comment">//assign first element of an array to largest and smallest</span>
                <span class="hljs-type">int</span> <span class="hljs-variable">smallest</span> <span class="hljs-operator">=</span> numbers[<span class="hljs-number">0</span>], largest = numbers[<span class="hljs-number">0</span>];
                <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> i=<span class="hljs-number">1</span>; i&lt; numbers.length; i++){
                        <span class="hljs-keyword">if</span>(numbers[i] &gt; largest)
                                largest = numbers[i];
                        <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (numbers[i] &lt; smallest)
                                smallest = numbers[i];
                }
                System.out.println(<span class="hljs-string">&quot;Largest Number is : &quot;</span> + largest);
                System.out.println(<span class="hljs-string">&quot;Smallest Number is : &quot;</span> + smallest);
        }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%8E%A7%E5%88%B6%E6%B5%81">控制流</h1>
<ul>
<li>Java 提供条件、循环和跳转等控制结构。常用关键字包括 <code>if-else</code>、<code>while</code>、<code>do-while</code>、<code>for</code>、<code>return</code>、<code>break</code>、<code>continue</code> 和 <code>switch</code>。</li>
<li><code>goto</code> 是保留字，但 Java 不提供 <code>goto</code> 语句。</li>
</ul>
<p>这与结构化程序设计的思想有关：程序流程应尽量由顺序、选择和循环组成，这样更容易阅读、测试和推理。<br />
这并不意味着机器指令中没有跳转，而是 Java 不把无结构跳转暴露为普通源代码语句。</p>
<p>Dijkstra，《<a href="https://dl.acm.org/doi/10.1145/362929.362947">Go To Statement Considered Harmful</a>》，Communications of the ACM，1968。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="true%E5%92%8Cfalse"><code>true</code>和<code>false</code></h1>
<p>所有的条件语句都利用条件表达式的“真”或“假”来决定执行路径。举例：<br />
<code>a == b</code>。它利用了条件表达式 <code>==</code> 来比较 <code>a</code> 与 <code>b</code> 的值是否相等。 该表达式返回 <code>true</code> 或 <code>false</code>。代码示例：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// control/TrueFalse.java</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TrueFalse</span> {
	<span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
		System.out.println(<span class="hljs-number">1</span> == <span class="hljs-number">1</span>);
		System.out.println(<span class="hljs-number">1</span> == <span class="hljs-number">2</span>);
	}
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="if-else"><code>if-else</code></h1>
<p><code>if-else</code> 语句是控制程序执行流程最基本的形式。 其中 <code>else</code> 是可选的，因此可以有两种形式的 <code>if</code>。代码示例：</p>
<p>以下是语法示意，<code>condition</code> 和 <code>statement</code> 需要替换为实际表达式和语句。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (condition)
	statement;
</code></pre>
<p>或</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (condition)
	statement;
<span class="hljs-keyword">else</span>
  statement;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E4%BE%8B">例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">IfElse</span> {
  <span class="hljs-keyword">static</span> <span class="hljs-type">int</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
  <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">test</span><span class="hljs-params">(<span class="hljs-type">int</span> testval, <span class="hljs-type">int</span> target)</span> {
    <span class="hljs-keyword">if</span>(testval &gt; target)
      result = <span class="hljs-number">1</span>;
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span>(testval &lt; target) 
      result = -<span class="hljs-number">1</span>;
    <span class="hljs-keyword">else</span>
      result = <span class="hljs-number">0</span>;
  }
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    test(<span class="hljs-number">10</span>, <span class="hljs-number">5</span>); System.out.println(result);
    test(<span class="hljs-number">5</span>, <span class="hljs-number">10</span>); System.out.println(result);
    test(<span class="hljs-number">5</span>, <span class="hljs-number">5</span>); System.out.println(result);
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E6%8E%A7%E5%88%B6%E8%AF%AD%E5%8F%A5%E8%BF%AD%E4%BB%A3%E8%AF%AD%E5%8F%A5">控制语句（迭代语句）</h1>
<p><code>while</code>，<code>do-while</code> 和 <code>for</code> 用来控制循环语句（有时也称迭代语句）。</p>
<p>只有控制循环的布尔表达式计算结果为 <code>false</code>，循环语句才会停止。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="while"><code>while</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">while</span> (condition)
  statement;
</code></pre>
<p>执行语句会在每一次循环前，判断布尔表达式返回值是否为 <code>true</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="do-while"><code>do-while</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">do</span>
  statement;
<span class="hljs-keyword">while</span> (condition);
</code></pre>
<p><code>while</code> 先判断条件，可能一次也不执行；<code>do-while</code> 先执行循环体，再判断条件，因此至少执行一次。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="for"><code>for</code></h1>
<p><code>for</code>循环可能是最常用的迭代形式。 该循环在第一次迭代之前执行初始化。随后，它会执行布尔表达式，并在每次迭代结束时，进行某种形式的步进。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">for</span> (initialization; condition; update)
  statement;
</code></pre>
<p>初始化表达式、布尔表达式，或者步进运算都可以为空。每次迭代之前都会判断布尔表达式的结果是否成立，一旦为 <code>false</code>，则跳出 <code>for</code> 循环体并继续执行后面代码。 每次循环结束时，都会执行一次步进。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E4%BE%8B-1">例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ListCharacters</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-keyword">for</span>(<span class="hljs-type">char</span> <span class="hljs-variable">c</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; c &lt; <span class="hljs-number">128</span>; c++)
      <span class="hljs-keyword">if</span>(Character.isLowerCase(c))
        System.out.println(<span class="hljs-string">&quot;value: &quot;</span> + (<span class="hljs-type">int</span>)c + <span class="hljs-string">&quot; character: &quot;</span> + c);
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="for-%E4%B8%AD%E7%9A%84%E9%80%97%E5%8F%B7"><code>for</code> 中的逗号</h2>
<p>Java 没有 C/C++ 意义上可独立使用的逗号运算符。逗号可以在 <code>for</code> 循环的初始化和更新部分分隔多个表达式；同一声明中的变量共享同一类型。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ForComma</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span>, j = i + <span class="hljs-number">10</span>; i &lt; <span class="hljs-number">5</span>; i++, j = i * <span class="hljs-number">2</span>) {
      System.out.println(<span class="hljs-string">&quot;i = &quot;</span> + i + <span class="hljs-string">&quot; j = &quot;</span> + j);
    }
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="%E5%A2%9E%E5%BC%BA-for-%E8%AF%AD%E6%B3%95">增强 <code>for</code> 语法</h1>
<p>Java 5 引入了更简洁的增强 <code>for</code> 循环，用于遍历数组和实现 <code>Iterable</code> 的集合，不需要手动维护索引和步进变量。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ForInFloat</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-type">Random</span> <span class="hljs-variable">rand</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Random</span>(<span class="hljs-number">47</span>);
    <span class="hljs-type">float</span>[] f = <span class="hljs-keyword">new</span> <span class="hljs-title class_">float</span>[<span class="hljs-number">10</span>];
    <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">10</span>; i++)
      f[i] = rand.nextFloat();
    <span class="hljs-keyword">for</span>(<span class="hljs-type">float</span> x : f)
      System.out.println(x);
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="return"><code>return</code></h1>
<p><code>return</code> 用于结束当前方法并返回结果（如果方法有返回值）。<code>break</code> 用于结束循环或 <code>switch</code>，<code>continue</code> 用于跳过本次循环的剩余部分；<code>break</code> 和 <code>continue</code> 可以与标签配合使用。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TestWithReturn</span> {
  <span class="hljs-keyword">static</span> <span class="hljs-type">int</span> <span class="hljs-title function_">test</span><span class="hljs-params">(<span class="hljs-type">int</span> testval, <span class="hljs-type">int</span> target)</span> {
    <span class="hljs-keyword">if</span>(testval &gt; target)
      <span class="hljs-keyword">return</span> +<span class="hljs-number">1</span>;
    <span class="hljs-keyword">if</span>(testval &lt; target)
      <span class="hljs-keyword">return</span> -<span class="hljs-number">1</span>;
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>; <span class="hljs-comment">// Match</span>
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="break-%E5%92%8C-continue"><code>break</code> 和 <code>continue</code></h1>
<p>在任何迭代语句的主体内，都可以使用 <code>break</code> 和 <code>continue</code> 来控制循环的流程。 其中，<code>break</code> 表示跳出当前循环体。而 <code>continue</code> 表示停止本次循环，开始下一次循环。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="switch">switch</h2>
<p><code>switch</code> 是一种选择结构，可以根据 <code>byte</code>、<code>short</code>、<code>char</code>、<code>int</code>、字符串、枚举或对应包装类型的值选择执行分支。它的格式如下：</p>
<p>以下是语法示意，不是可直接编译的完整程序。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">switch</span> (selector) {
	<span class="hljs-keyword">case</span> value1: statement; <span class="hljs-keyword">break</span>;
	<span class="hljs-keyword">case</span> value2: statement; <span class="hljs-keyword">break</span>;
	<span class="hljs-keyword">case</span> value3: statement; <span class="hljs-keyword">break</span>;
	<span class="hljs-keyword">case</span> value4: statement; <span class="hljs-keyword">break</span>;
	<span class="hljs-keyword">case</span> value5: statement; <span class="hljs-keyword">break</span>;
	<span class="hljs-comment">// ...</span>
	<span class="hljs-keyword">default</span>: statement;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="switch-%E5%AD%97%E7%AC%A6%E4%B8%B2"><code>switch</code> 字符串</h1>
<p>Java 7 起支持对字符串使用 <code>switch</code>。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">StringSwitch</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-type">String</span> <span class="hljs-variable">color</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;red&quot;</span>;
    <span class="hljs-keyword">switch</span>(color) {
      <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;red&quot;</span>:
        System.out.println(<span class="hljs-string">&quot;RED&quot;</span>);
        <span class="hljs-keyword">break</span>;
      <span class="hljs-keyword">default</span>:
        System.out.println(<span class="hljs-string">&quot;Unknown&quot;</span>);
        <span class="hljs-keyword">break</span>;
    }
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-background-color="#fff" data-theme="gaia" lang="C" style="--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;">
<h2 id="%E5%8F%82%E8%80%83">参考</h2>
<p>Java 语言基础（Oracle 官方教程）</p>
<p><small><a href="https://docs.oracle.com/javase/tutorial/java/nutsandbolts/index.html">Language Basics</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-background-color="#fff" data-class="kotlin-comparison" data-theme="gaia" lang="C" class="kotlin-comparison" style="--background-color:#fff;--class:kotlin-comparison;--theme:gaia;background-color:#fff;background-image:none;">
<h1 id="java-%E4%B8%8E-kotlin-%E5%AF%B9%E6%AF%94">Java 与 Kotlin 对比</h1>
<table>
<thead>
<tr>
<th style="text-align:left">特性</th>
<th style="text-align:left">Java</th>
<th style="text-align:left">Kotlin</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><small><strong>变量声明</strong></small></td>
<td style="text-align:left"><small>字段和参数通常显式指定类型；Java 10 起局部变量可使用 <code>var</code>。</small></td>
<td style="text-align:left"><small>支持<strong>类型推断</strong>，可以使用 <code>val</code>（不可变）或 <code>var</code>（可变）。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>空安全</strong></small></td>
<td style="text-align:left"><small>引用类型默认可为空，易产生 <code>NullPointerException</code>。</small></td>
<td style="text-align:left"><small>类型系统区分<strong>可空</strong>与<strong>非空</strong>，可空类型需用 <code>?</code> 声明。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>控制结构</strong></small></td>
<td style="text-align:left"><small><code>if</code> 始终是<strong>语句（Statement）</strong>；Java 14 起 <code>switch</code> 也可以作为表达式。</small></td>
<td style="text-align:left"><small><code>if</code>、<code>when</code> 等为<strong>表达式（Expression）</strong>，可以返回值。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>操作符</strong></small></td>
<td style="text-align:left"><small>无内置空安全操作符。</small></td>
<td style="text-align:left"><small>提供了<strong>安全调用操作符 <code>?.</code></strong> 和 <strong>Elvis 操作符 <code>?:</code></strong>。</small></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-background-color="#fff" data-class="kotlin-comparison" data-theme="gaia" lang="C" class="kotlin-comparison" style="--background-color:#fff;--class:kotlin-comparison;--theme:gaia;background-color:#fff;background-image:none;">
<table>
<thead>
<tr>
<th style="text-align:left">特性</th>
<th style="text-align:left">Java</th>
<th style="text-align:left">Kotlin</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><small><strong>扩展函数</strong></small></td>
<td style="text-align:left"><small>不支持此特性。</small></td>
<td style="text-align:left"><small>支持<strong>扩展函数</strong>，可在不修改原类的情况下添加新方法。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>数据类</strong></small></td>
<td style="text-align:left"><small>Java 16 起可使用 <code>record</code> 声明简洁的数据载体，但语义不完全等同于 Kotlin 的 <code>data class</code>。</small></td>
<td style="text-align:left"><small>内置 <code>data class</code>，编译器自动生成 <code>equals()</code>、<code>hashCode()</code> 等方法。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>分号</strong></small></td>
<td style="text-align:left"><small>大多数表达式、声明和控制语句以分号 <code>;</code> 结束。</small></td>
<td style="text-align:left"><small>分号是可选的，通常不使用。</small></td>
</tr>
<tr>
<td style="text-align:left"><small><strong>并发</strong></small></td>
<td style="text-align:left"><small>主要使用线程、锁和并发工具类。</small></td>
<td style="text-align:left"><small>常使用协程库简化异步和并发代码；具体开销仍取决于实现和场景。</small></td>
</tr>
</tbody>
</table>
<p>Java 与 Kotlin 都可以运行在 JVM 上。对比它们有助于理解 Java 的显式、兼容性优先设计，以及 Kotlin 在空安全、类型推断和表达式语法方面提供的改进。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-background-color="#fff" data-class="kotlin-comparison" data-theme="gaia" lang="C" class="kotlin-comparison" style="--background-color:#fff;--class:kotlin-comparison;--theme:gaia;background-color:#fff;background-image:none;">
<p>Java</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Java"><span class="hljs-comment">// if是一个语句，不能直接赋值</span>
<span class="hljs-type">int</span> max;
<span class="hljs-keyword">if</span> (a &gt; b) {
    max = a;
} <span class="hljs-keyword">else</span> {
    max = b;
}
</code></pre>
<p>Kotlin更简洁、更具函数式编程的风格</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-Kotlin"><span class="hljs-comment">// if是一个表达式，可以直接赋值</span>
<span class="hljs-keyword">val</span> max = <span class="hljs-keyword">if</span> (a &gt; b) a <span class="hljs-keyword">else</span> b
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-background-color="#fff" data-class="kotlin-comparison" data-theme="gaia" lang="C" class="kotlin-comparison" style="--background-color:#fff;--class:kotlin-comparison;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/happy.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="43" data-background-color="#fff" data-class="kotlin-comparison" data-theme="gaia" lang="C" class="kotlin-comparison" style="--background-color:#fff;--class:kotlin-comparison;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-advanced-background="content"></section>
