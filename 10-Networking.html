<h2 id="%E7%BD%91%E7%BB%9C%E7%BC%96%E7%A8%8B">网络编程</h2>

<h1 id="networking">Networking</h1>

<p>Computers running on the Internet communicate to each other using either the Transmission Control Protocol (TCP) or the User Datagram Protocol (UDP).</p>
<p>When you write Java programs that communicate over the network, you are programming at the application layer.</p>
<p><small><a href="https://docs.oracle.com/javase/tutorial/networking/overview/networking.html">https://docs.oracle.com/javase/tutorial/networking/overview/networking.html</a></small></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="2" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="%E5%9F%BA%E6%9C%AC%E6%A6%82%E5%BF%B5">基本概念</h1>
<ul>
<li><small>TCP (Transmission Control Protocol) is a connection-based protocol that provides a reliable flow of data between two computers.</small></li>
<li><small>UDP (User Datagram Protocol) is a protocol that sends independent packets of data, called datagrams, from one computer to another with no guarantees about arrival.</small></li>
<li><small>The TCP and UDP protocols use ports to map incoming data to a particular process running on a computer. </small></li>
<li><small>The Hypertext Transfer Protocol (HTTP), File Transfer Protocol (FTP), and Telnet are all examples of applications that require a reliable communication channel. </small></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="url">URL</h1>
<p>URL is an acronym for Uniform Resource Locator and is a reference (an address) to a resource on the Internet. For instance: <a href="http://example.com">http://example.com</a></p>
<ul>
<li>Protocol identifier</li>
<li>Resource name
<ul>
<li>Host Name</li>
<li>Filename</li>
<li>Port Number</li>
<li>Reference</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">URL</span> <span class="hljs-variable">oracle</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">URL</span>(<span class="hljs-string">&quot;http://www.oracle.com/&quot;</span>);
    <span class="hljs-type">BufferedReader</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">InputStreamReader</span>(oracle.openStream()));

    String inputLine;
    <span class="hljs-keyword">while</span> ((inputLine = in.readLine()) != <span class="hljs-literal">null</span>)
        System.out.println(inputLine);

}
</code></pre>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">try</span> {
    <span class="hljs-type">URL</span> <span class="hljs-variable">myURL</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">URL</span>(<span class="hljs-string">&quot;http://example.com/&quot;</span>);

</section>

<h1 id="writing-to-a-urlconnection">Writing to a URLConnection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">stringToReverse</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;Hello World&quot;</span>;
<span class="hljs-type">URL</span> <span class="hljs-variable">url</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">URL</span>(<span class="hljs-string">&quot;http://example.com/servlet/ReverseServlet&quot;</span>);
<span class="hljs-type">URLConnection</span> <span class="hljs-variable">connection</span> <span class="hljs-operator">=</span> url.openConnection();

<span class="hljs-type">OutputStreamWriter</span> <span class="hljs-variable">out</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">OutputStreamWriter</span>(connection.getOutputStream());
out.write(<span class="hljs-string">&quot;string=&quot;</span> + stringToReverse);

<span class="hljs-type">BufferedReader</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InputStreamReader</span>(connection.getInputStream()));
String decodedString;
<span class="hljs-keyword">while</span> ((decodedString = in.readLine()) != <span class="hljs-literal">null</span>) {
    System.out.println(decodedString);
}
    in.close();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="http%E5%AE%A2%E6%88%B7%E7%AB%AFjava-11">HTTP客户端（Java 11+）</h2>
<p>Java 11引入了新的<code>HttpClient</code>，支持HTTP/2、异步请求和响应式流。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 同步请求</span>
<span class="hljs-type">HttpClient</span> <span class="hljs-variable">client</span> <span class="hljs-operator">=</span> HttpClient.newHttpClient();
<span class="hljs-type">HttpRequest</span> <span class="hljs-variable">request</span> <span class="hljs-operator">=</span> HttpRequest.newBuilder()
    .uri(URI.create(<span class="hljs-string">&quot;https://api.example.com/data&quot;</span>))
    .timeout(Duration.ofSeconds(<span class="hljs-number">10</span>))
    .header(<span class="hljs-string">&quot;Content-Type&quot;</span>, <span class="hljs-string">&quot;application/json&quot;</span>)
    .POST(HttpRequest.BodyPublishers.ofString(<span class="hljs-string">&quot;{\&quot;key\&quot;:\&quot;value\&quot;}&quot;</span>))
    .build();

HttpResponse&lt;String&gt; response = client.send(request, 
    HttpResponse.BodyHandlers.ofString());
System.out.println(response.statusCode());
System.out.println(response.body());
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="%E5%BC%82%E6%AD%A5http%E8%AF%B7%E6%B1%82">异步HTTP请求</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 异步请求</span>
<span class="hljs-type">HttpClient</span> <span class="hljs-variable">client</span> <span class="hljs-operator">=</span> HttpClient.newBuilder()
    .executor(Executors.newFixedThreadPool(<span class="hljs-number">10</span>))
    .build();

<span class="hljs-type">HttpRequest</span> <span class="hljs-variable">request</span> <span class="hljs-operator">=</span> HttpRequest.newBuilder()
    .uri(URI.create(<span class="hljs-string">&quot;https://api.example.com/data&quot;</span>))
    .build();

CompletableFuture&lt;HttpResponse&lt;String&gt;&gt; future = 
    client.sendAsync(request, HttpResponse.BodyHandlers.ofString());

future.thenApply(HttpResponse::body).thenAccept(System.out::println).join();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="http2%E7%89%B9%E6%80%A7">HTTP/2特性</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">HttpClient</span> <span class="hljs-variable">client</span> <span class="hljs-operator">=</span> HttpClient.newBuilder()
    .version(HttpClient.Version.HTTP_2)  <span class="hljs-comment">// 使用HTTP/2</span>
    .build();
</code></pre>
<p><strong>HTTP/2 vs HTTP/1.1</strong>：</p>
<ul>
<li>HTTP/2：多路复用，头部压缩，服务器推送</li>
<li>HTTP/1.1：每个请求一个连接，头部冗余</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="websocket">WebSocket</h3>
<p>WebSocket提供全双工通信，适合实时应用（长连接）。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">WebSocket</span> <span class="hljs-variable">webSocket</span> <span class="hljs-operator">=</span> HttpClient.newHttpClient()
    .newWebSocketBuilder().buildAsync(URI.create(<span class="hljs-string">&quot;ws://localhost:8080/chat&quot;</span>), 
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">WebSocket</span>.Listener() {
            <span class="hljs-meta">@Override</span>
            <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">onOpen</span><span class="hljs-params">(WebSocket webSocket)</span> {
                webSocket.sendText(<span class="hljs-string">&quot;Hello Server&quot;</span>, <span class="hljs-literal">true</span>);
            }
            <span class="hljs-meta">@Override</span>
            <span class="hljs-keyword">public</span> CompletionStage&lt;?&gt; onText(WebSocket webSocket, CharSequence data, <span class="hljs-type">boolean</span> last) {
                System.out.println(<span class="hljs-string">&quot;Received: &quot;</span> + data);
                <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
            }
        }).join();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="websocket%E6%9C%8D%E5%8A%A1%E5%99%A8jsr-356">WebSocket服务器（JSR 356）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ServerEndpoint(&quot;/chat&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ChatEndpoint</span> {
    <span class="hljs-meta">@OnOpen</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">onOpen</span><span class="hljs-params">(Session session)</span> {System.out.println(<span class="hljs-string">&quot;Client connected: &quot;</span> + session.getId()); }
    <span class="hljs-meta">@OnMessage</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">onMessage</span><span class="hljs-params">(String message, Session session)</span> {
        session.getOpenSessions().forEach(s -&gt; {
            <span class="hljs-keyword">try</span> {
                s.getBasicRemote().sendText(message);  <span class="hljs-comment">//广播消息给所有客户端</span>
            } <span class="hljs-keyword">catch</span> (IOException e) { e.printStackTrace(); });
    }
    <span class="hljs-meta">@OnClose</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">onClose</span><span class="hljs-params">(Session session)</span> {System.out.println(<span class="hljs-string">&quot;Client disconnected: &quot;</span> + session.getId());}
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="sockets">Sockets</h1>
<p>URLs and URLConnections provide a relatively high-level mechanism for accessing resources on the Internet. Sometimes your programs require lower-level network communication, for example, when you want to write a client-server application.</p>
<p>To communicate over TCP, a client program and a server program establish a connection to one another. Each program binds a <b>socket</b> to its end of the connection. To communicate, the client and the server each reads from and writes to the socket bound to the connection.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="socket">Socket</h1>
<p>A socket is one endpoint of a two-way communication link between two programs running on the network. A socket is bound to a port number so that the TCP layer can identify the application that data is destined to be sent to.</p>
<p><img src="images/13/socket.png" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/13/server.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="server-listen">Server listen</h1>
<p>A server runs on a specific computer and has a socket that is bound to a specific port number.</p>
<p>The server just waits, listening to the socket for a client to make a connection request.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">ServerSocket</span> <span class="hljs-variable">serverSocket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ServerSocket</span>(<span class="hljs-number">80</span>);
</code></pre>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/13/accept.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="17" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="client-connect">Client connect</h1>
<p>The client knows the hostname of the machine on which the server is running and the port number on which the server is listening. The client also needs to identify itself to the server so it binds to a local port number that it will use during this connection.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">echoSocket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Socket</span>(hostName, portNumber);
</code></pre>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/13/accept.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="18" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="56" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="server-accept">Server accept</h1>
<p>If everything goes well, the server accepts the connection. Upon acceptance, the server gets a new socket bound to the same local port and also has its remote endpoint set to the address and port of the client. It needs a new socket so that it can continue to listen to the original socket for connection requests while tending to the needs of the connected client.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">clientSocket</span> <span class="hljs-operator">=</span> serverSocket.accept();     
</code></pre>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="56" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/13/readwrite.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="56" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="client-server-communication">Client-server communication</h1>
<p>The client and server can now communicate by writing to or reading from their sockets.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="%E5%BA%8F%E5%88%97%E5%8C%96%E4%B8%8E%E7%BD%91%E7%BB%9C%E4%BC%A0%E8%BE%93">序列化与网络传输</h2>
<h3 id="java%E5%BA%8F%E5%88%97%E5%8C%96">Java序列化</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 发送对象</span>
<span class="hljs-type">ObjectOutputStream</span> <span class="hljs-variable">oos</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ObjectOutputStream</span>(
    socket.getOutputStream());
oos.writeObject(<span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>(<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-number">25</span>));
oos.flush();

<span class="hljs-comment">// 接收对象</span>
<span class="hljs-type">ObjectInputStream</span> <span class="hljs-variable">ois</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ObjectInputStream</span>(
    socket.getInputStream());
<span class="hljs-type">User</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> (User) ois.readObject();
</code></pre>
<p>但是：性能差，序列化后体积大；安全性问题；版本兼容性差</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="%E9%AB%98%E6%95%88%E5%BA%8F%E5%88%97%E5%8C%96%E6%96%B9%E6%A1%88">高效序列化方案</h3>
<h4 id="1-jsonjacksongson">1. JSON（Jackson/Gson）</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 使用Jackson</span>
<span class="hljs-type">ObjectMapper</span> <span class="hljs-variable">mapper</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ObjectMapper</span>();
<span class="hljs-type">String</span> <span class="hljs-variable">json</span> <span class="hljs-operator">=</span> mapper.writeValueAsString(user);
<span class="hljs-type">User</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> mapper.readValue(json, User.class);

<span class="hljs-comment">// 优点：可读性好，跨语言</span>
<span class="hljs-comment">// 缺点：体积较大，性能一般</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h4 id="2-protobuf%E6%8E%A8%E8%8D%90">2. Protobuf（推荐）</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-proto"><span class="hljs-keyword">message </span><span class="hljs-title class_">User</span> {
   <span class="hljs-type">string</span> name = <span class="hljs-number">1</span>;
   <span class="hljs-type">int32</span> age = <span class="hljs-number">2</span>;
}
protoc --java_out=./src/main/java user.proto
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 序列化</span>
UserProto.<span class="hljs-type">User</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> UserProto.User.newBuilder().setName(<span class="hljs-string">&quot;Alice&quot;</span>).setAge(<span class="hljs-number">25</span>).build();
<span class="hljs-type">byte</span>[] data = user.toByteArray();
<span class="hljs-comment">// 反序列化</span>
UserProto.<span class="hljs-type">User</span> <span class="hljs-variable">parsed</span> <span class="hljs-operator">=</span> UserProto.User.parseFrom(data);
</code></pre>
<p>体积小，性能高；跨语言支持；向后兼容</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="socket%E9%80%89%E9%A1%B9">Socket选项</h2>
<h3 id="tcp_nodelay">TCP_NODELAY</h3>
<p>禁用Nagle算法，减少延迟。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Socket</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8080</span>);
socket.setTcpNoDelay(<span class="hljs-literal">true</span>);  <span class="hljs-comment">// 禁用Nagle算法</span>
</code></pre>
<p><strong>Nagle算法</strong>：将多个小数据包合并发送，减少网络开销<br />
<strong>适用场景</strong>：实时性要求高的应用（如游戏、实时通信）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="so_reuseaddr">SO_REUSEADDR</h3>
<p>允许端口复用，解决TIME_WAIT状态下的端口占用问题。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">ServerSocket</span> <span class="hljs-variable">serverSocket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ServerSocket</span>();
serverSocket.setReuseAddress(<span class="hljs-literal">true</span>);  <span class="hljs-comment">// 允许端口复用</span>
serverSocket.bind(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InetSocketAddress</span>(<span class="hljs-number">8080</span>));
</code></pre>
<p><strong>作用</strong>：允许在TIME_WAIT状态下重新绑定端口<br />
<strong>适用场景</strong>：服务器重启时快速恢复</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="so_keepalive">SO_KEEPALIVE</h3>
<p>启用TCP保活机制，检测连接是否存活。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Socket</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8080</span>);
socket.setKeepAlive(<span class="hljs-literal">true</span>);  <span class="hljs-comment">// 启用保活机制</span>
</code></pre>
<p><strong>保活机制</strong>：</p>
<ul>
<li>默认2小时无数据后发送探测包</li>
<li>探测包失败后关闭连接</li>
<li>可检测到网络中断、主机崩溃等情况</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="so_timeout">SO_TIMEOUT</h3>
<p>设置Socket读取超时时间。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Socket</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8080</span>);
socket.setSoTimeout(<span class="hljs-number">5000</span>);  <span class="hljs-comment">// 5秒超时</span>
</code></pre>
<p><strong>超时类型</strong>：</p>
<ul>
<li><strong>连接超时</strong>：<code>connect()</code>操作的超时</li>
<li><strong>读取超时</strong>：<code>read()</code>操作的超时</li>
<li><strong>写入超时</strong>：通常不超时，由操作系统控制</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="%E7%BC%93%E5%86%B2%E5%8C%BA%E5%A4%A7%E5%B0%8F%E8%AE%BE%E7%BD%AE">缓冲区大小设置</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Socket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Socket</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8080</span>);
socket.setReceiveBufferSize(<span class="hljs-number">64</span> * <span class="hljs-number">1024</span>);  <span class="hljs-comment">// 64KB接收缓冲区</span>
socket.setSendBufferSize(<span class="hljs-number">64</span> * <span class="hljs-number">1024</span>);     <span class="hljs-comment">// 64KB发送缓冲区</span>
</code></pre>
<p><strong>缓冲区大小</strong>：</p>
<ul>
<li>默认值：通常8KB（系统相关）</li>
<li>建议值：根据网络延迟和带宽调整</li>
<li>过大：浪费内存，增加延迟</li>
<li>过小：频繁系统调用，降低性能</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="udp%E7%BC%96%E7%A8%8B">UDP编程</h2>
<h3 id="datagramsocket%E5%92%8Cdatagrampacket">DatagramSocket和DatagramPacket</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// UDP服务器</span>
<span class="hljs-type">DatagramSocket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramSocket</span>(<span class="hljs-number">8888</span>);
<span class="hljs-type">byte</span>[] buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">byte</span>[<span class="hljs-number">1024</span>];
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">packet</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(buffer, buffer.length);

socket.receive(packet);  <span class="hljs-comment">// 阻塞等待数据</span>
<span class="hljs-type">String</span> <span class="hljs-variable">message</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(packet.getData(), <span class="hljs-number">0</span>, packet.getLength());
System.out.println(<span class="hljs-string">&quot;Received: &quot;</span> + message);

<span class="hljs-comment">// 发送响应</span>
<span class="hljs-type">InetAddress</span> <span class="hljs-variable">clientAddress</span> <span class="hljs-operator">=</span> packet.getAddress();
<span class="hljs-type">int</span> <span class="hljs-variable">clientPort</span> <span class="hljs-operator">=</span> packet.getPort();
<span class="hljs-type">byte</span>[] response = <span class="hljs-string">&quot;Hello Client&quot;</span>.getBytes();
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">responsePacket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(
    response, response.length, clientAddress, clientPort);
socket.send(responsePacket);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="udp%E5%AE%A2%E6%88%B7%E7%AB%AF">UDP客户端</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// UDP客户端</span>
<span class="hljs-type">DatagramSocket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramSocket</span>();
<span class="hljs-type">String</span> <span class="hljs-variable">message</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;Hello Server&quot;</span>;
<span class="hljs-type">byte</span>[] data = message.getBytes();

<span class="hljs-type">InetAddress</span> <span class="hljs-variable">serverAddress</span> <span class="hljs-operator">=</span> InetAddress.getByName(<span class="hljs-string">&quot;localhost&quot;</span>);
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">packet</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(
    data, data.length, serverAddress, <span class="hljs-number">8888</span>);
socket.send(packet);

<span class="hljs-comment">// 接收响应</span>
<span class="hljs-type">byte</span>[] buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">byte</span>[<span class="hljs-number">1024</span>];
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">response</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(buffer, buffer.length);
socket.receive(response);
<span class="hljs-type">String</span> <span class="hljs-variable">reply</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(response.getData(), <span class="hljs-number">0</span>, response.getLength());
System.out.println(<span class="hljs-string">&quot;Reply: &quot;</span> + reply);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="udp%E5%B9%BF%E6%92%AD%E5%92%8C%E7%BB%84%E6%92%AD">UDP广播和组播</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 广播</span>
<span class="hljs-type">DatagramSocket</span> <span class="hljs-variable">socket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramSocket</span>();
socket.setBroadcast(<span class="hljs-literal">true</span>);

<span class="hljs-type">InetAddress</span> <span class="hljs-variable">broadcastAddress</span> <span class="hljs-operator">=</span> InetAddress.getByName(<span class="hljs-string">&quot;255.255.255.255&quot;</span>);
<span class="hljs-type">byte</span>[] data = <span class="hljs-string">&quot;Broadcast Message&quot;</span>.getBytes();
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">packet</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(
    data, data.length, broadcastAddress, <span class="hljs-number">8888</span>);
socket.send(packet);

<span class="hljs-comment">// 组播（Multicast）</span>
<span class="hljs-type">MulticastSocket</span> <span class="hljs-variable">multicastSocket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">MulticastSocket</span>(<span class="hljs-number">8888</span>);
<span class="hljs-type">InetAddress</span> <span class="hljs-variable">group</span> <span class="hljs-operator">=</span> InetAddress.getByName(<span class="hljs-string">&quot;230.0.0.1&quot;</span>);
multicastSocket.joinGroup(group);

<span class="hljs-type">byte</span>[] buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">byte</span>[<span class="hljs-number">1024</span>];
<span class="hljs-type">DatagramPacket</span> <span class="hljs-variable">packet</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DatagramPacket</span>(buffer, buffer.length);
multicastSocket.receive(packet);
</code></pre>
<p>广播：服务发现、局域网通知；组播：视频直播、多人游戏</p>
</section>

<h1 id="thread-context-switch">Thread Context Switch</h1>
<p><a href="https://en.wikipedia.org/wiki/Context_switch">https://en.wikipedia.org/wiki/Context_switch</a></p>
<p><a href="http://tutorials.jenkov.com/java-concurrency/costs.html">http://tutorials.jenkov.com/java-concurrency/costs.html</a></p>

<p><a href="https://blog.tsunanet.net/2010/11/how-long-does-it-take-to-make-context.html">https://blog.tsunanet.net/2010/11/how-long-does-it-take-to-make-context.html</a></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="non-blocking-io">Non-blocking I/O</h1>
<p>With non-blocking I/O, we can use a single thread to handle multiple concurrent connections.</p>
<ul>
<li>Buffer</li>
<li>Channel</li>
<li><strong>Selector</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="selector">Selector</h1>
<p>Java NIO has a class called &quot;Selector&quot; that allows a single thread to examine I/O events on multiple channels. That is, this selector can check the readiness of a channel for operations, such as reading and writing.</p>
<p><img src="images/13/selector.png" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90">看个例子</h1>
<p><a href="https://medium.com/coderscorner/tale-of-client-server-and-socket-a6ef54a74763">https://medium.com/coderscorner/tale-of-client-server-and-socket-a6ef54a74763</a></p>
<p><a href="https://github.com/arukshani/JavaIOAndNIO">https://github.com/arukshani/JavaIOAndNIO</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56"></section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="selector%E5%BA%95%E5%B1%82%E5%AE%9E%E7%8E%B0%E6%93%8D%E4%BD%9C%E7%B3%BB%E7%BB%9Fio%E5%A4%9A%E8%B7%AF%E5%A4%8D%E7%94%A8">Selector底层实现：操作系统IO多路复用</h2>
<p>Java NIO的Selector底层使用操作系统提供的IO多路复用机制：</p>
<table>
<thead>
<tr>
<th>操作系统</th>
<th>底层实现</th>
<th>特点</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Linux</strong></td>
<td>epoll</td>
<td>高效，支持大量连接</td>
</tr>
<tr>
<td><strong>macOS/BSD</strong></td>
<td>kqueue</td>
<td>高效，事件驱动</td>
</tr>
<tr>
<td><strong>Windows</strong></td>
<td>select</td>
<td>传统方式，效率较低</td>
</tr>
<tr>
<td><strong>Solaris</strong></td>
<td>/dev/poll</td>
<td>高效</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="epoll%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86">epoll工作原理</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Java NIO Selector</span>
<span class="hljs-type">Selector</span> <span class="hljs-variable">selector</span> <span class="hljs-operator">=</span> Selector.open();
channel.configureBlocking(<span class="hljs-literal">false</span>);
channel.register(selector, SelectionKey.OP_READ);

<span class="hljs-comment">// 底层调用</span>
<span class="hljs-comment">// epoll_create() - 创建epoll实例</span>
<span class="hljs-comment">// epoll_ctl() - 注册/修改/删除事件</span>
<span class="hljs-comment">// epoll_wait() - 等待事件就绪</span>
</code></pre>
<ul>
<li><strong>O(1)时间复杂度</strong>：事件就绪时直接通知，无需遍历</li>
<li><strong>支持大量连接</strong>：不受文件描述符限制</li>
<li><strong>边缘触发模式</strong>：减少系统调用次数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="selector-%E4%BD%BF%E7%94%A8%E4%B8%AD%E7%9A%84%E6%8C%91%E6%88%98">Selector 使用中的挑战</h2>
<ul>
<li>事件处理逻辑复杂
<ul>
<li>所有事件处理都在一个循环中</li>
<li>业务逻辑与IO处理耦合，代码难以维护和扩展</li>
</ul>
</li>
<li>单线程性能瓶颈
<ul>
<li>如果某个连接处理耗时会阻塞其他连接，无法充分利用多核CPU</li>
<li>需要引入线程池处理业务逻辑</li>
</ul>
</li>
<li>事件分发不够清晰
<ul>
<li>需要手动判断事件类型，缺少统一的事件分发机制</li>
<li>错误处理分散在各处</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="56" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/15/dls.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="56" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="reactor-%E6%A8%A1%E5%BC%8F">Reactor 模式</h2>
<p><a href="https://en.wikipedia.org/wiki/Reactor_pattern">https://en.wikipedia.org/wiki/Reactor_pattern</a></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="" data-marpit-pagination-total="56" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="reactor%E6%A8%A1%E5%BC%8F">Reactor模式</h2>
<h3 id="%E5%8D%95%E7%BA%BF%E7%A8%8Breactor">单线程Reactor</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Reactor线程
├── 监听连接事件
├── 分发事件到Handler
└── 处理IO读写

Handler
├── 处理连接
├── 处理读取
└── 处理写入
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="reactor%E6%A8%A1%E5%BC%8F-1">Reactor模式</h3>
<p><strong>核心组件</strong>：</p>
<ul>
<li><strong>Selector</strong>：事件分发器，监听多个Channel</li>
<li><strong>ServerSocketChannel</strong>：监听连接事件</li>
<li><strong>SocketChannel</strong>：处理IO读写事件</li>
<li><strong>SelectionKey</strong>：事件类型（ACCEPT、READ、WRITE）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="%E5%A4%9A%E7%BA%BF%E7%A8%8Breactor">多线程Reactor</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Main Reactor
├── 监听连接事件
└── 分发到Sub Reactor

Sub Reactor (多个)
├── 处理IO读写
└── 分发到Worker线程池

Worker线程池
└── 处理业务逻辑
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="netty">Netty</h2>
<p>Netty是基于NIO的高性能网络框架，实现了Reactor模式。</p>
<p><strong>核心优势</strong>：</p>
<ul>
<li>高性能：基于NIO，零拷贝</li>
<li>易用性：封装复杂API</li>
<li>可扩展：丰富的编解码器</li>
<li>稳定：Netty 4.x广泛使用</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="47" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="netty-reactor">Netty Reactor</h3>
<p><img src="/images/13/netty-reactor.png" alt="" style="height:520px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="48" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="netty%E6%A0%B8%E5%BF%83%E7%BB%84%E4%BB%B6">Netty核心组件</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 服务器启动</span>
<span class="hljs-type">EventLoopGroup</span> <span class="hljs-variable">bossGroup</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">NioEventLoopGroup</span>(<span class="hljs-number">1</span>);
<span class="hljs-type">EventLoopGroup</span> <span class="hljs-variable">workerGroup</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">NioEventLoopGroup</span>();

<span class="hljs-keyword">try</span> {
    <span class="hljs-type">ServerBootstrap</span> <span class="hljs-variable">bootstrap</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ServerBootstrap</span>();
    bootstrap.group(bossGroup, workerGroup)
        .channel(NioServerSocketChannel.class)
        .childHandler(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ChannelInitializer</span>&lt;SocketChannel&gt;() {
            <span class="hljs-meta">@Override</span>
            <span class="hljs-keyword">protected</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">initChannel</span><span class="hljs-params">(SocketChannel ch)</span> {
                ch.pipeline().addLast(<span class="hljs-keyword">new</span> <span class="hljs-title class_">StringDecoder</span>()).addLast(<span class="hljs-keyword">new</span> <span class="hljs-title class_">StringEncoder</span>()).addLast(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ServerHandler</span>());
            }
        })

<h2 id="%E5%BC%82%E6%AD%A5ioaio">异步IO（AIO）</h2>
<h3 id="aio%E6%A6%82%E8%BF%B0">AIO概述</h3>
<p>Java 7引入了AIO（Asynchronous I/O），提供真正的异步非阻塞IO。</p>
<p><strong>AIO vs NIO</strong>：</p>
<ul>
<li><strong>NIO</strong>：非阻塞IO，需要轮询检查就绪状态</li>
<li><strong>AIO</strong>：异步IO，操作系统完成后回调通知</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">

<h3 id="asynchronoussocketchannel">AsynchronousSocketChannel</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 异步读取</span>
<span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">1024</span>);

<h3 id="aio%E9%80%82%E7%94%A8%E5%9C%BA%E6%99%AF">AIO适用场景</h3>
<p><strong>优点</strong>：</p>
<ul>
<li>真正的异步，无需轮询</li>
<li>回调机制，代码更清晰</li>
<li>适合大量连接</li>
</ul>
<p><strong>缺点</strong>：</p>
<ul>
<li>Windows上实现不完善（使用线程池模拟）</li>
<li>Linux上基于epoll，性能与NIO相当</li>
<li>代码复杂度较高</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h2 id="%E7%BD%91%E7%BB%9C%E6%80%A7%E8%83%BD%E8%B0%83%E4%BC%98">网络性能调优</h2>
<h3 id="%E7%B3%BB%E7%BB%9F%E5%8F%82%E6%95%B0%E8%B0%83%E4%BC%98">系统参数调优</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Linux TCP参数调优</span>
<span class="hljs-comment"># /etc/sysctl.conf</span>

<span class="hljs-comment"># 增加TCP连接队列</span>
net.core.somaxconn = 2048

<span class="hljs-comment"># TCP快速回收TIME_WAIT</span>
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 30

<span class="hljs-comment"># 增加文件描述符限制</span>
<span class="hljs-built_in">ulimit</span> -n 65535

<span class="hljs-comment"># TCP缓冲区大小</span>
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="jvm%E7%BD%91%E7%BB%9C%E5%8F%82%E6%95%B0">JVM网络参数</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># JVM启动参数</span>
-XX:+UseG1GC                    <span class="hljs-comment"># 使用G1垃圾回收器</span>
-XX:MaxDirectMemorySize=2g      <span class="hljs-comment"># 直接内存大小</span>
-Djava.net.preferIPv4Stack=<span class="hljs-literal">true</span> <span class="hljs-comment"># 优先使用IPv4</span>
-Djava.net.preferIPv6Addresses=<span class="hljs-literal">false</span>
</code></pre>
<p><strong>关键参数</strong>：</p>
<ul>
<li><strong>直接内存</strong>：NIO使用直接内存，需要足够空间</li>
<li><strong>GC优化</strong>：网络应用产生大量临时对象，需要低延迟GC</li>
<li><strong>IPv4/IPv6</strong>：根据实际需求选择</li>
</ul>
</section>
