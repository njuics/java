<p>Instances of this class support both reading and writing to a random access file.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/RandomAccessFile.html">https://docs.oracle.com/javase/8/docs/api/java/io/RandomAccessFile.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="52" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%AE%80%E5%8D%95%E4%BE%8B%E5%AD%90">简单例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">try</span>{
    RandomAccessFile file=<span class="hljs-keyword">new</span> <span class="hljs-title class_">RandomAccessFile</span>(<span class="hljs-string">&quot;xanadu.txt&quot;</span>,<span class="hljs-string">&quot;rw&quot;</span>);
    file.seek(file.length()); 
    file.writeBytes(s+<span class="hljs-string">&quot;\n&quot;</span>);
    file.close();
} <span class="hljs-keyword">catch</span>(IOException e) {
    e.printStackTrace();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="getchannel-for-randomaccessfile"><code>getChannel</code> for <code>RandomAccessFile</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> FileChannel <span class="hljs-title function_">getChannel</span><span class="hljs-params">()</span>
</code></pre>
<p>Returns the unique FileChannel object associated with this file.</p>
<p>Returns: the file channel associated with this file<br />
Since: 1.4</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/RandomAccessFile.html#getChannel--">https://docs.oracle.com/javase/8/docs/api/java/io/RandomAccessFile.html#getChannel--</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="filechannel">FileChannel</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FileChannel</span>
<span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractInterruptibleChannel</span>
<span class="hljs-keyword">implements</span> <span class="hljs-title class_">SeekableByteChannel</span>, GatheringByteChannel, ScatteringByteChannel
</code></pre>
<p>A channel for reading, writing, mapping, and manipulating a file.</p>
<p>A file channel can also be obtained from an existing <code>FileInputStream</code>, <code>FileOutputStream</code>, or <code>RandomAccessFile</code> object by invoking that object's getChannel method, which returns a file channel that is connected to the same underlying file.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="java-io-vs-nio">Java IO vs NIO</h1>
<p>The <code>java.io</code> package was introduced in Java 1.0. It provides:</p>
<ul>
<li><code>InputStream</code> and <code>OutputStream</code>  and <code>Reader</code> and <code>Writer</code></li>
<li><b>blocking mode</b> – to wait for a complete message</li>
</ul>
<p><strong>The <code>java.nio</code> package was introduced in Java 1.4 and updated in Java 1.7 (NIO.2)</strong>. It provides:</p>
<ul>
<li><b>non-blocking mode</b> – to read whatever is ready</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="56" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="channels-and-buffers">Channels and Buffers</h1>
<p><img src="images/12/overview-channels-buffers.png" alt="" /></p>
<p>Java NIO: Channels read data into Buffers, and Buffers write data into Channels</p>
<p><a href="http://tutorials.jenkov.com/java-nio/channels.html">http://tutorials.jenkov.com/java-nio/channels.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="57" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90-4">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">RandomAccessFile</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RandomAccessFile</span>(<span class="hljs-string">&quot;file.txt&quot;</span>, <span class="hljs-string">&quot;rw&quot;</span>);
<span class="hljs-type">FileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> file.getChannel();
<span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">48</span>);

<span class="hljs-type">int</span> <span class="hljs-variable">bytesRead</span> <span class="hljs-operator">=</span> channel.read(buffer);
<span class="hljs-keyword">while</span> (bytesRead != -<span class="hljs-number">1</span>) {
    buffer.flip();  <span class="hljs-comment">// 准备读取</span>
    <span class="hljs-keyword">while</span> (buffer.hasRemaining()) {
        System.out.print((<span class="hljs-type">char</span>) buffer.get());
    }
    buffer.clear();  <span class="hljs-comment">// 准备写入</span>
    bytesRead = channel.read(buffer);
}
file.close();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="58" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="channels">Channels</h1>
<p>Here are the most important Channel implementations in Java NIO:</p>
<ul>
<li>The <code>FileChannel</code> reads data from and to files.</li>
<li>The <code>DatagramChannel</code> can read and write data over the network via UDP.</li>
<li>The <code>SocketChannel</code> can read and write data over the network via TCP.</li>
<li>The <code>ServerSocketChannel</code> allows you to listen for incoming TCP connections, like a web server does. For each incoming connection a SocketChannel is created.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="59" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="buffers">Buffers</h1>
<p>Java NIO Buffers are used when interacting with NIO Channels. As you know, data is read from channels into buffers, and written from buffers into channels.</p>
<p>A buffer is essentially a block of memory into which you can write data, which you can then later read again. This memory block is wrapped in a NIO Buffer object, which provides a set of methods that makes it easier to work with the memory block.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="60" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="buffer-usage">Buffer Usage</h1>
<p>Using a Buffer to read and write data typically follows this little 4-step process:</p>
<ol>
<li>Write data into the Buffer</li>
<li>Call <code>buffer.flip()</code></li>
<li>Read data out of the Buffer</li>
<li>Call <code>buffer.clear()</code> or <code>buffer.compact()</code></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="61" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="buffer-capacity-position-and-limit">Buffer Capacity, Position and Limit</h1>
<p><img src="images/12/buffers-modes.png" alt="" /></p>
<p>The meaning of position and limit depends on whether the Buffer is in read or write mode. Capacity always means the same, no matter the buffer mode.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="62" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/12/overview-selectors.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="62" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="62" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="nio-selector">NIO Selector</h1>
<p>The Java NIO Selector is a component which can examine one or more Java NIO Channel instances, and determine which channels are ready for e.g. reading or writing. This way a single thread can manage multiple channels, and thus multiple network connections.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="62" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="63" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E7%BD%91%E7%BB%9Cio-socketchannel---tcp%E5%AE%A2%E6%88%B7%E7%AB%AF">网络IO (SocketChannel) - TCP客户端</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">SocketChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> SocketChannel.open();
channel.connect(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InetSocketAddress</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8080</span>));

<span class="hljs-comment">// 发送数据</span>
<span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.wrap(<span class="hljs-string">&quot;Hello Server&quot;</span>.getBytes());
channel.write(buffer);

<span class="hljs-comment">// 接收数据</span>
buffer.clear();
channel.read(buffer);
buffer.flip();
<span class="hljs-keyword">while</span> (buffer.hasRemaining()) {
    System.out.print((<span class="hljs-type">char</span>) buffer.get());
}

channel.close();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="64" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="serversocketchannel---tcp%E6%9C%8D%E5%8A%A1%E5%99%A8">ServerSocketChannel - TCP服务器</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">ServerSocketChannel</span> <span class="hljs-variable">serverChannel</span> <span class="hljs-operator">=</span> ServerSocketChannel.open();
serverChannel.bind(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InetSocketAddress</span>(<span class="hljs-number">8080</span>));

<span class="hljs-keyword">while</span> (<span class="hljs-literal">true</span>) {
    <span class="hljs-type">SocketChannel</span> <span class="hljs-variable">clientChannel</span> <span class="hljs-operator">=</span> serverChannel.accept();
    
    <span class="hljs-comment">// 读取客户端数据</span>
    <span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">1024</span>);
    clientChannel.read(buffer);
    
    <span class="hljs-comment">// 响应客户端</span>
    buffer.clear();
    buffer.put(<span class="hljs-string">&quot;Hello Client&quot;</span>.getBytes());
    buffer.flip();
    clientChannel.write(buffer);
    
    clientChannel.close();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="65" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="datagramchannel---udp%E9%80%9A%E4%BF%A1">DatagramChannel - UDP通信</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">DatagramChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> DatagramChannel.open();
channel.bind(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InetSocketAddress</span>(<span class="hljs-number">9999</span>));

<span class="hljs-comment">// 接收数据</span>
<span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">1024</span>);
channel.receive(buffer);

<span class="hljs-comment">// 发送数据</span>
buffer.clear();
buffer.put(<span class="hljs-string">&quot;Hello UDP&quot;</span>.getBytes());
buffer.flip();
channel.send(buffer, <span class="hljs-keyword">new</span> <span class="hljs-title class_">InetSocketAddress</span>(<span class="hljs-string">&quot;localhost&quot;</span>, <span class="hljs-number">8888</span>));

channel.close();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="66" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="io-vs-nio%E8%AF%A6%E7%BB%86%E5%AF%B9%E6%AF%94">IO vs NIO详细对比</h2>
<table>
<thead>
<tr>
<th>特性</th>
<th>IO</th>
<th>NIO</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>阻塞模式</strong></td>
<td>阻塞</td>
<td>非阻塞</td>
</tr>
<tr>
<td><strong>线程模型</strong></td>
<td>一个连接一个线程</td>
<td>一个线程多个连接</td>
</tr>
<tr>
<td><strong>缓冲区</strong></td>
<td>Stream（无缓冲区）</td>
<td>Buffer（有缓冲区）</td>
</tr>
<tr>
<td><strong>选择器</strong></td>
<td>无</td>
<td>Selector</td>
</tr>
<tr>
<td><strong>适用场景</strong></td>
<td>连接数少</td>
<td>连接数多</td>
</tr>
<tr>
<td><strong>性能</strong></td>
<td>连接数少时好</td>
<td>连接数多时好</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="67" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="io-vs-nio%E6%80%A7%E8%83%BD%E5%AF%B9%E6%AF%94---%E4%BC%A0%E7%BB%9Fio%E9%98%BB%E5%A1%9E">IO vs NIO性能对比 - 传统IO（阻塞）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">handleClient</span><span class="hljs-params">(Socket socket)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">InputStream</span> <span class="hljs-variable">input</span> <span class="hljs-operator">=</span> socket.getInputStream();
    <span class="hljs-type">OutputStream</span> <span class="hljs-variable">output</span> <span class="hljs-operator">=</span> socket.getOutputStream();
    
    <span class="hljs-comment">// 阻塞：等待数据</span>
    <span class="hljs-type">int</span> <span class="hljs-variable">data</span> <span class="hljs-operator">=</span> input.read();
    
    <span class="hljs-comment">// 处理数据</span>
    output.write(data);
}
<span class="hljs-comment">// 每个客户端需要一个线程</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="68" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="io-vs-nio%E6%80%A7%E8%83%BD%E5%AF%B9%E6%AF%94---nio%E9%9D%9E%E9%98%BB%E5%A1%9E">IO vs NIO性能对比 - NIO（非阻塞）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">handleClient</span><span class="hljs-params">(Selector selector)</span> <span class="hljs-keyword">throws</span> IOException {
    selector.select(); <span class="hljs-comment">// 非阻塞：检查就绪的通道</span>
    
    Set&lt;SelectionKey&gt; keys = selector.selectedKeys();
    <span class="hljs-keyword">for</span> (SelectionKey key : keys) {
        <span class="hljs-keyword">if</span> (key.isReadable()) {
            <span class="hljs-comment">// 处理读取</span>
        }
        <span class="hljs-keyword">if</span> (key.isWritable()) {
            <span class="hljs-comment">// 处理写入</span>
        }
    }
}
<span class="hljs-comment">// 一个线程可以处理多个客户端</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="69" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="nio2-path--files-api">NIO.2 (Path &amp; Files API)</h2>
<p>NIO.2（New I/O 2）是Java 7引入的现代化文件IO API，是对传统<code>java.io.File</code>的改进。</p>
<ul>
<li><strong>Path接口</strong>：跨平台路径表示，替代<code>File</code>类</li>
<li><strong>Files类</strong>：提供丰富的文件操作方法</li>
<li><strong>WatchService</strong>：文件系统监控</li>
<li><strong>异步IO</strong>：支持异步文件操作</li>
<li><strong>符号链接支持</strong>：更好的符号链接处理</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="70" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="path%E6%8E%A5%E5%8F%A3">Path接口</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-comment">// 创建Path对象</span>
    <span class="hljs-type">Path</span> <span class="hljs-variable">path</span> <span class="hljs-operator">=</span> Paths.get(<span class="hljs-string">&quot;/home/user&quot;</span>, <span class="hljs-string">&quot;file.txt&quot;</span>);
    
    <span class="hljs-comment">// 路径操作</span>
    <span class="hljs-type">Path</span> <span class="hljs-variable">parent</span> <span class="hljs-operator">=</span> path.getParent();      <span class="hljs-comment">// /home/user</span>
    <span class="hljs-type">Path</span> <span class="hljs-variable">fileName</span> <span class="hljs-operator">=</span> path.getFileName();  <span class="hljs-comment">// file.txt</span>
    
    <span class="hljs-comment">// 路径组合</span>
    <span class="hljs-type">Path</span> <span class="hljs-variable">resolved</span> <span class="hljs-operator">=</span> path.resolve(<span class="hljs-string">&quot;subdir&quot;</span>);  <span class="hljs-comment">// /home/user/file.txt/subdir</span>
    
    System.out.println(<span class="hljs-string">&quot;Path: &quot;</span> + path);
    System.out.println(<span class="hljs-string">&quot;Parent: &quot;</span> + parent);
    System.out.println(<span class="hljs-string">&quot;FileName: &quot;</span> + fileName);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="71" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="files%E7%B1%BB">Files类</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">Path</span> <span class="hljs-variable">path</span> <span class="hljs-operator">=</span> Paths.get(<span class="hljs-string">&quot;file.txt&quot;</span>);
    
    <span class="hljs-comment">// 读取文件</span>
    List&lt;String&gt; lines = Files.readAllLines(path);
    <span class="hljs-type">byte</span>[] bytes = Files.readAllBytes(path);
    
    <span class="hljs-comment">// 写入文件</span>
    Files.write(path, <span class="hljs-string">&quot;Hello World&quot;</span>.getBytes());
    
    <span class="hljs-comment">// 文件属性</span>
    <span class="hljs-type">boolean</span> <span class="hljs-variable">exists</span> <span class="hljs-operator">=</span> Files.exists(path);
    <span class="hljs-type">long</span> <span class="hljs-variable">size</span> <span class="hljs-operator">=</span> Files.size(path);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="72" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="watchservice---%E6%96%87%E4%BB%B6%E7%B3%BB%E7%BB%9F%E7%9B%91%E6%8E%A7">WatchService - 文件系统监控</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException, InterruptedException {
    <span class="hljs-type">Path</span> <span class="hljs-variable">dir</span> <span class="hljs-operator">=</span> Paths.get(<span class="hljs-string">&quot;.&quot;</span>);
    <span class="hljs-type">WatchService</span> <span class="hljs-variable">watchService</span> <span class="hljs-operator">=</span> FileSystems.getDefault().newWatchService();
    
    dir.register(watchService, 
        StandardWatchEventKinds.ENTRY_CREATE,
        StandardWatchEventKinds.ENTRY_DELETE,
        StandardWatchEventKinds.ENTRY_MODIFY);
    
    <span class="hljs-keyword">while</span> (<span class="hljs-literal">true</span>) {
        <span class="hljs-type">WatchKey</span> <span class="hljs-variable">key</span> <span class="hljs-operator">=</span> watchService.take();
        
        <span class="hljs-keyword">for</span> (WatchEvent&lt;?&gt; event : key.pollEvents()) {
            Kind&lt;?&gt; kind = event.kind();
            <span class="hljs-type">Path</span> <span class="hljs-variable">context</span> <span class="hljs-operator">=</span> (Path) event.context();
            System.out.println(<span class="hljs-string">&quot;Event: &quot;</span> + kind + <span class="hljs-string">&quot;, File: &quot;</span> + context);
        }
        <span class="hljs-type">boolean</span> <span class="hljs-variable">valid</span> <span class="hljs-operator">=</span> key.reset();
        <span class="hljs-keyword">if</span> (!valid) {
            <span class="hljs-keyword">break</span>;
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="73" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E5%86%85%E5%AD%98%E6%98%A0%E5%B0%84%E6%96%87%E4%BB%B6-memory-mapped-files">内存映射文件 (Memory-Mapped Files)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">RandomAccessFile</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RandomAccessFile</span>(<span class="hljs-string">&quot;file.txt&quot;</span>, <span class="hljs-string">&quot;rw&quot;</span>);
    <span class="hljs-type">FileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> file.getChannel();
    
    <span class="hljs-comment">// 创建内存映射</span>
    <span class="hljs-type">MappedByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> channel.map(FileChannel.MapMode.READ_WRITE, <span class="hljs-number">0</span>, <span class="hljs-number">1024</span>);
    
    <span class="hljs-comment">// 直接操作内存</span>
    buffer.put(<span class="hljs-string">&quot;Hello&quot;</span>.getBytes());
    buffer.force();  <span class="hljs-comment">// 刷新到磁盘</span>
    
    <span class="hljs-comment">// 读取数据</span>
    buffer.position(<span class="hljs-number">0</span>);
    <span class="hljs-keyword">while</span> (buffer.hasRemaining()) {
        System.out.print((<span class="hljs-type">char</span>) buffer.get());
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="74" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E5%86%85%E5%AD%98%E6%98%A0%E5%B0%84%E6%96%87%E4%BB%B6%E7%9A%84%E4%BC%98%E5%8A%BF">内存映射文件的优势</h2>
<table>
<thead>
<tr>
<th>特性</th>
<th>传统IO</th>
<th>内存映射</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>数据拷贝</strong></td>
<td>需要多次拷贝</td>
<td>零拷贝</td>
</tr>
<tr>
<td><strong>系统调用</strong></td>
<td>每次读写都需要</td>
<td>映射时一次</td>
</tr>
<tr>
<td><strong>性能</strong></td>
<td>较慢</td>
<td>非常快</td>
</tr>
<tr>
<td><strong>适用场景</strong></td>
<td>小文件</td>
<td>大文件</td>
</tr>
</tbody>
</table>
<p>主要使用场景：大文件处理、高性能数据库、日志文件读写、共享内存通信等</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="75" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E6%96%87%E4%BB%B6%E9%94%81-filelock">文件锁 (FileLock)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">RandomAccessFile</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RandomAccessFile</span>(<span class="hljs-string">&quot;file.txt&quot;</span>, <span class="hljs-string">&quot;rw&quot;</span>);
    <span class="hljs-type">FileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> file.getChannel();
    
    <span class="hljs-comment">// 获取排他锁（整个文件）</span>
    <span class="hljs-type">FileLock</span> <span class="hljs-variable">lock</span> <span class="hljs-operator">=</span> channel.lock();
    <span class="hljs-keyword">try</span> {
        <span class="hljs-comment">// 执行文件操作</span>
        file.write(<span class="hljs-string">&quot;Hello&quot;</span>.getBytes());
    } <span class="hljs-keyword">finally</span> {
        lock.release();  <span class="hljs-comment">// 释放锁</span>
    }
    
    <span class="hljs-comment">// 获取区域锁（锁定前100字节）</span>
    <span class="hljs-type">FileLock</span> <span class="hljs-variable">regionLock</span> <span class="hljs-operator">=</span> channel.lock(<span class="hljs-number">0</span>, <span class="hljs-number">100</span>, <span class="hljs-literal">false</span>);
    <span class="hljs-keyword">try</span> {
        <span class="hljs-comment">// 读取文件的前100字节</span>
    } <span class="hljs-keyword">finally</span> {
        regionLock.release();
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="76" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E5%85%B1%E4%BA%AB%E9%94%81-vs-%E6%8E%92%E4%BB%96%E9%94%81">共享锁 vs 排他锁</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 排他锁（写锁）- 默认</span>
<span class="hljs-type">FileLock</span> <span class="hljs-variable">exclusiveLock</span> <span class="hljs-operator">=</span> channel.lock();  <span class="hljs-comment">// 整个文件</span>
<span class="hljs-type">FileLock</span> <span class="hljs-variable">exclusiveLock2</span> <span class="hljs-operator">=</span> channel.lock(<span class="hljs-number">0</span>, <span class="hljs-number">100</span>, <span class="hljs-literal">false</span>);  <span class="hljs-comment">// 区域锁</span>

<span class="hljs-comment">// 共享锁（读锁）</span>
<span class="hljs-type">FileLock</span> <span class="hljs-variable">sharedLock</span> <span class="hljs-operator">=</span> channel.lock(<span class="hljs-number">0</span>, <span class="hljs-number">100</span>, <span class="hljs-literal">true</span>);  <span class="hljs-comment">// 区域锁</span>

<span class="hljs-comment">// 检查锁类型</span>
<span class="hljs-type">boolean</span> <span class="hljs-variable">isShared</span> <span class="hljs-operator">=</span> sharedLock.isShared();  <span class="hljs-comment">// 是否为共享锁</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="77" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E5%BC%82%E6%AD%A5io-asynchronousfilechannel">异步IO (AsynchronousFileChannel)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">AsynchronousFileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> AsynchronousFileChannel.open(
        Paths.get(<span class="hljs-string">&quot;file.txt&quot;</span>), StandardOpenOption.READ);
    
    <span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">1024</span>);
    Future&lt;Integer&gt; operation = channel.read(buffer, <span class="hljs-number">0</span>);
    
    <span class="hljs-comment">// 主线程可以继续做其他事情</span>
    <span class="hljs-type">int</span> <span class="hljs-variable">bytesRead</span> <span class="hljs-operator">=</span> operation.get();  <span class="hljs-comment">// 等待完成</span>
    System.out.println(<span class="hljs-string">&quot;Bytes read: &quot;</span> + bytesRead);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="78" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E4%BD%BF%E7%94%A8completionhandler">使用CompletionHandler</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
    <span class="hljs-type">AsynchronousFileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> AsynchronousFileChannel.open(
        Paths.get(<span class="hljs-string">&quot;file.txt&quot;</span>), StandardOpenOption.READ);
    
    <span class="hljs-type">ByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> ByteBuffer.allocate(<span class="hljs-number">1024</span>);
    
    <span class="hljs-comment">// 使用CompletionHandler回调</span>
    channel.read(buffer, <span class="hljs-number">0</span>, buffer, <span class="hljs-keyword">new</span> <span class="hljs-title class_">CompletionHandler</span>&lt;Integer, ByteBuffer&gt;() {
        <span class="hljs-meta">@Override</span>
        <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">completed</span><span class="hljs-params">(Integer result, ByteBuffer attachment)</span> {
            System.out.println(<span class="hljs-string">&quot;Bytes read: &quot;</span> + result);
        }
        
        <span class="hljs-meta">@Override</span>
        <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">failed</span><span class="hljs-params">(Throwable exc, ByteBuffer attachment)</span> {
            System.err.println(<span class="hljs-string">&quot;Read failed: &quot;</span> + exc.getMessage());
        }
    });
    
    Thread.sleep(<span class="hljs-number">1000</span>);  <span class="hljs-comment">// 等待异步操作完成</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="79" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="io-exceptions">IO Exceptions</h1>

</code></pre>

<h1 id="try-with-resources">Try with Resources</h1>
<p>The try-with-resources statement is a try statement that declares one or more resources. A resource is an object that must be closed after the program is finished with it. The try-with-resources statement ensures that each resource is closed at the end of the statement. Any object that implements java.lang.AutoCloseable, which includes all objects which implement java.io.Closeable, can be used as a resource.</p>
