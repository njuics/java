<h1 id="java%E9%AB%98%E7%BA%A7%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1">Java高级程序设计</h1>
<h2 id="%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA">输入输出</h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="zh-CN" class="lead" data-marpit-pagination="1" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="io">I/O</h1>
<p><img src="images/12/io-ins.gif" alt="" style="width:550px;" /><br />
<img src="images/12/io-outs.gif" alt="" style="width:550px;" /></p>
<p><a href="https://docs.oracle.com/javase/tutorial/essential/io/index.html">https://docs.oracle.com/javase/tutorial/essential/io/index.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="stream">Stream</h1>
<p>A stream is a sequence of data.</p>
<ul>
<li>A program uses an input stream to read data from a source, one item at a time.</li>
<li>A program uses an output stream to write data to a destination, one item at a time.</li>
</ul>
<p><b>Java中的Stream分为Byte Streams和Character Streams两大类</b></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="byte-streams">Byte Streams</h1>
<p>Programs use byte streams to perform input and output of 8-bit bytes. All byte stream classes are descended from <code>InputStream</code> and <code>OutputStream</code>.</p>
<ul>
<li>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/InputStream.html">https://docs.oracle.com/javase/8/docs/api/java/io/InputStream.html</a></p>
</li>
<li>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/OutputStream.html">https://docs.oracle.com/javase/8/docs/api/java/io/OutputStream.html</a></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="inputstream">InputStream</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">InputStream</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Closeable</span> 
</code></pre>
<p>This abstract class is the superclass of all classes representing an input stream of bytes.</p>
<p>Direct Known Subclasses:<br />
<code>AudioInputStream</code>, <code>ByteArrayInputStream</code>, <code>FileInputStream</code>, <code>FilterInputStream</code>, <code>InputStream</code>, <code>ObjectInputStream</code>, <code>PipedInputStream</code>, <code>SequenceInputStream</code>, <code>StringBufferInputStream</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="outputstream">OutputStream</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OutputStream</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Closeable</span>, Flushable
</code></pre>
<p>This abstract class is the superclass of all classes representing an output stream of bytes. An output stream accepts output bytes and sends them to some sink.</p>
<p>Direct Known Subclasses:<br />
<code>ByteArrayOutputStream</code>, <code>FileOutputStream</code>, <code>FilterOutputStream</code>, <code>ObjectOutputStream</code>, <code>OutputStream</code>, <code>PipedOutputStream</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">FileInputStream</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-literal">null</span>;
    <span class="hljs-type">FileOutputStream</span> <span class="hljs-variable">out</span> <span class="hljs-operator">=</span> <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">try</span> {
        in = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;xanadu.txt&quot;</span>);
        out = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileOutputStream</span>(<span class="hljs-string">&quot;outagain.txt&quot;</span>);
        <span class="hljs-type">int</span> c;
        <span class="hljs-keyword">while</span> ((c = in.read()) != -<span class="hljs-number">1</span>) {
            out.write(c);
        }
    } <span class="hljs-keyword">finally</span> {
        <span class="hljs-keyword">if</span> (in != <span class="hljs-literal">null</span>) {
            in.close(); <span class="hljs-comment">//记得关</span>
        }
        <span class="hljs-keyword">if</span> (out != <span class="hljs-literal">null</span>) {
            out.close();<span class="hljs-comment">//记得关</span>
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%A4%BA%E6%84%8F%E5%9B%BE">示意图</h1>
<p><img src="images/12/byteStream.gif" alt="" style="width:600px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="character-streams">Character Streams</h1>
<p>The Java platform stores character values using Unicode conventions. Character stream I/O automatically translates this internal format to and from the local character set. In Western locales, the local character set is usually an 8-bit superset of ASCII.</p>
<p>All character stream classes are descended from <code>Reader</code> and <code>Writer</code>.</p>
<ul>
<li><a href="https://docs.oracle.com/javase/8/docs/api/java/io/Reader.html">https://docs.oracle.com/javase/8/docs/api/java/io/Reader.html</a></li>
<li><a href="https://docs.oracle.com/javase/8/docs/api/java/io/Writer.html">https://docs.oracle.com/javase/8/docs/api/java/io/Writer.html</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="reader">Reader</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Reader</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Readable</span>, Closeable
</code></pre>
<p>Abstract class for reading character streams.</p>
<p>Direct Known Subclasses:<br />
<code>BufferedReader</code>, <code>CharArrayReader</code>, <code>FilterReader</code>, <code>InputStreamReader</code>, <code>PipedReader</code>, <code>StringReader</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="writer">Writer</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Writer</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Appendable</span>, Closeable, Flushable
</code></pre>
<p>Abstract class for writing to character streams.</p>
<p>Direct Known Subclasses:<br />
<code>BufferedWriter</code>, <code>CharArrayWriter</code>, <code>FilterWriter</code>, <code>OutputStreamWriter</code>, <code>PipedWriter</code>, <code>PrintWriter</code>, <code>StringWriter</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90-1">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-keyword">try</span> (<span class="hljs-type">FileReader</span> <span class="hljs-variable">inputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;xanadu.txt&quot;</span>);
         <span class="hljs-type">FileWriter</span> <span class="hljs-variable">outputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileWriter</span>(<span class="hljs-string">&quot;characteroutput.txt&quot;</span>)) {
        <span class="hljs-type">int</span> c;
        <span class="hljs-keyword">while</span> ((c = inputStream.read()) != -<span class="hljs-number">1</span>) {
            outputStream.write(c);
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E5%B7%AE%E5%88%AB%E4%B8%8E%E8%81%94%E7%B3%BB">差别与联系</h1>
<p>Character streams are often &quot;wrappers&quot; for byte streams.</p>
<p>The character stream uses the byte stream to perform the physical I/O, while the character stream handles translation between characters and bytes. <code>FileReader</code>, for example, uses <code>FileInputStream</code>, while <code>FileWriter</code> uses <code>FileOutputStream</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E5%AD%97%E7%AC%A6%E7%BC%96%E7%A0%81-charset--encoding">字符编码 (Charset &amp; Encoding)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;你好世界&quot;</span>;
    
    <span class="hljs-comment">// 字符串编码</span>
    <span class="hljs-type">byte</span>[] bytes = text.getBytes(StandardCharsets.UTF_8);
    
    <span class="hljs-comment">// 字节解码</span>
    <span class="hljs-type">String</span> <span class="hljs-variable">decoded</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(bytes, StandardCharsets.UTF_8);
    
    System.out.println(decoded);  <span class="hljs-comment">// 你好世界</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E5%B8%B8%E8%A7%81%E4%B9%B1%E7%A0%81%E9%97%AE%E9%A2%98">常见乱码问题</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;你好世界&quot;</span>;
    <span class="hljs-comment">// 错误：使用系统默认编码</span>
    <span class="hljs-type">byte</span>[] wrong = text.getBytes();  <span class="hljs-comment">// 可能使用GBK</span>
    <span class="hljs-comment">// 错误：解码时使用错误编码</span>
    <span class="hljs-type">String</span> <span class="hljs-variable">wrongDecoded</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(wrong, StandardCharsets.ISO_8859_1);
    System.out.println(wrongDecoded);  <span class="hljs-comment">// 乱码</span>
    <span class="hljs-comment">// 正确：明确指定UTF-8</span>
    <span class="hljs-type">byte</span>[] correct = text.getBytes(StandardCharsets.UTF_8);
    <span class="hljs-type">String</span> <span class="hljs-variable">correctDecoded</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(correct, StandardCharsets.UTF_8);
    System.out.println(correctDecoded);  <span class="hljs-comment">// 你好世界</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E5%AD%97%E7%AC%A6%E4%B8%B2%E5%9C%A8%E5%86%85%E5%AD%98%E4%B8%AD%E7%9A%84%E5%BD%A2%E5%BC%8F">字符串在内存中的形式</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;你好世界&quot;</span>;
</code></pre>
<p><strong>Java 8及之前</strong>：使用<code>char[]</code>数组存储，每个<code>char</code>占2字节（UTF-16编码），每个中文字符占2字节</p>
<p><strong>Java 9+</strong>：使用<code>byte[]</code>数组存储，根据字符内容选择编码，并通过<code>coder</code>标志区分编码方式：</p>
<ul>
<li>ASCII字符（0-255）：使用Latin-1编码，1字节</li>
<li>中文等Unicode字符：使用UTF-16编码，2字节</li>
</ul>
<p><strong>关键点</strong>：</p>
<ul>
<li>Java 8及之前：内部始终使用UTF-16编码</li>
<li>Java 9+：内部根据字符内容选择Latin-1或UTF-16编码</li>
<li>与外部编码（UTF-8、GBK等）无关</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="java-8%E5%8F%8A%E4%B9%8B%E5%89%8D%E7%9A%84%E5%86%85%E5%AD%98%E5%B8%83%E5%B1%80">Java 8及之前的内存布局</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>String text = &quot;你好世界&quot;;

String对象
├── char[] value = ['\u4f60', '\u597d', '\u4e16', '\u754c']  // 你=0x4F60, 好=0x597D, 世=0x4E16, 界=0x754C
├── int offset = 0
├── int count = 4
└── int hash = ...

内存中的字节表示（每个char占2字节）：
[0x4F, 0x60, 0x59, 0x7D, 0x4E, 0x16, 0x75, 0x4C]  // 总共8字节
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="java-9%E7%9A%84%E5%86%85%E5%AD%98%E5%B8%83%E5%B1%80">Java 9+的内存布局</h2>
<p><strong>包含中文的字符串</strong>（使用UTF-16）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>String text = &quot;你好世界&quot;;

String对象
├── byte[] value = [0x4F, 0x60, 0x59, 0x7D, 0x4E, 0x16, 0x75, 0x4C]  // UTF-16编码的字节
├── byte coder = UTF16 (0)  // 标志：0=UTF16, 1=Latin1
└── int hash = ...

内存中的字节表示：
[0x4F, 0x60, 0x59, 0x7D, 0x4E, 0x16, 0x75, 0x4C]  // 总共8字节（每个字符2字节）
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="java-9%E7%9A%84%E5%86%85%E5%AD%98%E5%B8%83%E5%B1%80-1">Java 9+的内存布局</h2>
<p><strong>只包含ASCII的字符串</strong>（使用Latin-1）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>String text = &quot;Hello&quot;;

String对象
├── byte[] value = [0x48, 0x65, 0x6C, 0x6C, 0x6F]  // Latin-1编码的字节
├── byte coder = LATIN1 (1)  // 标志：0=UTF16, 1=Latin1
└── int hash = ...

内存中的字节表示：
[0x48, 0x65, 0x6C, 0x6C, 0x6F]  // 总共5字节（每个字符1字节）
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E7%BC%96%E7%A0%81%E8%BD%AC%E6%8D%A2%E7%9A%84%E5%BF%85%E8%A6%81%E6%80%A7">编码转换的必要性</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;你好世界&quot;</span>;
<span class="hljs-type">byte</span>[] bytes = text.getBytes(StandardCharsets.UTF_8);
</code></pre>
<p><strong>原因</strong>：</p>
<ol>
<li><strong>String内部是UTF-16</strong>：String对象内部使用UTF-16编码</li>
<li><strong>外部需要不同编码</strong>：网络传输、文件存储等需要UTF-8、GBK等</li>
<li><strong>编码转换</strong>：需要将UTF-16转换为目标编码</li>
<li><strong>不指定编码的风险</strong>：使用系统默认编码，可能在不同环境不一致</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E6%89%80%E4%BB%A5%E4%B8%BA%E4%BB%80%E4%B9%88%E4%BD%BF%E7%94%A8%E9%94%99%E8%AF%AF%E7%BC%96%E7%A0%81%E4%BC%9A%E5%AF%BC%E8%87%B4%E9%97%AE%E9%A2%98">所以为什么使用错误编码会导致问题？</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;你好世界&quot;</span>;
<span class="hljs-comment">// 编码：UTF-8</span>
<span class="hljs-type">byte</span>[] utf8Bytes = text.getBytes(StandardCharsets.UTF_8);
<span class="hljs-comment">// 错误：使用GBK解码UTF-8编码的字节</span>
<span class="hljs-type">String</span> <span class="hljs-variable">wrong</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(utf8Bytes, Charset.forName(<span class="hljs-string">&quot;GBK&quot;</span>));
System.out.println(wrong);  <span class="hljs-comment">// 乱码：浣犲ソ涓栫晫</span>
</code></pre>
<ol>
<li><strong>编码规则不同</strong>：UTF-8和GBK对同一字符的编码不同</li>
<li><strong>字节长度不同</strong>：UTF-8中文字符3字节，GBK中文字符2字节</li>
<li><strong>解码错误</strong>：用错误编码解码会导致字节解析错误</li>
<li><strong>字符映射错误</strong>：错误的字节序列映射到错误的字符</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="utf-8">UTF-8</h3>
<p>代码单元：8位（1字节），采用变长编码：1-4字节</p>
<ul>
<li>&quot;你&quot; = U+4F60 → UTF-8: 0xE4 0xBD 0xA0 (3字节)</li>
<li>&quot;H&quot; = U+0048 → UTF-8: 0x48 (1字节)</li>
</ul>
<table>
<thead>
<tr>
<th>Unicode码点范围</th>
<th>UTF-8编码长度</th>
</tr>
</thead>
<tbody>
<tr>
<td>0x0000 - 0x007F (ASCII)</td>
<td>1字节</td>
</tr>
<tr>
<td>0x0080 - 0x07FF</td>
<td>2字节</td>
</tr>
<tr>
<td>0x0800 - 0xFFFF</td>
<td>3字节</td>
</tr>
<tr>
<td>0x10000 - 0x10FFFF</td>
<td>4字节</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="utf-16">UTF-16</h3>
<p>代码单元：16位（2字节）变长编码：2字节或4字节</p>
<ul>
<li>&quot;你&quot; = U+4F60 → UTF-16: 0x4F60 (2字节)</li>
<li>&quot;H&quot; = U+0048 → UTF-16: 0x0048 (2字节)</li>
</ul>
<p><strong>编码规则</strong>：</p>
<table>
<thead>
<tr>
<th>Unicode码点范围</th>
<th>UTF-16编码长度</th>
</tr>
</thead>
<tbody>
<tr>
<td>0x0000 - 0xFFFF (BMP)</td>
<td>2字节</td>
</tr>
<tr>
<td>0x10000 - 0x10FFFF</td>
<td>4字节（代理对）</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="gbk">GBK</h3>
<ul>
<li>中文编码标准：GB2312的扩展</li>
<li>只支持中文和ASCII：不支持其他语言
<ul>
<li>&quot;你&quot; = GBK: 0xC4 0xE3 (2字节)</li>
<li>&quot;H&quot; = GBK: 0x48 (1字节)</li>
</ul>
</li>
</ul>
<p><strong>编码规则</strong>：</p>
<table>
<thead>
<tr>
<th>字符类型</th>
<th>GBK编码长度</th>
</tr>
</thead>
<tbody>
<tr>
<td>ASCII字符</td>
<td>1字节</td>
</tr>
<tr>
<td>中文字符</td>
<td>2字节</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E4%B8%89%E7%A7%8D%E7%BC%96%E7%A0%81%E5%AF%B9%E6%AF%94">三种编码对比</h3>
<table>
<thead>
<tr>
<th>编码</th>
<th>ASCII字符</th>
<th>中文字符</th>
<th>优势</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>UTF-8</strong></td>
<td>1字节</td>
<td>3字节</td>
<td>网络传输友好，ASCII兼容</td>
</tr>
<tr>
<td><strong>UTF-16</strong></td>
<td>2字节</td>
<td>2字节</td>
<td>中文更省空间，Java内部使用</td>
</tr>
<tr>
<td><strong>GBK</strong></td>
<td>1字节</td>
<td>2字节</td>
<td>中文省空间，但只支持中文</td>
</tr>
</tbody>
</table>
<p><strong>选择建议</strong>：</p>
<ul>
<li><strong>网络传输、文件存储</strong>：使用UTF-8（兼容性好）</li>
<li><strong>Java内部</strong>：使用UTF-16（Java String默认）</li>
<li><strong>中文环境</strong>：可以使用GBK（节省空间，但兼容性差）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E6%80%A7%E8%83%BD%E8%80%83%E8%99%91">性能考虑</h1>
<p>Most of the examples we've seen so far use unbuffered I/O. This means each read or write request is handled directly by the underlying OS.</p>
<p>This can make a program much less efficient, since each such request often triggers disk access, network activity, or some other operation that is relatively expensive.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="buffered-streams">Buffered Streams</h1>
<p>Buffered input streams read data from a memory area known as a buffer; the native input API is called only when the buffer is empty. Similarly, buffered output streams write data to a buffer, and the native output API is called only when the buffer is full.</p>
<ul>
<li><code>BufferedInputStream</code> and <code>BufferedOutputStream</code> create buffered byte streams</li>
<li><code>BufferedReader</code> and <code>BufferedWriter</code> create buffered character streams</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="stream-wrapping">Stream wrapping</h1>
<p>A program can convert an unbuffered stream into a buffered stream using the wrapping idiom we've used several times now, where the unbuffered stream object is passed to the constructor for a buffered stream class.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">inputStream = <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;xanadu.txt&quot;</span>));
outputStream = <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedWriter</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileWriter</span>(<span class="hljs-string">&quot;characteroutput.txt&quot;</span>));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E5%AF%B9%E5%BA%94%E7%9A%84%E8%BD%AF%E4%BB%B6%E5%B7%A5%E7%A8%8B%E6%A6%82%E5%BF%B5decorator-pattern">对应的软件工程概念：Decorator Pattern</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-comment">// 装饰器模式：多层包装</span>
    <span class="hljs-type">InputStream</span> <span class="hljs-variable">fileStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;data.txt&quot;</span>);
    <span class="hljs-type">InputStream</span> <span class="hljs-variable">bufferedStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedInputStream</span>(fileStream);
    <span class="hljs-type">DataInputStream</span> <span class="hljs-variable">dataStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DataInputStream</span>(bufferedStream);
    
    <span class="hljs-comment">// 每层装饰器添加新功能</span>
    <span class="hljs-comment">// FileInputStream: 基础文件读取</span>
    <span class="hljs-comment">// BufferedInputStream: 添加缓冲功能</span>
    <span class="hljs-comment">// DataInputStream: 添加数据类型读取</span>
    
    <span class="hljs-type">int</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> dataStream.readInt();
    <span class="hljs-type">String</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> dataStream.readUTF();
    
    dataStream.close();  <span class="hljs-comment">// 关闭时只需要关闭最外层</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E7%BC%93%E5%86%B2%E7%AD%96%E7%95%A5">缓冲策略</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-comment">// 1. 选择合适的缓冲区大小</span>
    <span class="hljs-type">int</span> <span class="hljs-variable">bufferSize</span> <span class="hljs-operator">=</span> <span class="hljs-number">8192</span>; <span class="hljs-comment">// 8KB，通常是最优大小</span>

    <span class="hljs-comment">// 2. 使用缓冲流</span>
    <span class="hljs-type">BufferedInputStream</span> <span class="hljs-variable">bis</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedInputStream</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;largefile.txt&quot;</span>), bufferSize);

    <span class="hljs-comment">// 3. 批量读取</span>
    <span class="hljs-type">byte</span>[] buffer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">byte</span>[bufferSize];
    <span class="hljs-type">int</span> bytesRead;
    <span class="hljs-keyword">while</span> ((bytesRead = bis.read(buffer)) != -<span class="hljs-number">1</span>) {
        <span class="hljs-comment">// 处理数据</span>
    }
    
    bis.close();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h2 id="%E8%A1%8C%E7%BB%88%E6%AD%A2%E7%AC%A6%E7%9A%84%E8%B7%A8%E5%B9%B3%E5%8F%B0%E9%97%AE%E9%A2%98">行终止符的跨平台问题</h2>
<p>字符IO通常以比单个字符更大的单位进行操作。一个常见的单位是<strong>行（line）</strong>：以行终止符结尾的字符串。</p>
<table>
<thead>
<tr>
<th>操作系统</th>
<th>行终止符</th>
<th>表示方式</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Windows</strong></td>
<td>回车+换行</td>
<td><code>&quot;\r\n&quot;</code></td>
</tr>
<tr>
<td><strong>Unix/Linux/macOS</strong></td>
<td>换行</td>
<td><code>&quot;\n&quot;</code></td>
</tr>
<tr>
<td><strong>旧版Mac</strong></td>
<td>回车</td>
<td><code>&quot;\r&quot;</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E9%9C%80%E8%A6%81%E6%94%AF%E6%8C%81%E6%89%80%E6%9C%89%E8%A1%8C%E7%BB%88%E6%AD%A2%E7%AC%A6">为什么需要支持所有行终止符？</h3>
<p>支持所有可能的行终止符，可以让程序读取在不同操作系统上创建的文件，实现跨平台兼容。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">BufferedReader</span> <span class="hljs-variable">reader</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;file.txt&quot;</span>));
<span class="hljs-type">String</span> <span class="hljs-variable">line</span> <span class="hljs-operator">=</span> reader.readLine();  <span class="hljs-comment">// 自动识别并处理所有行终止符</span>
</code></pre>
<ul>
<li><code>BufferedReader.readLine()</code> 方法会自动识别和处理所有类型的行终止符</li>
<li>返回的字符串不包含行终止符</li>
<li>无需手动处理不同操作系统的差异</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="%E7%AE%A1%E9%81%93%E6%B5%81-pipedinputstreamoutputstream">管道流 (PipedInputStream/OutputStream)</h3>
<p><small>管道流用于在线程间传输数据，实现生产者-消费者模式。</small></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">PipedInputStream</span> <span class="hljs-variable">pipedInput</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PipedInputStream</span>();
    <span class="hljs-type">PipedOutputStream</span> <span class="hljs-variable">pipedOutput</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PipedOutputStream</span>();
    pipedInput.connect(pipedOutput);  <span class="hljs-comment">// 连接管道</span>
    
    <span class="hljs-comment">// 生产者线程：写入数据</span>
    <span class="hljs-type">Thread</span> <span class="hljs-variable">producer</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Thread</span>(() -&gt; {
        <span class="hljs-keyword">try</span> {
            pipedOutput.write(<span class="hljs-string">&quot;Hello\n&quot;</span>.getBytes());
            pipedOutput.close();
        } <span class="hljs-keyword">catch</span> (IOException e) {
            e.printStackTrace();
        }
    });
    
    <span class="hljs-comment">// 消费者线程：读取数据</span>
    <span class="hljs-type">Thread</span> <span class="hljs-variable">consumer</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Thread</span>(() -&gt; {
        <span class="hljs-keyword">try</span> {
            <span class="hljs-type">int</span> data;
            <span class="hljs-keyword">while</span> ((data = pipedInput.read()) != -<span class="hljs-number">1</span>) {
                System.out.print((<span class="hljs-type">char</span>) data);
            }
        } <span class="hljs-keyword">catch</span> (IOException e) {
            e.printStackTrace();
        }
    });
    
    producer.start();
    consumer.start();
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h3 id="pushbackinputstream">PushbackInputStream</h3>
<p><small>支持回退（pushback）机制的输入流，可以将已读取的字节重新放回流中。</small></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">String</span> <span class="hljs-variable">data</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;Hello&quot;</span>;
    <span class="hljs-type">ByteArrayInputStream</span> <span class="hljs-variable">bais</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ByteArrayInputStream</span>(data.getBytes());
    <span class="hljs-type">PushbackInputStream</span> <span class="hljs-variable">pushback</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PushbackInputStream</span>(bais);
    
    <span class="hljs-comment">// 读取字符</span>
    <span class="hljs-type">int</span> <span class="hljs-variable">ch</span> <span class="hljs-operator">=</span> pushback.read();
    System.out.println(<span class="hljs-string">&quot;Read: &quot;</span> + (<span class="hljs-type">char</span>) ch);  <span class="hljs-comment">// H</span>
    
    <span class="hljs-comment">// 回退字符</span>
    pushback.unread(ch);
    
    <span class="hljs-comment">// 再次读取（读取到刚才回退的字符）</span>
    ch = pushback.read();
    System.out.println(<span class="hljs-string">&quot;Read again: &quot;</span> + (<span class="hljs-type">char</span>) ch);  <span class="hljs-comment">// H</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="scanning-and-formatting">Scanning and Formatting</h1>
<p>Programming I/O often involves translating to and from the neatly formatted data humans like to work with. To assist you with these chores, the Java platform provides two APIs. The scanner API breaks input into individual tokens associated with bits of data. The formatting API assembles data into nicely formatted, human-readable form.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="scanning">Scanning</h1>
<p>Objects of type <code>Scanner</code> are useful for breaking down formatted input into tokens and translating individual tokens according to their data type.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Scanner.html">https://docs.oracle.com/javase/8/docs/api/java/util/Scanner.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90-2">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">Scanner</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span> <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">try</span> {
        s = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Scanner</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;xanadu.txt&quot;</span>)));
        <span class="hljs-keyword">while</span> (s.hasNext()) {
            System.out.println(s.next());
        }
    } <span class="hljs-keyword">finally</span> {
        <span class="hljs-keyword">if</span> (s != <span class="hljs-literal">null</span>) {
            s.close();
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="formatting">Formatting</h1>
<p>Stream objects that implement formatting are instances of either <code>PrintWriter</code>, a character stream class, or <code>PrintStream</code>, a byte stream class.</p>
<ul>
<li>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/PrintWriter.html">https://docs.oracle.com/javase/8/docs/api/java/io/PrintWriter.html</a></p>
</li>
<li>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/io/PrintStream.html">https://docs.oracle.com/javase/8/docs/api/java/io/PrintStream.html</a></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/12/systemfields.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="system">System</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">System</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
</code></pre>
<p>The System class contains several useful class fields （Standard Streams） and methods.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="39" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E4%BD%A0%E6%9C%80%E5%96%9C%E6%AC%A2%E7%9A%84systemout">你最喜欢的<code>System.out</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> PrintStream out
</code></pre>
<p>The &quot;standard&quot; output stream. This stream is already open and ready to accept output data. Typically this stream corresponds to display output or another output destination specified by the host environment or user.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">System.out.println(data)
</code></pre>
<p><small><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/System.html#out">https://docs.oracle.com/javase/8/docs/api/java/lang/System.html#out</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/12/io-spec.gif&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-format-method">The <code>format</code> Method</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    <span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
    <span class="hljs-type">double</span> <span class="hljs-variable">r</span> <span class="hljs-operator">=</span> Math.sqrt(i);
    
    System.out.format(<span class="hljs-string">&quot;The square root of %d is %f.%n&quot;</span>, i, r);
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
    System.out.format(<span class="hljs-string">&quot;%f, %1$+020.10f %n&quot;</span>, Math.PI);
}
</code></pre>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="41" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="systemin"><code>System.in</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> InputStream in
</code></pre>
<p>The &quot;standard&quot; input stream. This stream is already open and ready to supply input data. Typically this stream corresponds to keyboard input or another input source specified by the host environment or user.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="console">Console</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> IOException {
    <span class="hljs-type">Console</span> <span class="hljs-variable">c</span> <span class="hljs-operator">=</span> System.console();
    <span class="hljs-keyword">if</span> (c == <span class="hljs-literal">null</span>) {
        System.err.println(<span class="hljs-string">&quot;No console.&quot;</span>);
        System.exit(<span class="hljs-number">1</span>);
    }

    <span class="hljs-type">String</span> <span class="hljs-variable">login</span> <span class="hljs-operator">=</span> c.readLine(<span class="hljs-string">&quot;Enter your login: &quot;</span>);
    <span class="hljs-type">char</span>[] oldPassword = c.readPassword(<span class="hljs-string">&quot;Enter your old password: &quot;</span>);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="data-streams">Data Streams</h1>
<p>Data streams support binary I/O of primitive data type values (boolean, char, byte, short, int, long, float, and double) as well as String values. All data streams implement either the <code>DataInput</code> interface or the <code>DataOutput</code> interface.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="object-streams">Object Streams</h1>
<p>Just as data streams support I/O of primitive data types, object streams support I/O of objects. Most, but not all, standard classes support serialization of their objects. Those that do implement the marker interface <code>Serializable</code>.</p>
<p>The object stream classes are <code>ObjectInputStream</code> and <code>ObjectOutputStream</code>. These classes implement <code>ObjectInput</code> and <code>ObjectOutput</code>, which are subinterfaces of <code>DataInput</code> and <code>DataOutput</code>. That means that all the primitive data I/O methods covered in Data Streams are also implemented in object streams.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="java-object-serializationdeserialization">Java Object Serialization/Deserialization</h1>
<p>Serialization is the conversion of the state of an object into a byte stream; deserialization does the opposite. Stated differently, serialization is the conversion of a Java object into a static stream (sequence) of bytes which can then be saved to a database or transferred over a network.</p>
<p><a href="https://www.baeldung.com/java-serialization">https://www.baeldung.com/java-serialization</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="47" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90-3">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Serializable</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span> <span class="hljs-variable">serialVersionUID</span> <span class="hljs-operator">=</span> <span class="hljs-number">1L</span>;
    <span class="hljs-keyword">static</span> <span class="hljs-type">String</span> <span class="hljs-variable">country</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;ITALY&quot;</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> age;
    <span class="hljs-keyword">private</span> String name;
    <span class="hljs-keyword">transient</span> <span class="hljs-type">int</span> height;

    <span class="hljs-comment">// getters and setters</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="48" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h5 id="%E5%AF%B9%E8%B1%A1%E7%8A%B6%E6%80%81%E4%BF%9D%E6%8C%81">对象状态保持</h5>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">whenSerializingAndDeserializing_ThenObjectIsTheSame</span><span class="hljs-params">()</span> 
    <span class="hljs-keyword">throws</span> IOException, ClassNotFoundException { 
    <span class="hljs-type">Person</span> <span class="hljs-variable">person</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Person</span>();
    person.setAge(<span class="hljs-number">20</span>);

    <span class="hljs-type">FileOutputStream</span> <span class="hljs-variable">fileOutputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileOutputStream</span>(<span class="hljs-string">&quot;yourfile.txt&quot;</span>);
    <span class="hljs-type">ObjectOutputStream</span> <span class="hljs-variable">objectOutputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ObjectOutputStream</span>(fileOutputStream);

    <span class="hljs-type">FileInputStream</span> <span class="hljs-variable">fileInputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;yourfile.txt&quot;</span>);
    <span class="hljs-type">ObjectInputStream</span> <span class="hljs-variable">objectInputStream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ObjectInputStream</span>(fileInputStream);

}

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="49" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="custom-serialization">Custom Serialization</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Serializable</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span> <span class="hljs-variable">serialVersionUID</span> <span class="hljs-operator">=</span> <span class="hljs-number">1L</span>;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">transient</span> Address address;
    <span class="hljs-keyword">private</span> Person person;
    <span class="hljs-comment">// setters and getters</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">writeObject</span><span class="hljs-params">(ObjectOutputStream oos)</span>  <span class="hljs-keyword">throws</span> IOException {
        oos.defaultWriteObject();
        oos.writeObject(address.getHouseNumber());
    }

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">readObject</span><span class="hljs-params">(ObjectInputStream ois)</span> <span class="hljs-keyword">throws</span> ClassNotFoundException, IOException {
        ois.defaultReadObject();
        <span class="hljs-type">Integer</span> <span class="hljs-variable">houseNumber</span> <span class="hljs-operator">=</span> (Integer) ois.readObject();
        <span class="hljs-type">Address</span> <span class="hljs-variable">a</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Address</span>();
        a.setHouseNumber(houseNumber);
        <span class="hljs-built_in">this</span>.setAddress(a);
    }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Address</span> { <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> houseNumber; }
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="50" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="file">File</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">File</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
    <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Serializable</span>, Comparable&lt;File&gt;
</code></pre>
<p>An abstract representation of file and directory pathnames.</p>
<p>The File class gives us the ability to work with files and directories on the file system.</p>
<p><a href="https://www.baeldung.com/java-io-file">https://www.baeldung.com/java-io-file</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="zh-CN" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="81">
<h1 id="randomaccessfile">RandomAccessFile</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RandomAccessFile</span>
    <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DataOutput</span>, DataInput, Closeable
