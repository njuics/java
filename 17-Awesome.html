<h2 id="h2-%E7%A4%BA%E4%BE%8B%E5%86%85%E5%AD%98%E6%95%B0%E6%8D%AE%E5%BA%93">H2 示例：内存数据库</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.sql.Connection;
<span class="hljs-keyword">import</span> java.sql.DriverManager;
<span class="hljs-keyword">import</span> java.sql.ResultSet;
<span class="hljs-keyword">import</span> java.sql.SQLException;
<span class="hljs-keyword">import</span> java.sql.Statement;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">H2Example</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// 需要在构建工具中引入 H2 依赖，例如 Maven：</span>
        <span class="hljs-comment">// &lt;dependency&gt;</span>
        <span class="hljs-comment">//   &lt;groupId&gt;com.h2database&lt;/groupId&gt;</span>
        <span class="hljs-comment">//   &lt;artifactId&gt;h2&lt;/artifactId&gt;</span>
        <span class="hljs-comment">//   &lt;version&gt;2.2.224&lt;/version&gt;</span>
        <span class="hljs-comment">// &lt;/dependency&gt;</span>

        <span class="hljs-type">String</span> <span class="hljs-variable">url</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1&quot;</span>; <span class="hljs-comment">// JVM 存活期间一直保留</span>
        <span class="hljs-keyword">try</span> (
            <span class="hljs-type">Connection</span> <span class="hljs-variable">conn</span> <span class="hljs-operator">=</span> DriverManager.getConnection(url, <span class="hljs-string">&quot;sa&quot;</span>, <span class="hljs-string">&quot;&quot;</span>);
            <span class="hljs-type">Statement</span> <span class="hljs-variable">stmt</span> <span class="hljs-operator">=</span> conn.createStatement()
        ) {
            <span class="hljs-comment">// 1. 创建表</span>
            stmt.execute(<span class="hljs-string">&quot;CREATE TABLE users (id INT PRIMARY KEY, name VARCHAR(50))&quot;</span>);

            <span class="hljs-comment">// 2. 插入数据</span>
            stmt.executeUpdate(<span class="hljs-string">&quot;INSERT INTO users VALUES (1, &#x27;Alice&#x27;)&quot;</span>);
            stmt.executeUpdate(<span class="hljs-string">&quot;INSERT INTO users VALUES (2, &#x27;Bob&#x27;)&quot;</span>);

            <span class="hljs-comment">// 3. 查询数据</span>
            <span class="hljs-keyword">try</span> (<span class="hljs-type">ResultSet</span> <span class="hljs-variable">rs</span> <span class="hljs-operator">=</span> stmt.executeQuery(<span class="hljs-string">&quot;SELECT * FROM users&quot;</span>)) {
                <span class="hljs-keyword">while</span> (rs.next()) {
                    System.out.println(rs.getInt(<span class="hljs-string">&quot;id&quot;</span>) + <span class="hljs-string">&quot;: &quot;</span> + rs.getString(<span class="hljs-string">&quot;name&quot;</span>));
                }
            }
        } <span class="hljs-keyword">catch</span> (SQLException e) {
            e.printStackTrace();
        }
    }
}
</code></pre>

<h2 id="javassist-%E7%A4%BA%E4%BE%8B%E5%8A%A8%E6%80%81%E4%BF%AE%E6%94%B9%E7%B1%BB">Javassist 示例：动态修改类</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> javassist.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">JavassistExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
        <span class="hljs-comment">// 1. 获取类池</span>
        <span class="hljs-type">ClassPool</span> <span class="hljs-variable">pool</span> <span class="hljs-operator">=</span> ClassPool.getDefault();
        
        <span class="hljs-comment">// 2. 加载目标类</span>
        <span class="hljs-type">CtClass</span> <span class="hljs-variable">cc</span> <span class="hljs-operator">=</span> pool.get(<span class="hljs-string">&quot;com.example.User&quot;</span>);
        
        <span class="hljs-comment">// 3. 添加新方法</span>
        <span class="hljs-type">CtMethod</span> <span class="hljs-variable">newMethod</span> <span class="hljs-operator">=</span> CtNewMethod.make(
            <span class="hljs-string">&quot;public void sayHello() { &quot;</span> +
            <span class="hljs-string">&quot;    System.out.println(\&quot;Hello from Javassist!\&quot;); &quot;</span> +
            <span class="hljs-string">&quot;}&quot;</span>,
            cc
        );
        cc.addMethod(newMethod);
        
        <span class="hljs-comment">// 4. 修改现有方法（添加日志）</span>
        <span class="hljs-type">CtMethod</span> <span class="hljs-variable">method</span> <span class="hljs-operator">=</span> cc.getDeclaredMethod(<span class="hljs-string">&quot;getName&quot;</span>);
        method.insertBefore(<span class="hljs-string">&quot;System.out.println(\&quot;Getting name...\&quot;);&quot;</span>);
        
        <span class="hljs-comment">// 5. 生成修改后的类</span>
        cc.writeFile(<span class="hljs-string">&quot;.&quot;</span>);
        
        <span class="hljs-comment">// 6. 使用修改后的类</span>
        Class&lt;?&gt; clazz = cc.toClass();
        <span class="hljs-type">Object</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> clazz.newInstance();
        clazz.getMethod(<span class="hljs-string">&quot;sayHello&quot;</span>).invoke(user);
    }
}
</code></pre>
</section>

<h2 id="asm-%E7%A4%BA%E4%BE%8B%E6%96%B9%E6%B3%95%E8%B0%83%E7%94%A8%E7%BB%9F%E8%AE%A1">ASM 示例：方法调用统计</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.objectweb.asm.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MethodCounter</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ClassVisitor</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> <span class="hljs-variable">methodCount</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">MethodCounter</span><span class="hljs-params">()</span> {
        <span class="hljs-built_in">super</span>(Opcodes.ASM9);
    }
    
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> MethodVisitor <span class="hljs-title function_">visitMethod</span><span class="hljs-params">(
        <span class="hljs-type">int</span> access, String name, String descriptor,
        String signature, String[] exceptions)</span> {
        methodCount++;
        <span class="hljs-keyword">return</span> <span class="hljs-built_in">super</span>.visitMethod(access, name, descriptor, signature, exceptions);
    }
    
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getMethodCount</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> methodCount;
    }
}

<span class="hljs-comment">// 使用示例</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ASMExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
        <span class="hljs-type">ClassReader</span> <span class="hljs-variable">cr</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ClassReader</span>(<span class="hljs-string">&quot;com.example.User&quot;</span>);
        <span class="hljs-type">MethodCounter</span> <span class="hljs-variable">counter</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">MethodCounter</span>();
        cr.accept(counter, <span class="hljs-number">0</span>);
        System.out.println(<span class="hljs-string">&quot;方法数量: &quot;</span> + counter.getMethodCount());
    }
}
</code></pre>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">User</span><span class="hljs-params">()</span> {}
    
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">User</span><span class="hljs-params">(String name, <span class="hljs-type">int</span> age)</span> {

        <span class="hljs-built_in">this</span>.age = age;
    }
    
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> {

    }
    
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">getAge</span><span class="hljs-params">()</span> {

    }
    
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setAge</span><span class="hljs-params">(<span class="hljs-type">int</span> age)</span> {
        <span class="hljs-built_in">this</span>.age = age;
    }
    
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">equals</span><span class="hljs-params">(Object o)</span> {
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span> == o) <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;

<h3 id="%E4%BD%BF%E7%94%A8-lombok%E7%AE%80%E6%B4%81%E6%96%B9%E5%BC%8F">使用 Lombok（简洁方式）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> lombok.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> {

    <span class="hljs-keyword">private</span> <span class="hljs-type">int</span> age;
}

<span class="hljs-type">User</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> User.builder()
    .name(<span class="hljs-string">&quot;张三&quot;</span>)
    .age(<span class="hljs-number">25</span>)
    .build();
</code></pre>

<h3 id="1-%E5%AE%9A%E4%B9%89%E8%AF%AD%E6%B3%95calcg4">1. 定义语法（Calc.g4）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-antlr">grammar Calc;

expr:   expr '+' term    # Add
    |   expr '-' term    # Sub
    |   term             # TermValue
    ;

term:   term '*' factor  # Mul
    |   term '/' factor  # Div
    |   factor           # FactorValue
    ;

factor: NUMBER           # Number
    |   '(' expr ')'    # Parens
    ;

NUMBER: [0-9]+ ('.' [0-9]+)?;
WS: [ \t\r\n]+ -&gt; skip;
</code></pre>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.bytedeco.javacv.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">WebcamExample</span> {

        <span class="hljs-comment">// 1. 打开摄像头</span>
        <span class="hljs-type">FrameGrabber</span> <span class="hljs-variable">grabber</span> <span class="hljs-operator">=</span> FrameGrabber.createDefault(<span class="hljs-number">0</span>);

        <span class="hljs-comment">// 2. 创建窗口显示</span>
        <span class="hljs-type">CanvasFrame</span> <span class="hljs-variable">canvas</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CanvasFrame</span>(<span class="hljs-string">&quot;摄像头&quot;</span>);

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.bytedeco.opencv.opencv_core.*;
<span class="hljs-keyword">import</span> org.bytedeco.opencv.opencv_imgproc.*;
<span class="hljs-keyword">import</span> <span class="hljs-keyword">static</span> org.bytedeco.opencv.global.opencv_imgcodecs.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ImageProcessing</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// 1. 读取图像</span>
        <span class="hljs-type">Mat</span> <span class="hljs-variable">image</span> <span class="hljs-operator">=</span> imread(<span class="hljs-string">&quot;input.jpg&quot;</span>);
        
        <span class="hljs-comment">// 2. 转换为灰度图</span>
        <span class="hljs-type">Mat</span> <span class="hljs-variable">gray</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Mat</span>();

<h1 id="constraint-satisfaction-problem-solver">Constraint Satisfaction Problem Solver</h1>
<ul>
<li><a href="https://choco-solver.org">Choco</a> - Off-the-shelf constraint satisfaction problem solver that uses constraint programming techniques.</li>
<li><a href="https://github.com/radsz/jacop">JaCoP</a> - Includes an interface for the FlatZinc language, enabling it to execute MiniZinc models. (AGPL-3.0)</li>
<li><a href="https://www.optaplanner.org">OptaPlanner</a> - Business planning and resource scheduling optimization solver.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="33">
<h3 id="choco-solver-%E7%A4%BA%E4%BE%8B%E6%95%B0%E7%8B%AC%E6%B1%82%E8%A7%A3%E5%99%A8">Choco Solver 示例：数独求解器</h3>
<p>数独是一个经典的约束满足问题（CSP），需要满足以下约束：</p>
<ol>
<li>每行包含 1-9 的数字，且不重复</li>
<li>每列包含 1-9 的数字，且不重复</li>
<li>每个 3x3 宫格包含 1-9 的数字，且不重复</li>
</ol>
<p><strong>Choco Solver 调用 <code>solve()</code> 方法求解</strong>：</p>
<ul>
<li><strong>Model</strong>：定义约束问题的模型</li>
<li><strong>IntVar</strong>：整数变量，表示需要求解的未知值</li>
<li><strong>约束</strong>：使用 <code>allDifferent()</code>、<code>arithm()</code> 等方法添加约束条件</li>

<h3 id="%E4%BD%BF%E7%94%A8-choco-solver-%E6%B1%82%E8%A7%A3">使用 Choco Solver 求解</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">package</span> com.example.csp;

<span class="hljs-keyword">import</span> org.chocosolver.solver.Model;
<span class="hljs-keyword">import</span> org.chocosolver.solver.Solver;
<span class="hljs-keyword">import</span> org.chocosolver.solver.variables.IntVar;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SudokuSolver</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-comment">// 定义数独谜题（0 表示空白）</span>
        <span class="hljs-type">int</span>[][] puzzle = {
            {<span class="hljs-number">5</span>, <span class="hljs-number">3</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">7</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>},
            {<span class="hljs-number">6</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>, <span class="hljs-number">5</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>},
            {<span class="hljs-number">0</span>, <span class="hljs-number">9</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">6</span>, <span class="hljs-number">0</span>},
            {<span class="hljs-number">8</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">6</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">3</span>},
            {<span class="hljs-number">4</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>, <span class="hljs-number">3</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>},
            {<span class="hljs-number">7</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">2</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">6</span>},
            {<span class="hljs-number">0</span>, <span class="hljs-number">6</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">2</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>},
            {<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">4</span>, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">5</span>},
            {<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">7</span>, <span class="hljs-number">9</span>}
        };

        <span class="hljs-type">int</span>[][] solution = solveSudoku(puzzle);
        <span class="hljs-comment">// 输出解...</span>
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">int</span>[][] solveSudoku(<span class="hljs-type">int</span>[][] puzzle) {
        <span class="hljs-type">Model</span> <span class="hljs-variable">model</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Model</span>(<span class="hljs-string">&quot;Sudoku&quot;</span>);
        
        <span class="hljs-comment">// 创建变量：9x9 网格，每个单元格值范围 1-9</span>
        IntVar[][] grid = <span class="hljs-keyword">new</span> <span class="hljs-title class_">IntVar</span>[<span class="hljs-number">9</span>][<span class="hljs-number">9</span>];
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">9</span>; i++) {
            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">9</span>; j++) {
                grid[i][j] = model.intVar(<span class="hljs-string">&quot;cell[&quot;</span> + i + <span class="hljs-string">&quot;,&quot;</span> + j + <span class="hljs-string">&quot;]&quot;</span>, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>);
            }
        }

        <span class="hljs-comment">// 约束1：已给定的数字</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">9</span>; i++) {
            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">9</span>; j++) {
                <span class="hljs-keyword">if</span> (puzzle[i][j] != <span class="hljs-number">0</span>) {
                    model.arithm(grid[i][j], <span class="hljs-string">&quot;=&quot;</span>, puzzle[i][j]).post();
                }
            }
        }

        <span class="hljs-comment">// 约束2：每行数字都不相同</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">9</span>; i++) {
            model.allDifferent(grid[i]).post();
        }

        <span class="hljs-comment">// 约束3：每列数字都不相同</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">9</span>; j++) {
            IntVar[] column = <span class="hljs-keyword">new</span> <span class="hljs-title class_">IntVar</span>[<span class="hljs-number">9</span>];
            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">9</span>; i++) {
                column[i] = grid[i][j];
            }
            model.allDifferent(column).post();
        }

        <span class="hljs-comment">// 约束4：每个 3x3 宫格数字都不相同</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">boxRow</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; boxRow &lt; <span class="hljs-number">3</span>; boxRow++) {
            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">boxCol</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; boxCol &lt; <span class="hljs-number">3</span>; boxCol++) {
                IntVar[] box = <span class="hljs-keyword">new</span> <span class="hljs-title class_">IntVar</span>[<span class="hljs-number">9</span>];
                <span class="hljs-type">int</span> <span class="hljs-variable">index</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
                <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> boxRow * <span class="hljs-number">3</span>; i &lt; boxRow * <span class="hljs-number">3</span> + <span class="hljs-number">3</span>; i++) {
                    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> boxCol * <span class="hljs-number">3</span>; j &lt; boxCol * <span class="hljs-number">3</span> + <span class="hljs-number">3</span>; j++) {
                        box[index++] = grid[i][j];
                    }
                }
                model.allDifferent(box).post();
            }
        }

        <span class="hljs-comment">// 求解</span>
        <span class="hljs-type">Solver</span> <span class="hljs-variable">solver</span> <span class="hljs-operator">=</span> model.getSolver();
        <span class="hljs-keyword">if</span> (solver.solve()) {
            <span class="hljs-type">int</span>[][] solution = <span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[<span class="hljs-number">9</span>][<span class="hljs-number">9</span>];
            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">9</span>; i++) {
                <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">9</span>; j++) {
                    solution[i][j] = grid[i][j].getValue();
                }
            }
            <span class="hljs-keyword">return</span> solution;
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }
}
</code></pre>

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LuceneExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> <span class="hljs-keyword">throws</span> Exception {
        <span class="hljs-comment">// 1. 创建索引目录</span>

        <span class="hljs-type">IndexWriterConfig</span> <span class="hljs-variable">config</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IndexWriterConfig</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">StandardAnalyzer</span>());
        <span class="hljs-type">IndexWriter</span> <span class="hljs-variable">writer</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IndexWriter</span>(directory, config);
        
        <span class="hljs-comment">// 2. 添加文档到索引</span>
        <span class="hljs-type">Document</span> <span class="hljs-variable">doc1</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Document</span>();
        doc1.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TextField</span>(<span class="hljs-string">&quot;title&quot;</span>, <span class="hljs-string">&quot;Java编程指南&quot;</span>, Field.Store.YES));
        doc1.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TextField</span>(<span class="hljs-string">&quot;content&quot;</span>, <span class="hljs-string">&quot;这是一本关于Java编程的书籍&quot;</span>, Field.Store.YES));
        writer.addDocument(doc1);
        
        <span class="hljs-type">Document</span> <span class="hljs-variable">doc2</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Document</span>();
        doc2.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TextField</span>(<span class="hljs-string">&quot;title&quot;</span>, <span class="hljs-string">&quot;Python数据分析&quot;</span>, Field.Store.YES));
        doc2.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TextField</span>(<span class="hljs-string">&quot;content&quot;</span>, <span class="hljs-string">&quot;学习Python进行数据分析&quot;</span>, Field.Store.YES));
        writer.addDocument(doc2);
        
        writer.close();
        
        <span class="hljs-comment">// 3. 搜索</span>
