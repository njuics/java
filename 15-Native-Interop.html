<h1 id="java%E9%AB%98%E7%BA%A7%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1">Java高级程序设计</h1>
<h2 id="%E6%9C%AC%E5%9C%B0%E4%BB%A3%E7%A0%81%E4%BA%A4%E4%BA%92">本地代码交互</h2>
<h3 id="jni--jna--unsafe">JNI / JNA / Unsafe</h3>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="1" style="" data-marpit-pagination-total="62" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E9%9C%80%E8%A6%81%E6%9C%AC%E5%9C%B0%E4%BB%A3%E7%A0%81%E4%BA%A4%E4%BA%92">为什么需要本地代码交互？</h1>
<p>Java 虽然功能强大，但在某些场景下需要与本地代码（C/C++）交互：</p>
<ul>
<li><strong>性能优化</strong>：调用高性能的 C/C++ 库</li>
<li><strong>系统调用</strong>：访问操作系统底层功能</li>
<li><strong>硬件交互</strong>：直接操作硬件设备</li>
<li><strong>遗留代码</strong>：集成现有的 C/C++ 代码库</li>
<li><strong>特殊功能</strong>：Java 无法直接实现的功能</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-java-native-interface">JNI (Java Native Interface)</h1>
<p>JNI 是 Java 平台提供的标准编程接口，用于实现 Java 代码与本地代码（C/C++）之间的互操作。</p>
<h2 id="%E7%89%B9%E7%82%B9">特点</h2>
<ul>
<li><strong>标准接口</strong>：Java 平台原生支持</li>
<li><strong>双向调用</strong>：Java 可以调用本地代码，本地代码也可以调用 Java</li>
<li><strong>类型映射</strong>：提供 Java 类型与本地类型的映射</li>
<li><strong>内存管理</strong>：需要手动管理本地内存</li>
</ul>
<p><a href="https://docs.oracle.com/javase/8/docs/technotes/guides/jni/">https://docs.oracle.com/javase/8/docs/technotes/guides/jni/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E5%B7%A5%E4%BD%9C%E6%B5%81%E7%A8%8B">JNI 工作流程</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Java 代码
   ↓
javac 编译
   ↓
javah 生成头文件
   ↓
C/C++ 实现本地方法
   ↓
编译为动态库 (.so/.dll/.dylib)
   ↓
System.loadLibrary() 加载
   ↓
调用本地方法
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E7%A4%BA%E4%BE%8Bhello-world">JNI 示例：Hello World</h1>
<h2 id="java-%E4%BB%A3%E7%A0%81">Java 代码</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HelloJNI</span> {
    <span class="hljs-comment">// 声明本地方法</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">native</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">sayHello</span><span class="hljs-params">()</span>;
    
    <span class="hljs-comment">// 加载动态库</span>
    <span class="hljs-keyword">static</span> {
        System.loadLibrary(<span class="hljs-string">&quot;hello&quot;</span>);  <span class="hljs-comment">// 加载 libhello.so (Linux) 或 hello.dll (Windows)</span>
    }
    
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">HelloJNI</span>().sayHello();
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E7%A4%BA%E4%BE%8B%E7%94%9F%E6%88%90%E5%A4%B4%E6%96%87%E4%BB%B6">JNI 示例：生成头文件</h1>
<p>使用 <code>javah</code> 生成 C 头文件：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">javac HelloJNI.java
javah HelloJNI
</code></pre>
<p>生成的头文件 <code>HelloJNI.h</code>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;jni.h&gt;</span></span>

JNIEXPORT <span class="hljs-type">void</span> JNICALL <span class="hljs-title function_">Java_HelloJNI_sayHello</span><span class="hljs-params">(JNIEnv *, jobject)</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E7%A4%BA%E4%BE%8Bc-%E5%AE%9E%E7%8E%B0">JNI 示例：C 实现</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;jni.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;HelloJNI.h&quot;</span></span>

JNIEXPORT <span class="hljs-type">void</span> JNICALL <span class="hljs-title function_">Java_HelloJNI_sayHello</span><span class="hljs-params">(JNIEnv *env, jobject obj)</span> {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Hello from C!\n&quot;</span>);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E7%BC%96%E8%AF%91%E4%B8%BA%E5%8A%A8%E6%80%81%E5%BA%93">编译为动态库：</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Linux</span>
gcc -shared -fPIC -I<span class="hljs-variable">${JAVA_HOME}</span>/include -I<span class="hljs-variable">${JAVA_HOME}</span>/include/linux \
    HelloJNI.c -o libhello.so

<span class="hljs-comment"># macOS</span>
gcc -shared -fPIC -I<span class="hljs-variable">${JAVA_HOME}</span>/include -I<span class="hljs-variable">${JAVA_HOME}</span>/include/darwin \
    HelloJNI.c -o libhello.dylib

<span class="hljs-comment"># Windows</span>
gcc -shared -I<span class="hljs-string">&quot;%JAVA_HOME%\include&quot;</span> -I<span class="hljs-string">&quot;%JAVA_HOME%\include\win32&quot;</span> \
    HelloJNI.c -o hello.dll
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h4 id="jni-%E7%B1%BB%E5%9E%8B%E6%98%A0%E5%B0%84">JNI 类型映射</h4>
<table>
<thead>
<tr>
<th>Java 类型</th>
<th>JNI 类型</th>
<th>C 类型</th>
</tr>
</thead>
<tbody>
<tr>
<td>boolean</td>
<td>jboolean</td>
<td>unsigned char</td>
</tr>
<tr>
<td>byte</td>
<td>jbyte</td>
<td>signed char</td>
</tr>
<tr>
<td>char</td>
<td>jchar</td>
<td>unsigned short</td>
</tr>
<tr>
<td>short</td>
<td>jshort</td>
<td>short</td>
</tr>
<tr>
<td>int</td>
<td>jint</td>
<td>int</td>
</tr>
<tr>
<td>long</td>
<td>jlong</td>
<td>long long</td>
</tr>
<tr>
<td>float</td>
<td>jfloat</td>
<td>float</td>
</tr>
<tr>
<td>double</td>
<td>jdouble</td>
<td>double</td>
</tr>
<tr>
<td>Object</td>
<td>jobject</td>
<td>void*</td>
</tr>
<tr>
<td>String</td>
<td>jstring</td>
<td>-</td>
</tr>
<tr>
<td>int[]</td>
<td>jintArray</td>
<td>-</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E5%AD%97%E7%AC%A6%E4%B8%B2%E6%93%8D%E4%BD%9C">JNI 字符串操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">// Java String 转 C 字符串</span>
JNIEXPORT <span class="hljs-type">void</span> JNICALL <span class="hljs-title function_">Java_Example_printString</span><span class="hljs-params">(JNIEnv *env, jobject obj, jstring str)</span> {
    <span class="hljs-type">const</span> <span class="hljs-type">char</span> *cstr = (*env)-&gt;GetStringUTFChars(env, str, <span class="hljs-literal">NULL</span>);
    <span class="hljs-keyword">if</span> (cstr == <span class="hljs-literal">NULL</span>) {
        <span class="hljs-keyword">return</span>;  <span class="hljs-comment">// 内存不足</span>
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%s\n&quot;</span>, cstr);
    <span class="hljs-comment">// 必须释放字符串</span>
    (*env)-&gt;ReleaseStringUTFChars(env, str, cstr);
}
</code></pre>
<p><strong>重要</strong>：使用 <code>GetStringUTFChars</code> 获取的字符串必须用 <code>ReleaseStringUTFChars</code> 释放！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E6%95%B0%E7%BB%84%E6%93%8D%E4%BD%9C">JNI 数组操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">JNIEXPORT jintArray JNICALL <span class="hljs-title function_">Java_Example_doubleArray</span><span class="hljs-params">(JNIEnv *env, jobject obj, jintArray arr)</span> {
    <span class="hljs-comment">// 获取数组长度</span>
    jsize len = (*env)-&gt;GetArrayLength(env, arr);
    <span class="hljs-comment">// 获取数组元素（可能复制，也可能直接访问）</span>
    jint *body = (*env)-&gt;GetIntArrayElements(env, arr, <span class="hljs-literal">NULL</span>);
    <span class="hljs-comment">// 操作数组</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; len; i++) {
        body[i] *= <span class="hljs-number">2</span>;
    }
    <span class="hljs-comment">// 释放数组（isCopy 表示是否复制）</span>
    (*env)-&gt;ReleaseIntArrayElements(env, arr, body, <span class="hljs-number">0</span>);
    <span class="hljs-keyword">return</span> arr;
}

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E8%B0%83%E7%94%A8-java-%E6%96%B9%E6%B3%95">JNI 调用 Java 方法</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">JNIEXPORT <span class="hljs-type">void</span> JNICALL <span class="hljs-title function_">Java_Example_callJavaMethod</span><span class="hljs-params">(JNIEnv *env, jobject obj)</span> {
    <span class="hljs-comment">// 1. 获取类对象</span>
    jclass cls = (*env)-&gt;GetObjectClass(env, obj);
    <span class="hljs-comment">// 2. 获取方法 ID</span>
    jmethodID mid = (*env)-&gt;GetMethodID(env, cls, <span class="hljs-string">&quot;printMessage&quot;</span>, <span class="hljs-string">&quot;(Ljava/lang/String;)V&quot;</span>);
    <span class="hljs-comment">// 3. 创建字符串参数</span>
    jstring msg = (*env)-&gt;NewStringUTF(env, <span class="hljs-string">&quot;Hello from JNI!&quot;</span>);
    <span class="hljs-comment">// 4. 调用方法</span>
    (*env)-&gt;CallVoidMethod(env, obj, mid, msg);
    <span class="hljs-comment">// 5. 释放本地引用</span>
    (*env)-&gt;DeleteLocalRef(env, msg);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jni-%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86">JNI 异常处理</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">JNIEXPORT <span class="hljs-type">void</span> JNICALL <span class="hljs-title function_">Java_Example_handleException</span><span class="hljs-params">(JNIEnv *env, jobject obj)</span> {
    <span class="hljs-comment">// 调用可能抛出异常的方法</span>
    jclass cls = (*env)-&gt;FindClass(env, <span class="hljs-string">&quot;java/lang/Exception&quot;</span>);
    jmethodID constructor = (*env)-&gt;GetMethodID(env, cls, <span class="hljs-string">&quot;&lt;init&gt;&quot;</span>, <span class="hljs-string">&quot;(Ljava/lang/String;)V&quot;</span>);
    jstring msg = (*env)-&gt;NewStringUTF(env, <span class="hljs-string">&quot;Error occurred&quot;</span>);
    jobject exception = (*env)-&gt;NewObject(env, cls, constructor, msg);
    <span class="hljs-comment">// 抛出异常</span>
    (*env)-&gt;Throw(env, exception);
    <span class="hljs-comment">// 检查是否有异常</span>
    <span class="hljs-keyword">if</span> ((*env)-&gt;ExceptionCheck(env)) {
        (*env)-&gt;ExceptionDescribe(env);
        (*env)-&gt;ExceptionClear(env);
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h4 id="%E4%BC%98%E7%82%B9">优点</h4>
<ul>
<li><strong>标准接口</strong>：Java 平台原生支持</li>
<li><strong>性能高</strong>：直接调用本地代码，无额外开销</li>
<li><strong>功能强大</strong>：可以访问所有系统功能</li>
<li><strong>双向调用</strong>：本地代码可以回调 Java</li>
</ul>
<h4 id="%E7%BC%BA%E7%82%B9">缺点</h4>
<ul>
<li><strong>平台相关</strong>：需要为不同平台编译</li>
<li><strong>内存管理</strong>：容易内存泄漏</li>
<li><strong>类型转换</strong>：需要手动处理类型映射</li>
<li><strong>调试困难</strong>：跨语言调试复杂</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-java-native-access">JNA (Java Native Access)</h1>
<p>JNA 是一个 Java 库，提供了更简单的方式来访问本地代码，<strong>无需编写 C/C++ 代码</strong>。</p>
<ul>
<li><strong>纯 Java</strong>：只需要 Java 代码</li>
<li><strong>动态绑定</strong>：运行时动态加载动态库</li>
<li><strong>类型映射</strong>：自动处理类型转换</li>
<li><strong>易于使用</strong>：比 JNI 简单得多</li>
</ul>
<p><a href="https://github.com/java-native-access/jna">https://github.com/java-native-access/jna</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86">JNA 工作原理</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Java 代码
   ↓
JNA 库
   ↓
动态加载 .so/.dll/.dylib
   ↓
自动类型映射
   ↓
调用 C 函数
</code></pre>
<p><strong>关键</strong>：只需要已有的 C 动态库，不需要编写 C 代码！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E7%A4%BA%E4%BE%8B%E8%B0%83%E7%94%A8-c-%E6%A0%87%E5%87%86%E5%BA%93">JNA 示例：调用 C 标准库</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> com.sun.jna.Library;
<span class="hljs-keyword">import</span> com.sun.jna.Native;

<span class="hljs-comment">// 定义接口映射到 C 库</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">CLibrary</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Library</span> {
    <span class="hljs-type">CLibrary</span> <span class="hljs-variable">INSTANCE</span> <span class="hljs-operator">=</span> (CLibrary) Native.load(<span class="hljs-string">&quot;c&quot;</span>, CLibrary.class);
    
    <span class="hljs-comment">// 映射到 printf 函数</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">printf</span><span class="hljs-params">(String format, Object... args)</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">JNAExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        CLibrary.INSTANCE.printf(<span class="hljs-string">&quot;Hello from C: %s\n&quot;</span>, <span class="hljs-string">&quot;JNA&quot;</span>);
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="jna-%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86%E4%B8%BA%E4%BB%80%E4%B9%88-printf-%E8%83%BD%E6%98%A0%E5%B0%84%E5%88%B0-c-%E7%9A%84-printf">JNA 工作原理：为什么 <code>printf</code> 能映射到 C 的 <code>printf</code>？</h2>
<h3 id="1-%E5%8A%A8%E6%80%81%E5%BA%93%E5%8A%A0%E8%BD%BD">1. 动态库加载</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">Native.load(<span class="hljs-string">&quot;c&quot;</span>, CLibrary.class)
</code></pre>
<ul>
<li><code>&quot;c&quot;</code> 表示加载 C 标准库（Linux: <code>libc.so</code>，macOS: <code>libc.dylib</code>，Windows: <code>msvcrt.dll</code>）</li>
<li>JNA 会根据平台自动查找对应的动态库</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="2-%E6%96%B9%E6%B3%95%E5%90%8D%E5%8C%B9%E9%85%8D">2. 方法名匹配</h3>
<p>JNA 使用<strong>动态代理</strong>机制：</p>
<ul>
<li>当调用 <code>CLibrary.INSTANCE.printf(...)</code> 时</li>
<li>JNA 拦截方法调用，获取方法名 <code>&quot;printf&quot;</code></li>
<li>在已加载的动态库中查找同名函数 <code>printf</code></li>
<li>如果找不到，会尝试添加下划线前缀（某些平台的 C 函数有 <code>_printf</code>）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="3-%E7%B1%BB%E5%9E%8B%E8%87%AA%E5%8A%A8%E8%BD%AC%E6%8D%A2">3. 类型自动转换</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">void</span> <span class="hljs-title function_">printf</span><span class="hljs-params">(String format, Object... args)</span>;
</code></pre>
<ul>
<li><code>String</code> → <code>char*</code>（C 字符串）</li>
<li><code>Object...</code> → 根据实际类型转换（如 <code>int</code> → <code>int</code>，<code>String</code> → <code>char*</code>）</li>
<li>JNA 自动处理内存分配和释放</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="4-%E8%B0%83%E7%94%A8%E6%B5%81%E7%A8%8B">4. 调用流程</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Java: CLibrary.INSTANCE.printf(&quot;Hello&quot;, &quot;World&quot;)
  ↓
JNA 动态代理拦截
  ↓
查找 C 函数: printf
  ↓
类型转换: String → char*
  ↓
调用 C: printf(&quot;Hello&quot;, &quot;World&quot;)
  ↓
返回结果（如果有）
</code></pre>
<p><strong>关键点</strong>：方法名必须与 C 函数名完全匹配（或使用 <code>@FunctionName</code> 注解指定）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E7%B1%BB%E5%9E%8B%E6%98%A0%E5%B0%84">JNA 类型映射</h1>
<table>
<thead>
<tr>
<th>C 类型</th>
<th>JNA Java 类型</th>
</tr>
</thead>
<tbody>
<tr>
<td>char*</td>
<td>String</td>
</tr>
<tr>
<td>int</td>
<td>int</td>
</tr>
<tr>
<td>long</td>
<td>long</td>
</tr>
<tr>
<td>double</td>
<td>double</td>
</tr>
<tr>
<td>void*</td>
<td>Pointer</td>
</tr>
<tr>
<td>struct</td>
<td>Structure</td>
</tr>
<tr>
<td>function pointer</td>
<td>Callback</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E7%A4%BA%E4%BE%8B%E8%B0%83%E7%94%A8%E7%B3%BB%E7%BB%9F%E5%87%BD%E6%95%B0">JNA 示例：调用系统函数</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> com.sun.jna.Library;
<span class="hljs-keyword">import</span> com.sun.jna.Native;
<span class="hljs-keyword">import</span> com.sun.jna.Platform;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Kernel32</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Library</span> {
    <span class="hljs-type">Kernel32</span> <span class="hljs-variable">INSTANCE</span> <span class="hljs-operator">=</span> (Kernel32) Native.load(
        Platform.isWindows() ? <span class="hljs-string">&quot;kernel32&quot;</span> : <span class="hljs-literal">null</span>, 
        Kernel32.class
    );
    
    <span class="hljs-comment">// Windows API: GetSystemTime</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">GetSystemTime</span><span class="hljs-params">(SYSTEMTIME result)</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 定义结构体</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SYSTEMTIME</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Structure</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wYear;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wMonth;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wDayOfWeek;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wDay;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wHour;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wMinute;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wSecond;
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> wMilliseconds;
    
    <span class="hljs-comment">// 显式指定字段顺序（推荐，确保顺序正确）</span>
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> List&lt;String&gt; <span class="hljs-title function_">getFieldOrder</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> Arrays.asList(
            <span class="hljs-string">&quot;wYear&quot;</span>, <span class="hljs-string">&quot;wMonth&quot;</span>, <span class="hljs-string">&quot;wDayOfWeek&quot;</span>, <span class="hljs-string">&quot;wDay&quot;</span>,
            <span class="hljs-string">&quot;wHour&quot;</span>, <span class="hljs-string">&quot;wMinute&quot;</span>, <span class="hljs-string">&quot;wSecond&quot;</span>, <span class="hljs-string">&quot;wMilliseconds&quot;</span>
        );
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="%E7%BB%93%E6%9E%84%E4%BD%93%E6%98%A0%E5%B0%84%E8%A6%81%E6%B1%82%E5%BF%85%E9%A1%BB%E4%B8%8E-c-%E7%BB%93%E6%9E%84%E4%BD%93%E5%AE%8C%E5%85%A8%E5%8C%B9%E9%85%8D">结构体映射要求：必须与 C 结构体完全匹配</h2>
<h3 id="c-%E4%B8%AD%E7%9A%84-systemtime-%E7%BB%93%E6%9E%84%E4%BD%93%E5%AE%9A%E4%B9%89windows-api">C 中的 SYSTEMTIME 结构体定义（Windows API）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">typedef</span> <span class="hljs-class"><span class="hljs-keyword">struct</span> _<span class="hljs-title">SYSTEMTIME</span> {</span>
    WORD wYear;         <span class="hljs-comment">// short (16位)</span>
    WORD wMonth;        <span class="hljs-comment">// short</span>
    WORD wDayOfWeek;    <span class="hljs-comment">// short</span>
    WORD wDay;          <span class="hljs-comment">// short</span>
    WORD wHour;         <span class="hljs-comment">// short</span>
    WORD wMinute;       <span class="hljs-comment">// short</span>
    WORD wSecond;       <span class="hljs-comment">// short</span>
    WORD wMilliseconds; <span class="hljs-comment">// short</span>
} SYSTEMTIME;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E5%8C%B9%E9%85%8D%E8%A6%81%E6%B1%82">匹配要求</h3>
<ol>
<li>
<p><strong>字段类型必须匹配</strong></p>
<ul>
<li>C: <code>WORD</code> (16位无符号整数) → Java: <code>short</code></li>
<li>C: <code>DWORD</code> (32位) → Java: <code>int</code></li>
<li>C: <code>char*</code> → Java: <code>String</code> 或 <code>Pointer</code></li>
</ul>
</li>
<li>
<p><strong>字段顺序必须匹配</strong></p>
<ul>
<li>必须按照 C 结构体中的声明顺序定义</li>
</ul>
</li>
<li>
<p><strong>字段名可以不同</strong>（但建议保持一致）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SYSTEMTIME</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Structure</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> year;      <span class="hljs-comment">// 对应 wYear</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">short</span> month;      <span class="hljs-comment">// 对应 wMonth</span>
    <span class="hljs-comment">// ...</span>
}
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E5%BF%85%E9%A1%BB%E5%AE%8C%E5%85%A8%E5%8C%B9%E9%85%8D">为什么必须完全匹配？</h3>
<p>JNA 通过<strong>内存布局</strong>来映射结构体：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>C 结构体内存布局：
[0-1]   wYear (short)
[2-3]   wMonth (short)
[4-5]   wDayOfWeek (short)
...
</code></pre>
<p>如果 Java 结构体定义不匹配，会导致：</p>
<ul>
<li>读取错误的数据</li>
<li>内存越界，程序崩溃</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E7%BB%93%E6%9E%84%E4%BD%93%E7%A4%BA%E4%BE%8B">JNA 结构体示例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Point</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Structure</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> x;
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> y;
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> List&lt;String&gt; <span class="hljs-title function_">getFieldOrder</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> Arrays.asList(<span class="hljs-string">&quot;x&quot;</span>, <span class="hljs-string">&quot;y&quot;</span>);
    }
}

<span class="hljs-type">Point</span> <span class="hljs-variable">p</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Point</span>();
p.x = <span class="hljs-number">10</span>;
p.y = <span class="hljs-number">20</span>;
p.write();  <span class="hljs-comment">// 写入本地内存</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E5%9B%9E%E8%B0%83%E6%9C%BA%E5%88%B6c-%E2%86%92-java">JNA 回调机制：C → Java</h1>
<p>通过 <code>Callback</code> 接口可以让 C 函数回调 Java。</p>
<p>假设有一个 C 函数，接受一个回调函数：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">// C 代码</span>
<span class="hljs-keyword">typedef</span> <span class="hljs-title function_">void</span> <span class="hljs-params">(*CallbackFunc)</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span>;

<span class="hljs-type">void</span> <span class="hljs-title function_">processData</span><span class="hljs-params">(<span class="hljs-type">int</span> count, CallbackFunc callback)</span> {
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; count; i++) {
        callback(i * <span class="hljs-number">10</span>);  <span class="hljs-comment">// 调用回调函数</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="java-%E5%AE%9E%E7%8E%B0%E5%9B%9E%E8%B0%83">Java 实现回调</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> com.sun.jna.Callback;
<span class="hljs-keyword">import</span> com.sun.jna.Library;
<span class="hljs-keyword">import</span> com.sun.jna.Native;
<span class="hljs-comment">// 定义回调接口</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DataCallback</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Callback</span> {
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">callback</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span>;
}
<span class="hljs-comment">// 定义 C 库接口</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">MyLibrary</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Library</span> {
    <span class="hljs-type">MyLibrary</span> <span class="hljs-variable">INSTANCE</span> <span class="hljs-operator">=</span> Native.load(<span class="hljs-string">&quot;mylib&quot;</span>, MyLibrary.class);
    <span class="hljs-comment">// 函数指针映射为 Callback</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">processData</span><span class="hljs-params">(<span class="hljs-type">int</span> count, DataCallback callback)</span>;
}

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CallbackExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">DataCallback</span> <span class="hljs-variable">callback</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DataCallback</span>() {
            <span class="hljs-meta">@Override</span>
            <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">callback</span><span class="hljs-params">(<span class="hljs-type">int</span> value)</span> {
                System.out.println(<span class="hljs-string">&quot;Received: &quot;</span> + value);
            }
        };
        MyLibrary.INSTANCE.processData(<span class="hljs-number">5</span>, callback);

    }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>    // Received: 0
    // Received: 10
    // Received: 20
    // Received: 30
    // Received: 40
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="%E5%9B%9E%E8%B0%83%E6%9C%BA%E5%88%B6%E8%AF%B4%E6%98%8E">回调机制说明</h2>
<h3 id="%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86">工作原理</h3>
<ol>
<li><strong>定义 Callback 接口</strong>：继承 <code>com.sun.jna.Callback</code></li>
<li><strong>方法签名匹配</strong>：Java 回调方法签名必须与 C 函数指针签名匹配</li>
<li><strong>自动转换</strong>：JNA 自动将 Java 对象转换为函数指针</li>
<li><strong>生命周期管理</strong>：回调对象必须保持引用，否则可能被 GC 回收</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-vs-jni">JNA vs JNI</h1>
<table>
<thead>
<tr>
<th>特性</th>
<th>JNI</th>
<th>JNA</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>代码复杂度</strong></td>
<td>需要 C/C++ 代码</td>
<td>纯 Java</td>
</tr>
<tr>
<td><strong>性能</strong></td>
<td>更快（直接调用）</td>
<td>稍慢（通过反射）</td>
</tr>
<tr>
<td><strong>类型映射</strong></td>
<td>手动处理</td>
<td>自动处理</td>
</tr>
<tr>
<td><strong>平台支持</strong></td>
<td>需要为每个平台编译</td>
<td>跨平台</td>
</tr>
<tr>
<td><strong>学习曲线</strong></td>
<td>陡峭</td>
<td>平缓</td>
</tr>
<tr>
<td><strong>双向调用</strong></td>
<td>支持（本地代码回调 Java）</td>
<td>支持（通过 Callback）</td>
</tr>
<tr>
<td><strong>适用场景</strong></td>
<td>高性能、复杂交互</td>
<td>简单调用、快速开发</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="jna-%E7%9A%84%E4%BC%98%E7%BC%BA%E7%82%B9">JNA 的优缺点</h1>
<h2 id="%E4%BC%98%E7%82%B9-1">优点</h2>
<ul>
<li><strong>简单易用</strong>：纯 Java，无需 C/C++ 代码</li>
<li><strong>快速开发</strong>：几分钟就能调用 C 函数</li>
<li><strong>跨平台</strong>：自动处理平台差异</li>
<li><strong>类型安全</strong>：编译时检查</li>
</ul>
<h2 id="%E7%BC%BA%E7%82%B9-1">缺点</h2>
<ul>
<li><strong>性能开销</strong>：比 JNI 慢（反射调用）</li>
<li><strong>内存管理</strong>：复杂结构体需要手动管理</li>
<li><strong>调试困难</strong>：错误信息不够清晰</li>
<li><strong>依赖库</strong>：需要引入 JNA 依赖</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="java-unsafe">Java Unsafe</h1>
<p><code>sun.misc.Unsafe</code> 是 Java 提供的一个<strong>内部 API</strong>，提供了直接操作内存的能力。</p>
<h2 id="%E7%89%B9%E7%82%B9-1">特点</h2>
<ul>
<li><strong>底层操作</strong>：直接操作内存、CAS、对象实例化</li>
<li><strong>不受限制</strong>：绕过 Java 的安全检查</li>
<li><strong>高风险</strong>：可能导致 JVM 崩溃</li>
<li><strong>内部 API</strong>：不保证向后兼容</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="%E8%8E%B7%E5%8F%96-unsafe-%E5%AE%9E%E4%BE%8B">获取 Unsafe 实例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> sun.misc.Unsafe;
<span class="hljs-keyword">import</span> java.lang.reflect.Field;
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UnsafeExample</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> Unsafe <span class="hljs-title function_">getUnsafe</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">try</span> {
            <span class="hljs-type">Field</span> <span class="hljs-variable">field</span> <span class="hljs-operator">=</span> Unsafe.class.getDeclaredField(<span class="hljs-string">&quot;theUnsafe&quot;</span>);
            field.setAccessible(<span class="hljs-literal">true</span>);
            <span class="hljs-keyword">return</span> (Unsafe) field.get(<span class="hljs-literal">null</span>);
        } <span class="hljs-keyword">catch</span> (Exception e) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RuntimeException</span>(e);
        }
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();
        <span class="hljs-comment">// 使用 unsafe...</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafe%E7%9B%B4%E6%8E%A5%E5%86%85%E5%AD%98%E6%93%8D%E4%BD%9C">Unsafe：直接内存操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();

<span class="hljs-comment">// 分配内存（字节）</span>
<span class="hljs-type">long</span> <span class="hljs-variable">address</span> <span class="hljs-operator">=</span> unsafe.allocateMemory(<span class="hljs-number">1024</span>);

<span class="hljs-comment">// 设置内存值</span>
unsafe.putInt(address, <span class="hljs-number">42</span>);
unsafe.putLong(address + <span class="hljs-number">4</span>, <span class="hljs-number">100L</span>);

<span class="hljs-comment">// 读取内存值</span>
<span class="hljs-type">int</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> unsafe.getInt(address);
<span class="hljs-type">long</span> <span class="hljs-variable">longValue</span> <span class="hljs-operator">=</span> unsafe.getLong(address + <span class="hljs-number">4</span>);

<span class="hljs-comment">// 释放内存</span>
unsafe.freeMemory(address);
</code></pre>
<p><strong>注意</strong>：直接内存操作非常危险，可能导致内存泄漏或 JVM 崩溃！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafecas-%E6%93%8D%E4%BD%9C">Unsafe：CAS 操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CASExample</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span> valueOffset;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">volatile</span> <span class="hljs-type">int</span> value;
    
    <span class="hljs-keyword">static</span> {
        <span class="hljs-keyword">try</span> {
            valueOffset = unsafe.objectFieldOffset(
                CASExample.class.getDeclaredField(<span class="hljs-string">&quot;value&quot;</span>));
        } <span class="hljs-keyword">catch</span> (Exception e) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(e);
        }
    }
    
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">compareAndSet</span><span class="hljs-params">(<span class="hljs-type">int</span> expect, <span class="hljs-type">int</span> update)</span> {
        <span class="hljs-keyword">return</span> unsafe.compareAndSwapInt(<span class="hljs-built_in">this</span>, valueOffset, expect, update);
    }
}
</code></pre>
<p><code>AtomicInteger</code> 等类内部使用 Unsafe 实现。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafe%E5%AF%B9%E8%B1%A1%E6%93%8D%E4%BD%9C">Unsafe：对象操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();

<span class="hljs-comment">// 不调用构造函数创建对象</span>
<span class="hljs-type">MyClass</span> <span class="hljs-variable">obj</span> <span class="hljs-operator">=</span> (MyClass) unsafe.allocateInstance(MyClass.class);

<span class="hljs-comment">// 获取对象字段偏移量</span>
<span class="hljs-type">long</span> <span class="hljs-variable">offset</span> <span class="hljs-operator">=</span> unsafe.objectFieldOffset(MyClass.class.getDeclaredField(<span class="hljs-string">&quot;field&quot;</span>));

<span class="hljs-comment">// 直接设置字段值（绕过访问控制）</span>
unsafe.putObject(obj, offset, <span class="hljs-string">&quot;value&quot;</span>);

<span class="hljs-comment">// 直接读取字段值</span>
<span class="hljs-type">Object</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> unsafe.getObject(obj, offset);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafe%E6%95%B0%E7%BB%84%E6%93%8D%E4%BD%9C">Unsafe：数组操作</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();

<span class="hljs-type">int</span>[] array = <span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[<span class="hljs-number">10</span>];

<span class="hljs-comment">// 获取数组第一个元素的偏移量</span>
<span class="hljs-type">int</span> <span class="hljs-variable">baseOffset</span> <span class="hljs-operator">=</span> unsafe.arrayBaseOffset(<span class="hljs-type">int</span>[].class);
<span class="hljs-comment">// 获取数组中每个元素的大小</span>
<span class="hljs-type">int</span> <span class="hljs-variable">indexScale</span> <span class="hljs-operator">=</span> unsafe.arrayIndexScale(<span class="hljs-type">int</span>[].class);

<span class="hljs-comment">// 直接设置数组元素（绕过边界检查）</span>
unsafe.putInt(array, baseOffset + <span class="hljs-number">5</span> * indexScale, <span class="hljs-number">42</span>);

<span class="hljs-comment">// 直接读取数组元素</span>
<span class="hljs-type">int</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> unsafe.getInt(array, baseOffset + <span class="hljs-number">5</span> * indexScale);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafe-%E7%9A%84%E5%BA%94%E7%94%A8%E5%9C%BA%E6%99%AF">Unsafe 的应用场景</h1>
<h2 id="1-%E9%AB%98%E6%80%A7%E8%83%BD%E5%BA%93">1. 高性能库</h2>
<ul>
<li><strong>Netty</strong>：直接内存管理（DirectByteBuffer）</li>
<li><strong>Disruptor</strong>：无锁队列</li>
<li><strong>Kryo</strong>：序列化框架</li>
</ul>
<h2 id="2-%E5%B9%B6%E5%8F%91%E5%B7%A5%E5%85%B7">2. 并发工具</h2>
<ul>
<li><strong>AtomicInteger/Long</strong>：CAS 操作</li>
<li><strong>LockSupport</strong>：线程阻塞/唤醒</li>
</ul>
<h2 id="3-%E5%8F%8D%E5%B0%84%E5%A2%9E%E5%BC%BA">3. 反射增强</h2>
<ul>
<li>绕过访问控制</li>
<li>不调用构造函数创建对象</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="unsafe-%E7%9A%84%E9%A3%8E%E9%99%A9">Unsafe 的风险</h1>
<ol>
<li><strong>内存泄漏</strong>：手动分配的内存必须手动释放</li>
<li><strong>JVM 崩溃</strong>：错误的地址操作可能导致 JVM 崩溃</li>
<li><strong>安全绕过</strong>：绕过 Java 的安全检查</li>
<li><strong>平台相关</strong>：不同平台行为可能不同</li>
<li><strong>版本兼容</strong>：内部 API，不保证向后兼容</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="%E5%AE%9E%E9%99%85%E5%BA%94%E7%94%A8netty-%E7%9A%84-directbytebuffer">实际应用：Netty 的 DirectByteBuffer</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Netty 使用 Unsafe 优化直接内存分配</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DirectByteBuffer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> ByteBuffer <span class="hljs-title function_">allocateDirect</span><span class="hljs-params">(<span class="hljs-type">int</span> capacity)</span> {
        <span class="hljs-comment">// 使用 Unsafe 分配直接内存</span>
        <span class="hljs-type">long</span> <span class="hljs-variable">address</span> <span class="hljs-operator">=</span> unsafe.allocateMemory(capacity);
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DirectByteBuffer</span>(address, capacity);
    }
    <span class="hljs-comment">// 直接内存访问，避免 JVM 堆内存拷贝</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">byte</span> <span class="hljs-title function_">get</span><span class="hljs-params">(<span class="hljs-type">int</span> index)</span> {
        <span class="hljs-keyword">return</span> unsafe.getByte(address + index);
    }
}
</code></pre>
<p>减少 JVM 堆内存与操作系统内存之间的拷贝，提高 I/O 性能。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="%E5%AE%9E%E9%99%85%E5%BA%94%E7%94%A8disruptor-%E6%97%A0%E9%94%81%E9%98%9F%E5%88%97">实际应用：Disruptor 无锁队列</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RingBuffer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span>[] buffer;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">volatile</span> <span class="hljs-type">long</span> <span class="hljs-variable">cursor</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">tryPublish</span><span class="hljs-params">(<span class="hljs-type">long</span> sequence)</span> {
        <span class="hljs-type">long</span> <span class="hljs-variable">current</span> <span class="hljs-operator">=</span> cursor;
        <span class="hljs-comment">// CAS 更新，无需加锁</span>
        <span class="hljs-keyword">return</span> unsafe.compareAndSwapLong(<span class="hljs-built_in">this</span>, cursorOffset, current, sequence);
    }
}
</code></pre>
<p>无锁设计，高并发场景下性能优于传统锁机制。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h1 id="%E5%AE%9E%E9%99%85%E5%BA%94%E7%94%A8mapdb-%E7%9A%84%E5%A0%86%E5%A4%96%E5%86%85%E5%AD%98">实际应用：MapDB 的堆外内存</h1>
<p>MapDB 是一个高性能的嵌入式 Java 数据库引擎，提供基于磁盘或堆外存储的并发集合。<a href="https://mapdb.org/">https://mapdb.org/</a></p>
<h2 id="mapdb-%E7%AE%80%E4%BB%8B">MapDB 简介</h2>
<ul>
<li><strong>嵌入式数据库</strong>：无需单独的数据库服务器</li>
<li><strong>多种存储模式</strong>：堆内存、堆外内存、文件存储</li>
<li><strong>高性能</strong>：通过堆外内存避免 GC 压力</li>
<li><strong>事务支持</strong>：ACID 事务、MVCC 隔离</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E4%BD%BF%E7%94%A8%E7%A4%BA%E4%BE%8B">MapDB 使用示例</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.mapdb.*;

<span class="hljs-comment">// 创建基于堆外内存的数据库</span>
<span class="hljs-type">DB</span> <span class="hljs-variable">db</span> <span class="hljs-operator">=</span> DBMaker
    .memoryDirectDB()  <span class="hljs-comment">// 使用 DirectByteBuffer（间接使用 Unsafe）</span>
    .transactionEnable()
    .make();

<span class="hljs-comment">// 创建 Map</span>
HTreeMap&lt;String, String&gt; map = db
    .hashMap(<span class="hljs-string">&quot;myMap&quot;</span>)
    .createOrOpen();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="47" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E4%BD%BF%E7%94%A8%E7%A4%BA%E4%BE%8B-1">MapDB 使用示例</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 操作数据</span>
map.put(<span class="hljs-string">&quot;key1&quot;</span>, <span class="hljs-string">&quot;value1&quot;</span>);
map.put(<span class="hljs-string">&quot;key2&quot;</span>, <span class="hljs-string">&quot;value2&quot;</span>);

<span class="hljs-comment">// 提交事务</span>
db.commit();

<span class="hljs-comment">// 关闭数据库</span>
db.close();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="48" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E7%9A%84%E5%AD%98%E5%82%A8%E6%9E%B6%E6%9E%84">MapDB 的存储架构</h2>
<p>当调用 <code>map.put(&quot;key&quot;, &quot;value&quot;)</code> 时，数据是如何存储的？</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>HTreeMap.put(&quot;key&quot;, &quot;value&quot;)
  ↓
MapDB 内部序列化（key + value）
  ↓
MemoryStore（内存存储层）
  ↓
DirectByteBuffer（堆外内存）
  ↓
Unsafe（底层内存操作）
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="49" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E8%AF%A6%E7%BB%86%E6%B5%81%E7%A8%8B">详细流程</h3>
<ol>
<li><strong>HTreeMap.put()</strong>：用户调用 <code>map.put(&quot;key&quot;, &quot;value&quot;)</code></li>
<li><strong>序列化</strong>：MapDB 将 key 和 value 序列化为字节数组</li>
<li><strong>MemoryStore</strong>：MapDB 的 <code>MemoryStore</code> 负责管理存储
<ul>
<li>使用 <code>DirectByteBuffer</code> 作为底层存储</li>
<li>维护索引结构（哈希表、B+树等）</li>
</ul>
</li>
<li><strong>DirectByteBuffer</strong>：数据写入堆外内存
<ul>
<li>通过 <code>DirectByteBuffer.put()</code> 写入字节</li>
<li>内部使用 Unsafe 直接操作内存</li>
</ul>
</li>
<li><strong>持久化</strong>（可选）：如果使用文件存储，数据会同步到磁盘</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="50" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E4%BB%A3%E7%A0%81%E7%A4%BA%E4%BE%8B%E7%AE%80%E5%8C%96%E7%89%88">代码示例（简化版）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// MapDB 内部实现（简化版）</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HTreeMap</span>&lt;K, V&gt; {
    <span class="hljs-keyword">private</span> MemoryStore store;  <span class="hljs-comment">// 存储层</span>
    
    <span class="hljs-keyword">public</span> V <span class="hljs-title function_">put</span><span class="hljs-params">(K key, V value)</span> {
        <span class="hljs-comment">// 1. 序列化</span>
        <span class="hljs-type">byte</span>[] keyBytes = serializer.serialize(key);
        <span class="hljs-type">byte</span>[] valueBytes = serializer.serialize(value);
        
        <span class="hljs-comment">// 2. 写入 MemoryStore（底层使用 DirectByteBuffer）</span>
        <span class="hljs-type">long</span> <span class="hljs-variable">address</span> <span class="hljs-operator">=</span> store.allocate(keyBytes.length + valueBytes.length);
        <span class="hljs-type">DirectByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> store.getBuffer(address);
        buffer.put(keyBytes);
        buffer.put(valueBytes);
        
        <span class="hljs-comment">// 3. 更新索引</span>
        index.put(key, address);
        
        <span class="hljs-keyword">return</span> value;
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E4%BB%A3%E7%A0%81%E7%A4%BA%E4%BE%8B%E7%AE%80%E5%8C%96%E7%89%88-1">代码示例（简化版）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// MemoryStore 内部使用 DirectByteBuffer</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MemoryStore</span> {
    <span class="hljs-keyword">private</span> DirectByteBuffer buffer;  <span class="hljs-comment">// 堆外内存缓冲区</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">allocate</span><span class="hljs-params">(<span class="hljs-type">int</span> size)</span> {
        <span class="hljs-comment">// 在 DirectByteBuffer 中分配空间</span>
        <span class="hljs-type">long</span> <span class="hljs-variable">address</span> <span class="hljs-operator">=</span> currentOffset;
        currentOffset += size;
        <span class="hljs-keyword">return</span> address;
    }
    <span class="hljs-keyword">public</span> DirectByteBuffer <span class="hljs-title function_">getBuffer</span><span class="hljs-params">(<span class="hljs-type">long</span> address)</span> {
        <span class="hljs-comment">// 返回 DirectByteBuffer（内部使用 Unsafe）</span>
        <span class="hljs-keyword">return</span> buffer;
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="52" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E5%85%B3%E9%94%AE%E7%82%B9">关键点</h3>
<ul>
<li><strong>HTreeMap</strong> 是 MapDB 提供的集合接口（类似 HashMap）</li>
<li><strong>MemoryStore</strong> 是 MapDB 的存储抽象层</li>
<li><strong>DirectByteBuffer</strong> 是实际的存储介质（堆外内存）</li>
<li><strong>Unsafe</strong> 是 DirectByteBuffer 的底层实现</li>
</ul>
<p><strong>数据流向</strong>：<code>HTreeMap.put()</code> → 序列化 → <code>MemoryStore</code> → <code>DirectByteBuffer</code> → <code>Unsafe</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E4%B8%8E-unsafe%E9%97%B4%E6%8E%A5%E4%BD%BF%E7%94%A8">MapDB 与 Unsafe：间接使用</h2>
<p>MapDB <strong>不直接使用 Unsafe</strong>，但通过 <code>DirectByteBuffer</code> <strong>间接使用 Unsafe</strong> 来实现堆外内存存储。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">DB</span> <span class="hljs-variable">db</span> <span class="hljs-operator">=</span> DBMaker
    .memoryDirectDB()  <span class="hljs-comment">// 使用堆外内存</span>
    .make();
HTreeMap&lt;String, String&gt; map = db.hashMap(<span class="hljs-string">&quot;map&quot;</span>).createOrOpen();
map.put(<span class="hljs-string">&quot;key&quot;</span>, <span class="hljs-string">&quot;value&quot;</span>);
</code></pre>
<ul>
<li><strong>避免 GC</strong>：数据存储在堆外，不受 GC 影响</li>
<li><strong>大内存支持</strong>：可以存储超过堆内存限制的数据</li>
<li><strong>性能提升</strong>：减少内存拷贝，提高 I/O 性能</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="directbytebuffer-%E4%B8%8E-unsafe">DirectByteBuffer 与 Unsafe</h2>
<p>MapDB 的堆外内存功能依赖于 <code>DirectByteBuffer</code>，而 <code>DirectByteBuffer</code> 内部使用 Unsafe：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DirectByteBuffer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">MappedByteBuffer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Unsafe</span> <span class="hljs-variable">unsafe</span> <span class="hljs-operator">=</span> getUnsafe();
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">long</span> address;  <span class="hljs-comment">// 堆外内存地址</span>
    DirectByteBuffer(<span class="hljs-type">int</span> cap) {
        address = unsafe.allocateMemory(cap);
        <span class="hljs-comment">// ...</span>
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">byte</span> <span class="hljs-title function_">get</span><span class="hljs-params">(<span class="hljs-type">int</span> i)</span> {
        <span class="hljs-keyword">return</span> unsafe.getByte(address + i);
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">put</span><span class="hljs-params">(<span class="hljs-type">int</span> i, <span class="hljs-type">byte</span> b)</span> {
        unsafe.putByte(address + i, b);
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E4%B8%8E%E5%86%85%E5%AD%98%E6%98%A0%E5%B0%84memory-mapping">MapDB 与内存映射（Memory Mapping）</h2>
<p>MapDB <strong>支持内存映射技术</strong>，通过 <code>MappedByteBuffer</code> 将文件映射到内存，实现高性能的磁盘 I/O。</p>
<p><strong>工作原理</strong>：</p>
<ul>
<li>使用 <code>mmap</code> 系统调用将文件映射到虚拟内存</li>
<li>读写操作直接操作内存，由操作系统负责同步到磁盘</li>
<li>避免用户态和内核态之间的数据拷贝</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="56" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h3 id="%E5%86%85%E5%AD%98%E6%98%A0%E5%B0%84%E7%9A%84%E5%B7%A5%E4%BD%9C%E5%8E%9F%E7%90%86">内存映射的工作原理</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// MappedByteBuffer 内部使用 mmap 系统调用</span>
<span class="hljs-type">FileChannel</span> <span class="hljs-variable">channel</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RandomAccessFile</span>(<span class="hljs-string">&quot;data.db&quot;</span>, <span class="hljs-string">&quot;rw&quot;</span>).getChannel();
<span class="hljs-type">MappedByteBuffer</span> <span class="hljs-variable">buffer</span> <span class="hljs-operator">=</span> channel.map(
    FileChannel.MapMode.READ_WRITE,  <span class="hljs-comment">// 读写模式</span>
    <span class="hljs-number">0</span>,                                 <span class="hljs-comment">// 起始位置</span>
    <span class="hljs-number">1024</span> * <span class="hljs-number">1024</span>                        <span class="hljs-comment">// 映射大小（1MB）</span>
);

<span class="hljs-comment">// 直接操作内存，操作系统自动同步到磁盘</span>
buffer.put(<span class="hljs-number">0</span>, (<span class="hljs-type">byte</span>) <span class="hljs-number">42</span>);
<span class="hljs-type">byte</span> <span class="hljs-variable">value</span> <span class="hljs-operator">=</span> buffer.get(<span class="hljs-number">0</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="57" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-%E5%90%AF%E7%94%A8%E5%86%85%E5%AD%98%E6%98%A0%E5%B0%84-%E6%80%A7%E8%83%BD%E5%8F%AF%E6%8F%90%E5%8D%87%E6%95%B0%E5%8D%81%E5%80%8D">MapDB 启用内存映射 （性能可提升数十倍）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.mapdb.*;

<span class="hljs-comment">// 基于文件的数据库，启用内存映射</span>
<span class="hljs-type">DB</span> <span class="hljs-variable">db</span> <span class="hljs-operator">=</span> DBMaker
    .fileDB(<span class="hljs-string">&quot;data.db&quot;</span>)
    .fileMmapEnableIfSupported()  <span class="hljs-comment">// 启用内存映射（如果支持）</span>
    .fileMmapPreclearDisable()     <span class="hljs-comment">// 禁用预清除，提高写入性能</span>
    .transactionEnable()
    .make();
HTreeMap&lt;String, String&gt; map = db.hashMap(<span class="hljs-string">&quot;myMap&quot;</span>).createOrOpen();

map.put(<span class="hljs-string">&quot;key&quot;</span>, <span class="hljs-string">&quot;value&quot;</span>);
db.commit();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="58" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mappedbytebuffer-%E4%B8%8E-unsafe">MappedByteBuffer 与 Unsafe</h2>
<p><code>MappedByteBuffer</code> 继承自 <code>DirectByteBuffer</code>，也使用 Unsafe 进行内存操作：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// MappedByteBuffer 继承关系</span>
MappedByteBuffer <span class="hljs-keyword">extends</span> <span class="hljs-title class_">DirectByteBuffer</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">ByteBuffer</span>

<span class="hljs-comment">// 内部使用 Unsafe 访问映射的内存</span>

<h2 id="mapdb-%E7%9A%84%E5%AD%98%E5%82%A8%E6%A8%A1%E5%BC%8F%E5%AF%B9%E6%AF%94">MapDB 的存储模式对比</h2>
<table>
<thead>
<tr>
<th>存储模式</th>
<th>技术</th>
<th>特点</th>
<th>适用场景</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>堆内存</strong></td>
<td>普通 Java 对象</td>
<td>受 GC 影响，速度快</td>
<td>小数据，临时数据</td>
</tr>
<tr>
<td><strong>堆外内存</strong></td>
<td>DirectByteBuffer</td>
<td>不受 GC 影响，速度快</td>
<td>大数据，需要避免 GC</td>
</tr>
<tr>
<td><strong>文件 + 内存映射</strong></td>
<td>MappedByteBuffer</td>
<td>持久化，高性能 I/O</td>
<td>需要持久化的大数据</td>
</tr>
<tr>
<td><strong>文件（传统）</strong></td>
<td>FileChannel</td>
<td>持久化，性能一般</td>
<td>小数据，简单持久化</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="60" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb-vs-%E4%BC%A0%E7%BB%9F%E9%9B%86%E5%90%88">MapDB vs 传统集合</h2>
<table>
<thead>
<tr>
<th>特性</th>
<th>HashMap (堆内存)</th>
<th>MapDB (堆外内存)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>GC 影响</strong></td>
<td>受 GC 影响，可能停顿</td>
<td>不受 GC 影响</td>
</tr>
<tr>
<td><strong>内存限制</strong></td>
<td>受堆内存限制</td>
<td>可超过堆内存限制</td>
</tr>
<tr>
<td><strong>持久化</strong></td>
<td>不支持</td>
<td>支持（可选）</td>
</tr>
<tr>
<td><strong>性能</strong></td>
<td>快（小数据）</td>
<td>快（大数据，无 GC）</td>
</tr>
<tr>
<td><strong>底层技术</strong></td>
<td>普通 Java 对象</td>
<td>DirectByteBuffer → Unsafe</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="61" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62">
<h2 id="mapdb%E5%85%B3%E9%94%AE%E6%8A%80%E6%9C%AF">MapDB关键技术</h2>
<ul>
<li>MapDB <strong>支持两种高性能模式</strong>：堆外内存和内存映射</li>
<li>两种模式都<strong>间接使用 Unsafe</strong>（通过 DirectByteBuffer/MappedByteBuffer）</li>
<li>内存映射模式<strong>额外使用 mmap 系统调用</strong>实现文件映射</li>
<li>MapDB <strong>不使用 JNI/JNA</strong>（纯 Java + 标准库）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="62" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/happy.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="62" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="62" data-marpit-advanced-background="content"></section>
