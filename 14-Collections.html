</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="1" style="--paginate:true;--background-color:#fff;--class:lead;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="54" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/Java_logo.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="1" data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="1" style="--paginate:true;--background-color:#fff;--class:lead;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="54" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="java%E9%AB%98%E7%BA%A7%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1">Java高级程序设计</h1>
<h2 id="%E9%9B%86%E5%90%88%E4%B8%8E%E6%B5%81">集合与流</h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-class="lead" data-theme="gaia" lang="C" class="lead" data-marpit-pagination="1" style="" data-marpit-pagination-total="54" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collections">Collections</h1>
<p>A collection — sometimes called a container — is simply an object that groups multiple elements into a single unit.</p>
<p>Collections are used to store, retrieve, manipulate, and communicate aggregate data.</p>
<p><small><a href="https://docs.oracle.com/javase/tutorial/collections/index.html">https://docs.oracle.com/javase/tutorial/collections/index.html</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="arrays-vs-collections">Arrays  vs. Collections</h1>
<table>
<thead>
<tr>
<th>Arrays</th>
<th>Collection</th>
</tr>
</thead>
<tbody>
<tr>
<td>Fixed in size</td>
<td>Growable in nature</td>
</tr>
<tr>
<td>With respect to memory, not recommended to use.</td>
<td>With respect to memory, recommended to use.</td>
</tr>
<tr>
<td>With respect to performance, recommended to use.</td>
<td>With respect to performance, not recommended to use.</td>
</tr>
<tr>
<td>Hold only homogeneous data types elements (hold both object and primitive)</td>
<td>Hold both homogeneous and heterogeneous elements (only object types but primitive)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collections-framework">Collections Framework</h1>
<p>A collections framework, for example C++ Standard Template Library (STL), is a unified architecture for representing and manipulating collections. All collections frameworks contain the following:</p>
<ul>
<li><b>Interfaces:</b> These are abstract data types that represent collections.</li>
<li><b>Implementations:</b>  These are the concrete implementations of the collection interfaces.</li>
<li><b>Algorithms:</b>  These are the methods that perform useful computations, such as searching and sorting.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="interfaces">Interfaces</h1>
<p>The core collection interfaces encapsulate different types of collections. These interfaces allow collections to be manipulated independently of the details of their representation. Core collection interfaces form a hierarchy.</p>
<p><img src="images/14/colls-coreInterfaces.gif" alt="" style="width:700px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collection">Collection</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Collection</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Iterable</span>&lt;E&gt;
</code></pre>
<p>The root interface in the collection hierarchy. A collection represents a group of objects, known as its elements. Some collections allow duplicate elements and others do not. Some are ordered and others unordered.</p>
<p>This interface is typically used to pass collections around and manipulate them where maximum generality is desired.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Collection.html">https://docs.oracle.com/javase/8/docs/api/java/util/Collection.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="traversing-collections">Traversing Collections</h1>
<p>There are three ways to traverse collections:</p>
<ol>
<li>using aggregate operations (talk later)</li>
<li>with the for-each construct</li>
<li>by using <code>Iterators</code></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="for-each-construct"><code>for-each</code> Construct</h1>
<p>The for-each construct allows you to concisely traverse a collection or array using a for loop — see The for Statement. The following code uses the for-each construct to print out each element of a collection on a separate line.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">for</span> (Object o : collection)
    System.out.println(o);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="iterable">Iterable</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Iterable</span>&lt;T&gt;
</code></pre>
<p>Implementing this interface allows an object to be the target of the &quot;for-each loop&quot; statement</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/Iterable.html">https://docs.oracle.com/javase/8/docs/api/java/lang/Iterable.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="iterators">Iterators</h1>
<p>An Iterator is an object that enables you to traverse through a collection and to remove elements from the collection selectively, if desired. You get an Iterator for a collection by calling its iterator method. The following is the Iterator interface.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Iterator</span>&lt;E&gt; {
    <span class="hljs-type">boolean</span> <span class="hljs-title function_">hasNext</span><span class="hljs-params">()</span>;
    E <span class="hljs-title function_">next</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">remove</span><span class="hljs-params">()</span>; <span class="hljs-comment">//optional</span>
}
</code></pre>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Iterator.html">https://docs.oracle.com/javase/8/docs/api/java/util/Iterator.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="iterator-%E4%BD%BF%E7%94%A8%E7%A4%BA%E4%BE%8B">Iterator 使用示例</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; list = Arrays.asList(<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>, <span class="hljs-string">&quot;c&quot;</span>);
Iterator&lt;String&gt; it = list.iterator();
<span class="hljs-keyword">while</span> (it.hasNext()) {
    <span class="hljs-type">String</span> <span class="hljs-variable">element</span> <span class="hljs-operator">=</span> it.next();
    System.out.println(element);
}
Iterator&lt;String&gt; it2 = list.iterator();
<span class="hljs-keyword">while</span> (it2.hasNext()) {
    <span class="hljs-keyword">if</span> (it2.next().equals(<span class="hljs-string">&quot;b&quot;</span>)) {
        it2.remove();  <span class="hljs-comment">// 安全删除，不会抛出 ConcurrentModificationException</span>
    }
}
</code></pre>
<p>每次 <code>next()</code> 后只能调用一次 <code>remove()</code>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collection-interface-bulk-operations">Collection Interface Bulk Operations</h1>
<p>Bulk operations perform an operation on an entire Collection.</p>
<ul>
<li>containsAll</li>
<li>addAll</li>
<li>removeAll</li>
<li>retainAll</li>
<li>clear</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collection-interface-array-operations">Collection Interface Array Operations</h1>
<p>The toArray methods are provided as a bridge between collections and older APIs that expect arrays on input. The array operations allow the contents of a Collection to be translated into an array. The simple form with no arguments creates a new array of Object. The more complex form allows the caller to provide an array or to choose the runtime type of the output array.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">Object[] a = c.toArray();
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="the-list-interface">The List Interface</h1>
<p>A List is an ordered Collection (sometimes called a sequence). Lists may contain duplicate elements. In addition to the operations inherited from Collection, the List interface includes operations of positional access, search, iteration and range-view.</p>
<p>The Java platform contains two general-purpose List implementations. <code>ArrayList</code>, which is usually the better-performing implementation, and <code>LinkedList</code> which offers better performance under certain circumstances.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="arraylist-vs-linkedlist">ArrayList vs. LinkedList</h1>
<p><img src="images/14/array-linked.png" alt="" style="width:800px;" /></p>
<p>Performance difference?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="arraylist-vs-linkedlist-%E6%80%A7%E8%83%BD%E5%AF%B9%E6%AF%94">ArrayList vs LinkedList 性能对比</h2>
<table>
<thead>
<tr>
<th>操作</th>
<th>ArrayList</th>
<th>LinkedList</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>随机访问</strong></td>
<td>O(1) - 数组索引</td>
<td>O(n) - 需要遍历</td>
</tr>
<tr>
<td><strong>头部插入</strong></td>
<td>O(n) - 需要移动元素</td>
<td>O(1) - 修改指针</td>
</tr>
<tr>
<td><strong>尾部插入</strong></td>
<td>O(1) 平均 - 可能扩容</td>
<td>O(1) - 修改指针</td>
</tr>
<tr>
<td><strong>中间插入</strong></td>
<td>O(n) - 需要移动元素</td>
<td>O(n) - 需要定位节点</td>
</tr>
<tr>
<td><strong>删除</strong></td>
<td>O(n) - 需要移动元素</td>
<td>O(1) - 修改指针</td>
</tr>
<tr>
<td><strong>内存占用</strong></td>
<td>连续内存，空间利用率高</td>
<td>每个节点额外存储指针</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="the-set-interface">The Set Interface</h1>
<p>A Set is a Collection that cannot contain duplicate elements. It models the mathematical set abstraction. The Set interface contains only methods inherited from Collection and adds the restriction that duplicate elements are prohibited.  Two Set instances are equal if they contain the same elements.</p>
<p>The Java platform contains three general-purpose Set implementations:  <code>HashSet</code>, <code>TreeSet</code> and <code>LinkedHashSet</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="hashset"><code>HashSet</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HashSet</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractSet</span>&lt;E&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Set</span>&lt;E&gt;, Cloneable, Serializable
</code></pre>
<p><b>This class implements the Set interface, backed by a hash table (actually a <code>HashMap</code> instance).</b> It makes no guarantees as to the iteration order of the set; in particular, it does not guarantee that the order will remain constant over time.</p>
<p>This class offers constant time performance for the basic operations (add, remove, contains and size).</p>
<p><small><a href="https://docs.oracle.com/javase/8/docs/api/java/util/HashSet.html">https://docs.oracle.com/javase/8/docs/api/java/util/HashSet.html</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="treeset">TreeSet</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TreeSet</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractSet</span>&lt;E&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NavigableSet</span>&lt;E&gt;, Cloneable, Serializable
</code></pre>
<p>A <code>NavigableSet</code> implementation based on a <code>TreeMap</code>. The elements are ordered using their natural ordering, or by a <code>Comparator</code> provided at set creation time.</p>
<ul>
<li>元素自动排序（自然顺序或自定义 Comparator）</li>
<li>所有操作时间复杂度 O(log n)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">TreeSet&lt;Integer&gt; set = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TreeSet</span>&lt;&gt;();
set.add(<span class="hljs-number">3</span>); set.add(<span class="hljs-number">1</span>); set.add(<span class="hljs-number">2</span>); <span class="hljs-comment">// 遍历顺序：1, 2, 3（自动排序）</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="linkedhashset">LinkedHashSet</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LinkedHashSet</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">HashSet</span>&lt;E&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Set</span>&lt;E&gt;, Cloneable, Serializable
</code></pre>
<p>Hash table and linked list implementation of the Set interface, with predictable iteration order. This implementation maintains a doubly-linked list running through all entries, preserving insertion order.</p>
<ul>
<li>保持插入顺序，性能接近 HashSet（O(1) 基本操作）</li>
<li>适合需要顺序且去重的场景</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">LinkedHashSet&lt;String&gt; set = <span class="hljs-keyword">new</span> <span class="hljs-title class_">LinkedHashSet</span>&lt;&gt;();
set.add(<span class="hljs-string">&quot;c&quot;</span>); set.add(<span class="hljs-string">&quot;a&quot;</span>); set.add(<span class="hljs-string">&quot;b&quot;</span>); <span class="hljs-comment">// 遍历顺序：c, a, b（保持插入顺序）</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="the-map-interface">The Map Interface</h1>
<p>A Map is an object that maps keys to values. A map cannot contain duplicate keys: Each key can map to at most one value. It models the mathematical function abstraction. The Map interface includes methods for basic operations (such as put, get, remove, containsKey, containsValue, size, and empty), bulk operations (such as putAll and clear), and collection views (such as keySet, entrySet, and values).</p>
<p>The Java platform contains three general-purpose Map implementations: <code>HashMap</code>, <code>TreeMap</code>, and <code>LinkedHashMap</code>.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Map.html">https://docs.oracle.com/javase/8/docs/api/java/util/Map.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="hashmap">HashMap</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HashMap</span>&lt;K,V&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractMap</span>&lt;K,V&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Map</span>&lt;K,V&gt;, Cloneable, Serializable
</code></pre>
<p>Hash table based implementation of the Map interface. This implementation permits null values and the null key. (The HashMap class is roughly equivalent to <a href="https://docs.oracle.com/javase/8/docs/api/java/util/Hashtable.html">Hashtable</a>, except that it is unsynchronized and permits nulls.) This class makes no guarantees as to the order of the map; in particular, it does not guarantee that the order will remain constant over time.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/HashMap.html">https://docs.oracle.com/javase/8/docs/api/java/util/HashMap.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="54" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/14/hashmap-internal.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="54" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="hashmap-internal">HashMap Internal</h1>
<p>Two parameters affect its performance: initial capacity and load factor. When the number of entries in the hash table exceeds the product of the load factor and the current capacity, the hash table is rehashed.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="" data-marpit-pagination-total="54" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="jdk-8-%E7%9A%84%E4%BC%98%E5%8C%96%E9%93%BE%E8%A1%A8%E8%BD%AC%E7%BA%A2%E9%BB%91%E6%A0%91">JDK 8 的优化：链表转红黑树</h3>
<ul>
<li><strong>JDK 7</strong>：冲突时使用链表，极端情况下退化为 O(n)</li>
<li><strong>JDK 8</strong>：当链表长度 ≥ 8 且数组长度 ≥ 64 时，链表转为红黑树，保证 O(log n)</li>
<li><strong>退化</strong>：当红黑树节点数 ≤ 6 时，转回链表</li>
</ul>
<h3 id="%E5%AE%B9%E9%87%8F%E4%B8%8E%E8%B4%9F%E8%BD%BD%E5%9B%A0%E5%AD%90">容量与负载因子</h3>
<ul>
<li><strong>默认初始容量</strong>：16 ；<strong>默认负载因子</strong>：0.75</li>
<li><strong>扩容时机</strong>：<code>size &gt; capacity * loadFactor</code></li>
<li><strong>扩容操作</strong>：容量翻倍，重新计算 hash 并重新分布</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="hash-%E5%86%B2%E7%AA%81%E5%A4%84%E7%90%86">Hash 冲突处理</h3>
<ol>
<li><strong>计算 hash</strong>：<code>(h = key.hashCode()) ^ (h &gt;&gt;&gt; 16)</code>（高16位异或，减少冲突）</li>
<li><strong>定位桶</strong>：<code>(n - 1) &amp; hash</code>（n 为容量，必须是 2 的幂）</li>
<li><strong>处理冲突</strong>：链表或红黑树</li>
</ol>
<h3 id="%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8">线程安全</h3>
<ul>
<li><strong>HashMap</strong>：非线程安全，多线程环境下可能导致数据不一致</li>
<li><strong>ConcurrentHashMap</strong>：线程安全替代方案（分段锁或 CAS）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="treemap">TreeMap</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TreeMap</span>&lt;K,V&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractMap</span>&lt;K,V&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NavigableMap</span>&lt;K,V&gt;, Cloneable, Serializable
</code></pre>
<p>A Red-Black tree based NavigableMap implementation.</p>
<p>This implementation provides guaranteed log(n) time cost for the containsKey, get, put and remove operations. Algorithms are adaptations of those in Cormen, Leiserson, and Rivest's <a href="https://www.amazon.com/Introduction-Algorithms-3rd-MIT-Press/dp/0262033844">Introduction to Algorithms</a>.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/TreeMap.html">https://docs.oracle.com/javase/8/docs/api/java/util/TreeMap.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="54" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/14/treemap-internal.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="27" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="54" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="treemap-internal">TreeMap Internal</h1>
<br />

<p><img src="images/14/treemap-node.png" alt="" style="width:500px;" /></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="" data-marpit-pagination-total="54" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="%E7%BA%A2%E9%BB%91%E6%A0%91%E5%9F%BA%E7%A1%80">红黑树基础</h2>
<p>红黑树是一种自平衡二叉搜索树</p>
<p>保证最坏情况下 O(log n) 的查找、插入、删除，相比 AVL 树，旋转操作更少，插入/删除性能更好，适合需要有序且频繁更新的场景</p>
<iframe src="https://player.bilibili.com/player.html?bvid=BV1E5Y9zEETk&autoplay=0" width="960" height="540" scrolling="no" frameborder="no" allowfullscreen="true"> </iframe>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="54" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/14/lhm-internal.png&quot;);background-size:120%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="54" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="linkedhashmap">LinkedHashMap</h1>
<p>Hash table and linked list implementation of the Map interface, with predictable iteration order.</p>
<p>This implementation differs from HashMap in that it maintains a doubly-linked list running through all of its entries.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="" data-marpit-pagination-total="54" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="linkedhashmap-%E5%BA%94%E7%94%A8lru-%E7%BC%93%E5%AD%98">LinkedHashMap 应用：LRU 缓存</h2>
<p>LinkedHashMap 可以通过重写 <code>removeEldestEntry()</code> 实现 LRU（Least Recently Used）缓存：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">LRUCache</span>&lt;K, V&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">LinkedHashMap</span>&lt;K, V&gt; {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> capacity;
    
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">LRUCache</span><span class="hljs-params">(<span class="hljs-type">int</span> capacity)</span> {
        <span class="hljs-built_in">super</span>(<span class="hljs-number">16</span>, <span class="hljs-number">0.75f</span>, <span class="hljs-literal">true</span>);  <span class="hljs-comment">// accessOrder=true 表示按访问顺序排序</span>
        <span class="hljs-built_in">this</span>.capacity = capacity;
    }
    
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">removeEldestEntry</span><span class="hljs-params">(Map.Entry&lt;K, V&gt; eldest)</span> {
        <span class="hljs-keyword">return</span> size() &gt; capacity;  <span class="hljs-comment">// 超过容量时删除最久未访问的元素</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E4%BD%BF%E7%94%A8%E7%A4%BA%E4%BE%8B">使用示例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>LRUCache&lt;String, String&gt; cache = new LRUCache&lt;&gt;(3);
cache.put(&quot;1&quot;, &quot;one&quot;);
cache.put(&quot;2&quot;, &quot;two&quot;);
cache.put(&quot;3&quot;, &quot;three&quot;);
cache.get(&quot;1&quot;);  // 访问 &quot;1&quot;，使其成为最近使用的
cache.put(&quot;4&quot;, &quot;four&quot;);  // 添加 &quot;4&quot;，&quot;2&quot; 被移除（最久未访问）
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="back-to-the-set-interface">Back to The Set Interface</h1>
<p>A Set is a Collection that cannot contain duplicate elements. It models the mathematical set abstraction. The Set interface contains only methods inherited from Collection and adds the restriction that duplicate elements are prohibited.  Two Set instances are equal if they contain the same elements.</p>
<p>The Java platform contains three general-purpose Set implementations:  <code>HashSet</code>, <code>TreeSet</code> and <code>LinkedHashSet</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="the-queue-interface">The Queue Interface</h1>
<p>A collection designed for holding elements prior to processing. Besides basic Collection operations, queues provide additional insertion, extraction, and inspection operations.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Queue.html">https://docs.oracle.com/javase/8/docs/api/java/util/Queue.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="the-deque-interface">The Deque Interface</h1>
<p>A linear collection that supports element insertion and removal at both ends. The name deque is short for &quot;double ended queue&quot; and is usually pronounced &quot;deck&quot;. Most Deque implementations place no fixed limits on the number of elements they may contain, but this interface supports capacity-restricted deques as well as those with no fixed size limit.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Deque.html">https://docs.oracle.com/javase/8/docs/api/java/util/Deque.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="queue-%E5%AE%9E%E7%8E%B0%E7%B1%BB">Queue 实现类</h2>
<h3 id="priorityqueue">PriorityQueue</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PriorityQueue</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractQueue</span>&lt;E&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Serializable</span>
</code></pre>
<p>基于堆（通常是最小堆）实现的优先级队列。元素按自然顺序或Comparator排序。主要应用场景：任务调度、Top-K、Dijkstra 算法等</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">PriorityQueue&lt;Integer&gt; pq = <span class="hljs-keyword">new</span> <span class="hljs-title class_">PriorityQueue</span>&lt;&gt;();
pq.offer(<span class="hljs-number">3</span>); pq.offer(<span class="hljs-number">1</span>); pq.offer(<span class="hljs-number">2</span>);
pq.poll();  <span class="hljs-comment">// 返回 1（最小元素）</span>
pq.poll();  <span class="hljs-comment">// 返回 2</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="deque-%E5%AE%9E%E7%8E%B0%E7%B1%BB">Deque 实现类</h2>
<h3 id="arraydeque">ArrayDeque</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ArrayDeque</span>&lt;E&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AbstractCollection</span>&lt;E&gt; <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Deque</span>&lt;E&gt;, Cloneable, Serializable
</code></pre>
<p>基于循环数组实现的双端队列。比 LinkedList 更高效（无额外节点开销），比 Stack 更推荐（Stack 继承自 Vector，已过时）。（作为栈使用时比 Stack 快，作为队列使用时比 LinkedList 快）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">Deque&lt;String&gt; deque = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayDeque</span>&lt;&gt;();
deque.offerFirst(<span class="hljs-string">&quot;first&quot;</span>);   <span class="hljs-comment">// 头部插入</span>
deque.offerLast(<span class="hljs-string">&quot;last&quot;</span>);      <span class="hljs-comment">// 尾部插入</span>
deque.pollFirst();            <span class="hljs-comment">// 头部移除</span>
deque.pollLast();             <span class="hljs-comment">// 尾部移除</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="collections-%E5%B7%A5%E5%85%B7%E7%B1%BB">Collections 工具类</h1>
<p><code>java.util.Collections</code> 提供了大量静态方法操作集合：</p>
<h3 id="%E6%8E%92%E5%BA%8F%E4%B8%8E%E6%9F%A5%E6%89%BE">排序与查找</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;Integer&gt; list = Arrays.asList(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>, <span class="hljs-number">4</span>, <span class="hljs-number">1</span>, <span class="hljs-number">5</span>);
Collections.sort(list);                    <span class="hljs-comment">// [1, 1, 3, 4, 5]</span>
<span class="hljs-type">int</span> <span class="hljs-variable">index</span> <span class="hljs-operator">=</span> Collections.binarySearch(list, <span class="hljs-number">3</span>);  <span class="hljs-comment">// 2（必须先排序）</span>
Collections.reverse(list);                 <span class="hljs-comment">// [5, 4, 3, 1, 1]</span>
Collections.shuffle(list);                 <span class="hljs-comment">// 随机打乱</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E5%90%8C%E6%AD%A5%E5%8C%85%E8%A3%85">同步包装</h3>
<p>将非线程安全的集合包装成线程安全版本，通过方法级同步（<code>synchronized</code>）保证多线程访问安全。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; syncList = Collections.synchronizedList(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;());
Map&lt;String, String&gt; syncMap = Collections.synchronizedMap(<span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;());
<span class="hljs-comment">// 返回线程安全的包装器（方法级同步）</span>
</code></pre>
<p><strong>注意</strong>：多个操作的组合仍需手动同步，否则仍可能不安全。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E4%B8%8D%E5%8F%AF%E5%8F%98%E9%9B%86%E5%90%88">不可变集合</h3>
<p>创建后无法修改的集合，任何修改操作（add、remove、set）都会抛出 <code>UnsupportedOperationException</code>。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; immutable = Collections.unmodifiableList(list);
</code></pre>
<p><strong>除了保证数据不被意外修改外，为什么需要不可变集合？</strong></p>
<ul>
<li><strong>线程安全</strong>：天然线程安全，多线程环境下无需同步</li>
<li><strong>函数式编程</strong>：符合不可变性的函数式编程原则，避免副作用</li>
<li><strong>性能优化</strong>：可以安全地共享，无需防御性拷贝</li>
<li><strong>简化代码</strong>：减少对数据修改的担心，代码更简洁可靠</li>
</ul>
<p><strong>注意</strong>：<code>unmodifiableList()</code> 返回的是视图，底层集合修改会影响视图；需要真正不可变时，应复制数据后再包装。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E5%85%B6%E4%BB%96%E5%B7%A5%E5%85%B7%E6%96%B9%E6%B3%95">其他工具方法</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">Collections.max(list);           <span class="hljs-comment">// 最大值</span>
Collections.min(list);           <span class="hljs-comment">// 最小值</span>
Collections.frequency(list, <span class="hljs-number">1</span>);  <span class="hljs-comment">// 出现次数</span>
Collections.replaceAll(list, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>);  <span class="hljs-comment">// 替换所有匹配元素</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="summary-of-interfaces">Summary of Interfaces</h1>
<ul>
<li>Collection interface
<ul>
<li>The Set interface does not allow duplicate elements</li>
<li>The List interface provides for an ordered collection</li>
<li>The Queue interface enables additional insertion, extraction, and inspection operations</li>
<li>The Deque interface enables operations at both the ends</li>
</ul>
</li>
<li>Map's subinterface, SortedMap, maintains its key-value pairs in ascending order or in an order specified by a Comparator.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="back-to-traversing-collections">Back to Traversing Collections</h1>
<p>There are three ways to traverse collections:</p>
<ol>
<li>using aggregate operations (talk now)</li>
<li>with the for-each construct</li>
<li>by using <code>Iterators</code></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="aggregate-operations">Aggregate Operations</h1>
<p>In JDK 8 and later, the preferred method of iterating over a collection is to obtain a stream and perform aggregate operations on it.</p>
<p>Aggregate operations are often used in conjunction with lambda expressions to make programming more expressive.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">myShapesCollection.stream()
.filter(e -&gt; e.getColor() == Color.RED)
.forEach(e -&gt; System.out.println(e.getName()));
</code></pre>
<p><small><a href="https://docs.oracle.com/javase/8/docs/api/java/util/Collection.html#stream--">https://docs.oracle.com/javase/8/docs/api/java/util/Collection.html#stream--</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="stream">Stream</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Stream</span>&lt;T&gt; <span class="hljs-keyword">extends</span> <span class="hljs-title class_">BaseStream</span>&lt;T,Stream&lt;T&gt;&gt;
</code></pre>
<p>A sequence of elements supporting sequential and parallel aggregate operations.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html">https://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h2 id="stream-api-%E5%B8%B8%E7%94%A8%E6%93%8D%E4%BD%9C">Stream API 常用操作</h2>
<h3 id="%E4%B8%AD%E9%97%B4%E6%93%8D%E4%BD%9C%E8%BF%94%E5%9B%9E-stream">中间操作（返回 Stream）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; list = Arrays.asList(<span class="hljs-string">&quot;apple&quot;</span>, <span class="hljs-string">&quot;banana&quot;</span>, <span class="hljs-string">&quot;cherry&quot;</span>, <span class="hljs-string">&quot;date&quot;</span>);
<span class="hljs-comment">// map：转换元素</span>
list.stream().map(String::toUpperCase).forEach(System.out::println);
<span class="hljs-comment">// flatMap：扁平化</span>
List&lt;List&lt;String&gt;&gt; nested = Arrays.asList(
    Arrays.asList(<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>), Arrays.asList(<span class="hljs-string">&quot;c&quot;</span>, <span class="hljs-string">&quot;d&quot;</span>));
nested.stream().flatMap(List::stream).forEach(System.out::println);
<span class="hljs-comment">// filter：过滤</span>
list.stream().filter(s -&gt; s.length() &gt; <span class="hljs-number">5</span>).forEach(System.out::println);
<span class="hljs-comment">// distinct：去重</span>
Arrays.asList(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>).stream().distinct().forEach(System.out::println);
<span class="hljs-comment">// sorted：排序</span>
list.stream().sorted().forEach(System.out::println);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E7%BB%88%E7%AB%AF%E6%93%8D%E4%BD%9C%E8%BF%94%E5%9B%9E%E7%BB%93%E6%9E%9C">终端操作（返回结果）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// reduce：归约</span>
<span class="hljs-type">int</span> <span class="hljs-variable">sum</span> <span class="hljs-operator">=</span> Arrays.asList(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>).stream()
    .reduce(<span class="hljs-number">0</span>, Integer::sum);  <span class="hljs-comment">// 10</span>
<span class="hljs-comment">// collect：收集</span>
List&lt;String&gt; upper = list.stream()
    .map(String::toUpperCase)
    .collect(Collectors.toList());
<span class="hljs-comment">// groupingBy：分组</span>
Map&lt;Integer, List&lt;String&gt;&gt; byLength = list.stream()
    .collect(Collectors.groupingBy(String::length));
<span class="hljs-comment">// partitioningBy：分区</span>
Map&lt;Boolean, List&lt;String&gt;&gt; partitioned = list.stream()
    .collect(Collectors.partitioningBy(s -&gt; s.length() &gt; <span class="hljs-number">5</span>));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="47" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="parallel-stream">Parallel Stream</h1>
<p>Likewise, you could easily request a parallel stream, which might make sense if the collection is large enough and your computer has enough cores:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">myShapesCollection.parallelStream()
.filter(e -&gt; e.getColor() == Color.RED)
.forEach(e -&gt; System.out.println(e.getName()));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="48" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E5%B9%B6%E8%A1%8C%E6%B5%81%E9%80%82%E7%94%A8%E5%9C%BA%E6%99%AF">并行流适用场景</h3>
<ul>
<li><strong>数据量大</strong>：通常 &gt; 10,000 元素</li>
<li><strong>CPU 密集型操作</strong>：计算复杂，而非简单过滤</li>
<li><strong>多核 CPU</strong>：充分利用多核优势</li>
</ul>
<h3 id="%E6%B3%A8%E6%84%8F%E4%BA%8B%E9%A1%B9">注意事项</h3>
<ol>
<li>
<p><strong>性能开销</strong>：线程创建、任务分割、结果合并有开销</p>
<ul>
<li>小数据集可能比串行流更慢</li>
<li>使用 <code>ForkJoinPool</code> 管理线程池</li>
</ul>
</li>
<li>
<p><strong>顺序保证</strong>：并行流不保证顺序，需要顺序时使用 <code>forEachOrdered()</code></p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="49" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h3 id="%E6%B3%A8%E6%84%8F%E4%BA%8B%E9%A1%B9-1">注意事项</h3>
<ol start="3">
<li><strong>线程安全</strong>：确保操作无状态、无副作用<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 错误：共享可变状态</span>
List&lt;Integer&gt; result = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
list.parallelStream().forEach(result::add);  <span class="hljs-comment">// 线程不安全</span>

<span class="hljs-comment">// 正确：使用 collect</span>
List&lt;Integer&gt; result = list.parallelStream()
    .collect(Collectors.toList());
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="50" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="java-8-stream-api">Java 8 Stream API</h1>
<p><a href="https://www.baeldung.com/java-8-streams">https://www.baeldung.com/java-8-streams</a></p>
<p><a href="https://stackify.com/streams-guide-java-8/">https://stackify.com/streams-guide-java-8/</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="reactive-programming">Reactive Programming</h1>
<p>In computing, reactive programming is a declarative programming paradigm concerned with data streams and the propagation of change. With this paradigm, it's possible to express static (e.g., arrays) or dynamic (e.g., event emitters) data streams with ease, and also communicate that an inferred dependency within the associated execution model exists, which facilitates the automatic propagation of the changed data flow.</p>
<p><a href="https://en.wikipedia.org/wiki/Reactive_programming">https://en.wikipedia.org/wiki/Reactive_programming</a></p>
<p><a href="http://www.reactive-streams.org">http://www.reactive-streams.org</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="52" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="java-9-reactive-streams">Java 9 Reactive Streams</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Flow</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Object</span>
</code></pre>
<p>Interrelated interfaces and static methods for establishing flow-controlled components in which Publishers produce items consumed by one or more Subscribers, each managed by a Subscription.<br />
These interfaces correspond to the reactive-streams specification. Communication relies on a simple form of flow control that can be used to avoid resource management problems that may otherwise occur in &quot;push&quot; based systems.</p>
<p><small><a href="https://docs.oracle.com/javase/9/docs/api/java/util/concurrent/Flow.html">https://docs.oracle.com/javase/9/docs/api/java/util/concurrent/Flow.html</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="54">
<h1 id="java-9-reactive-streams-tutorial">Java 9 Reactive Streams Tutorial</h1>
<p><a href="https://www.baeldung.com/java-9-reactive-streams">https://www.baeldung.com/java-9-reactive-streams</a></p>
</section>
