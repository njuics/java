<h1 id="%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86-1">异常处理</h1>
<p>异常处理（Exception handling）是指在进行运算时，出现例外的情况（需要特殊处理的非常规或例外的情况）对应的处理，这种情况经常会破坏程序正常的流程。</p>
<p>它通常由特殊的编程语言结构、计算机硬件机制（如：中断或者如信号等操作系统IPC设施）所构成的。具体实现由硬件和软件自身定义而决定。一些异常，尤其是硬件，将会在被中断后进行恢复。<br />
<br /></p>
<div style="text-align:right;">--wikipedia</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90">看个例子</h1>

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-keyword">return</span> a / b;

        System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(<span class="hljs-number">1</span>, <span class="hljs-number">2</span>));
    }
    
}

</section>

<h1 id="%E7%9C%8B%E4%B8%AA%E4%BE%8B%E5%AD%90-1">看个例子</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {

<h1 id="arithmeticexception">ArithmeticException</h1>
<p><code>public class ArithmeticException extends RuntimeException</code></p>
<p>Thrown when an exceptional arithmetic condition has occurred. For example, an integer &quot;divide by zero&quot; throws an instance of this class.</p>
<p>Since: JDK1.0</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/ArithmeticException.html">https://docs.oracle.com/javase/8/docs/api/java/lang/ArithmeticException.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%BC%82%E5%B8%B8%E5%AF%BC%E8%87%B4%E5%A4%B1%E5%8E%BB%E6%8E%A7%E5%88%B6">异常导致失去控制</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-type">int</span> <span class="hljs-variable">c</span> <span class="hljs-operator">=</span> a / b;
        <span class="hljs-keyword">return</span> c;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(<span class="hljs-number">1</span>, <span class="hljs-number">0</span>));

<h1 id="c">C</h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86-2">异常处理</h1>
<p>C以及其他早期语言常常具有多种错误处理模式，这些模式往往建立在约定俗成的基础之上，而并不属于语言的一部分。通常会返回某个特殊值或者设置某个标志，并且假定接收者将对这个返回值或标志进行检查，以判定是否发生了错误。</p>
<p>如果的确在每次调用方法的时候都彻底地进行错误检查，代码很可能会变得难以阅读。正是由于程序员还仍然用这些方式拼凑系统，所以他们拒绝承认这样一个事实：对于构造大型、健壮、可维护的程序而言，这种错误处理模式已经成为了主要障碍。</p>
<div style="text-align:right;">-- 「On Java 8」</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h3 id="c-%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86">C++ 异常处理</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;iostream&gt;</span></span>
<span class="hljs-keyword">using</span> <span class="hljs-keyword">namespace</span> std;

<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span>
</span>{
   <span class="hljs-type">int</span> x = <span class="hljs-number">-1</span>;
   <span class="hljs-keyword">try</span> {
      <span class="hljs-keyword">if</span> (x &lt; <span class="hljs-number">0</span>) {
         <span class="hljs-keyword">throw</span> x;
      }
   }
   <span class="hljs-keyword">catch</span> (<span class="hljs-type">int</span> x ) {
      cout &lt;&lt; <span class="hljs-string">&quot;Exception Caught \n&quot;</span>;
   }
   <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="java-%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86">Java 异常处理</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-keyword">try</span>{
            <span class="hljs-keyword">return</span> a / b;
        }<span class="hljs-keyword">catch</span>(Exception e){
            System.out.println(<span class="hljs-string">&quot;exception!&quot;</span>);
            <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>; <span class="hljs-comment">//这不合适，先将就一下</span>
        }
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(<span class="hljs-number">1</span>, <span class="hljs-number">0</span>));
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E8%BF%90%E8%A1%8C">运行</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">❯ java Calculator
exception!
0
</code></pre>
<p>程序运行完了！执行流程是符合预期的！</p>
<p>但<code>return 0</code>是不合理的... 为什么？</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E4%BB%8E%E5%AD%97%E8%8A%82%E7%A0%81%E5%B1%82%E9%9D%A2%E7%9C%8B">从字节码层面看</h1>
<p><code>javap -v -p -s -sysinfo -constants Calculator</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  public int div(int, int);
    Code:

<h1 id="%E5%BC%82%E5%B8%B8%E7%9A%84%E8%AF%AD%E4%B9%89">异常的语义</h1>
<p>“异常”这个词有“我对此感到意外”的意思。问题出现了，你也许不清楚该如何处理，但你的确知道不应该置之不理，你要停下来，看看是不是有别人或在别的地方，能够处理这个问题。只是在当前的环境中还没有足够的信息来解决这个问题，所以就把这个问题提交到一个更高级别的环境中，在那里将作出正确的决定。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-keyword">return</span> a / b;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-keyword">try</span>{
            System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(<span class="hljs-number">1</span>, <span class="hljs-number">0</span>));
        }<span class="hljs-keyword">catch</span>(Exception e){
            System.out.println(<span class="hljs-string">&quot;exception!&quot;</span>);
        }
    }
}

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%86%8D%E6%94%B9%E4%B8%80%E4%B8%8B">再改一下</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-keyword">return</span> a / b;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-keyword">try</span> {
            System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(Integer.parseInt(args[<span class="hljs-number">0</span>]), Integer.parseInt(args[<span class="hljs-number">1</span>])));

<p>在<code>main()</code>方法中<code>try...catch...</code>意味着此处定义了异常处理语义。</p>
</section>

</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="" data-marpit-pagination-total="60" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="throwable">Throwable</h1>
<p><code>public class Throwable extends Object implements Serializable</code></p>
<p>The Throwable class is the superclass of all <strong>errors</strong> and <strong>exceptions</strong> in the Java language.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/Throwable.html">https://docs.oracle.com/javase/8/docs/api/java/lang/Throwable.html</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="error">Error</h1>
<p>An <code>Error</code> is a subclass of <code>Throwable</code> that <strong>indicates serious problems that a reasonable application should not try to catch</strong>.</p>
<p><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/Error.html">https://docs.oracle.com/javase/8/docs/api/java/lang/Error.html</a></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">print</span><span class="hljs-params">(String myString)</span> {
    print(myString);
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">Exception <span class="hljs-keyword">in</span> thread <span class="hljs-string">&quot;main&quot;</span> java.lang.StackOverflowError
at StackOverflowErrorExample.<span class="hljs-built_in">print</span>(StackOverflowErrorExample.java:6)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="exception">Exception</h1>
<p>The class <code>Exception</code> and its subclasses are a form of <code>Throwable</code> that <strong>indicates conditions that a reasonable application might want to catch</strong>.</p>
<p>The class <code>Exception</code> and any subclasses that are not also subclasses of <code>RuntimeException</code> are checked exceptions. <strong>Checked exceptions need to be declared in a method or constructor's throws clause if they can be thrown by the execution of the method or constructor and propagate outside the method or constructor boundary</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="runtimeexception">RuntimeException</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span>(t == <span class="hljs-literal">null</span>)
    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">NullPointerException</span>();
</code></pre>
<p>如果必须对传递给方法的每个引用都检查其是否为<code>null</code>（因为无法确定调用者是否传入了非法引用），这听起来着实吓人。幸运的是，这不必由你亲自来做，它属于 Java 的标准运行时检测的一部分。如果对<code>null</code>引用进行调用，Java 会自动抛出<code>NullPointerException</code>异常，所以上述代码是多余的，尽管你也许想要执行其他的检查以确保<code>NullPointerException</code>不会出现。</p>
<p><small><a href="https://docs.oracle.com/javase/8/docs/api/java/lang/RuntimeException.html">https://docs.oracle.com/javase/8/docs/api/java/lang/RuntimeException.html</a></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%A6%82%E4%BD%95%E9%81%BF%E5%85%8D-nullpointerexception">如何避免 NullPointerException？</h1>
<p>Java 提供了多种机制来避免或更好地处理空指针异常：</p>
<ol>
<li><strong>Optional<T></strong> (Java 8+) - 优雅地处理可能为空的值</li>
<li><strong>Helpful NPE Messages</strong> (Java 14+) - 精确的错误信息</li>
<li><strong>Objects.requireNonNull()</strong> (Java 7+) - 参数校验</li>
<li><strong>@NonNull / @Nullable</strong> 注解 - 编译期检查</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="optionalt-java-8">Optional<T> (Java 8+)</h1>
<p><code>Optional</code> 是一个容器对象，明确表示一个值可能存在或不存在。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 传统方式 - 容易出现 NPE</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">getUserName</span><span class="hljs-params">(User user)</span> {
    <span class="hljs-keyword">if</span> (user != <span class="hljs-literal">null</span> &amp;&amp; user.getName() != <span class="hljs-literal">null</span>) 
        <span class="hljs-keyword">return</span> user.getName();
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Unknown&quot;</span>;
}

<span class="hljs-comment">// 使用 Optional - 更优雅</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">getUserName</span><span class="hljs-params">(Optional&lt;User&gt; user)</span> {
    <span class="hljs-keyword">return</span> user.map(User::getName).orElse(<span class="hljs-string">&quot;Unknown&quot;</span>);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="optional-%E5%B8%B8%E7%94%A8%E6%96%B9%E6%B3%95">Optional 常用方法</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Optional</span>&lt;String&gt; <span class="hljs-variable">opt</span> <span class="hljs-operator">=</span> Optional.ofNullable(getString());

<span class="hljs-comment">// 获取值，如果为空则使用默认值</span>
<span class="hljs-type">String</span> <span class="hljs-variable">v1</span> <span class="hljs-operator">=</span> opt.orElse(<span class="hljs-string">&quot;default&quot;</span>);
<span class="hljs-comment">// 获取值，如果为空则通过 Supplier 提供</span>
<span class="hljs-type">String</span> <span class="hljs-variable">v2</span> <span class="hljs-operator">=</span> opt.orElseGet(() -&gt; getDefaultValue());
<span class="hljs-comment">// 获取值，如果为空则抛出异常</span>
<span class="hljs-type">String</span> <span class="hljs-variable">v3</span> <span class="hljs-operator">=</span> opt.orElseThrow(() -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>());
<span class="hljs-comment">// 如果有值则执行操作</span>
opt.ifPresent(v -&gt; System.out.println(v));
<span class="hljs-comment">// 转换值</span>
<span class="hljs-type">Optional</span>&lt;Integer&gt; <span class="hljs-variable">length</span> <span class="hljs-operator">=</span> opt.map(String::length);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="optional-%E9%93%BE%E5%BC%8F%E8%B0%83%E7%94%A8%E8%A7%A3%E6%9E%90">Optional 链式调用解析</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">user.map(User::getName).orElse(<span class="hljs-string">&quot;Unknown&quot;</span>);
</code></pre>
<ol>
<li>
<p><code>user</code> - 类型是 <code>Optional&lt;User&gt;</code>，可能存在也可能不存在</p>
</li>
<li>
<p><code>.map(User::getName)</code> - 转换操作</p>
<ul>
<li>如果 user 存在：调用 <code>getName()</code> 并返回 <code>Optional&lt;String&gt;</code>；如果 user 不存在：跳过，直接返回空的 <code>Optional&lt;String&gt;</code></li>
</ul>
</li>
<li>
<p><code>.orElse(&quot;Unknown&quot;)</code> - 获取最终值</p>
<ul>
<li>如果有值：返回该值；如果为空：返回默认值 <code>&quot;Unknown&quot;</code></li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="optional-%E6%89%A7%E8%A1%8C%E6%B5%81%E7%A8%8B%E7%A4%BA%E4%BE%8B">Optional 执行流程示例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 情况1：user 存在且有名字</span>
Optional.of(<span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>(<span class="hljs-string">&quot;Alice&quot;</span>)).map(User::getName).orElse(<span class="hljs-string">&quot;Unknown&quot;</span>);
<span class="hljs-comment">// 结果: &quot;Alice&quot;</span>

<span class="hljs-comment">// 情况2：user 不存在</span>
Optional.empty().map(User::getName)      <span class="hljs-comment">// 跳过此步骤</span>
    .orElse(<span class="hljs-string">&quot;Unknown&quot;</span>);
<span class="hljs-comment">// 结果: &quot;Unknown&quot;</span>
</code></pre>
<p><strong>等价的传统写法</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> (user != <span class="hljs-literal">null</span> &amp;&amp; user.getName() != <span class="hljs-literal">null</span>) 
    ? user.getName() : <span class="hljs-string">&quot;Unknown&quot;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="helpful-nullpointerexceptions-14">Helpful NullPointerExceptions (14+)</h1>
<p>Java 14 改进了 NPE 的错误信息，能精确指出哪个变量是 <code>null</code>。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HelpfulNPE</span> {
    <span class="hljs-keyword">static</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span> { B b; }
    <span class="hljs-keyword">static</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">B</span> { C c; }
    <span class="hljs-keyword">static</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">C</span> { String d; }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">A</span> <span class="hljs-variable">a</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">A</span>();
        a.b.c.d = <span class="hljs-string">&quot;value&quot;</span>; <span class="hljs-comment">// a.b 为 null</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="helpful-nullpointerexceptions">Helpful NullPointerExceptions</h1>
<p><strong>Java 13 及之前</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Exception in thread &quot;main&quot; java.lang.NullPointerException
    at HelpfulNPE.main(HelpfulNPE.java:7)
</code></pre>
<p><strong>Java 14+</strong>（默认启用）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Exception in thread &quot;main&quot; java.lang.NullPointerException: 
Cannot read field &quot;c&quot; because &quot;a.b&quot; is null
    at HelpfulNPE.main(HelpfulNPE.java:7)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">java -XX:+ShowCodeDetailsInExceptionMessages HelpfulNPE
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="objectsrequirenonnull-java-7">Objects.requireNonNull() (Java 7+)</h1>
<p>用于参数校验，提前抛出清晰的异常信息。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.util.Objects;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> {
    <span class="hljs-keyword">private</span> String name, email;
    <span class="hljs-type">public</span> <span class="hljs-title function_">User</span><span class="hljs-params">(String name)</span> {
        <span class="hljs-comment">// 如果 name 为 null，立即抛出 NPE</span>
        <span class="hljs-built_in">this</span>.name = Objects.requireNonNull(name, <span class="hljs-string">&quot;name cannot be null&quot;</span>);
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">setEmail</span><span class="hljs-params">(String email)</span> {
        <span class="hljs-built_in">this</span>.email = Objects.requireNonNull(email, <span class="hljs-string">&quot;email required&quot;</span>);
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="nonnull--nullable-%E6%B3%A8%E8%A7%A3">@NonNull / @Nullable 注解</h1>
<p>配合 IDE 和静态分析工具，在编译期发现潜在的空指针问题。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.jetbrains.annotations.NotNull;
<span class="hljs-keyword">import</span> org.jetbrains.annotations.Nullable;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserService</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">processUser</span><span class="hljs-params">(<span class="hljs-meta">@NotNull</span> User user)</span> {
        System.out.println(user.getName()); <span class="hljs-comment">// IDE 会警告可能的 null</span>
    }
    <span class="hljs-meta">@Nullable</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">User</span> <span class="hljs-title function_">findUser</span><span class="hljs-params">(String id)</span> {
        <span class="hljs-keyword">return</span> userMap.get(id); <span class="hljs-comment">// 返回值可能为 null</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="checked-exception">Checked Exception</h1>
<p>Checked exceptions represent errors outside the control of the program. For example, the constructor of FileInputStream throws FileNotFoundException if the input file does not exist.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">checkedExceptionWithThrows</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> FileNotFoundException {
    <span class="hljs-type">File</span> <span class="hljs-variable">file</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">File</span>(<span class="hljs-string">&quot;not_existing_file.txt&quot;</span>);
    <span class="hljs-type">FileInputStream</span> <span class="hljs-variable">stream</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(file);
}
</code></pre>
<p>Use a try-catch block to handle a checked exception.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E7%BB%A7%E6%89%BF%E4%B8%AD%E7%9A%84%E5%BC%82%E5%B8%B8%E8%A7%84%E5%88%99">继承中的异常规则</h1>
<p>子类重写方法时，对异常的限制：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Parent</span> {
    <span class="hljs-type">void</span> <span class="hljs-title function_">method</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> IOException, SQLException { }
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Child</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Parent</span> {
    
    <span class="hljs-type">void</span> <span class="hljs-title function_">method</span><span class="hljs-params">()</span> { } <span class="hljs-comment">// 可以不抛异常</span>
    
    <span class="hljs-meta">@Override</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">method</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> FileNotFoundException { }  <span class="hljs-comment">// 可以抛出父类异常的子类</span>
    
    <span class="hljs-comment">// void method() throws InterruptedException { }  // 编译错误，不能抛出新的 checked exception</span>
    
    <span class="hljs-type">void</span> <span class="hljs-title function_">method</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> RuntimeException { } <span class="hljs-comment">// 可以抛出任意 unchecked exception</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="lambda-%E4%B8%AD%E7%9A%84-checked-exception">Lambda 中的 Checked Exception</h1>
<p>Lambda 表达式不能直接抛出 checked exception（以后再说）。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">List</span>&lt;String&gt; <span class="hljs-variable">files</span> <span class="hljs-operator">=</span> Arrays.asList(<span class="hljs-string">&quot;a.txt&quot;</span>, <span class="hljs-string">&quot;b.txt&quot;</span>);

files.forEach(f -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(f));  <span class="hljs-comment">// 编译错误： Lambda 不能抛出 checked exception （IOException）</span>

<span class="hljs-comment">// 解决方案1：try-catch 包装为 unchecked exception</span>
files.forEach(f -&gt; {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(f);
    } <span class="hljs-keyword">catch</span> (IOException e) {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UncheckedIOException</span>(e);
    }
});
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="checked-exception-%E7%9A%84%E4%BA%89%E8%AE%AE">Checked Exception 的争议</h1>
<p><strong>Pros</strong>：</p>
<ul>
<li>编译期发现潜在问题，强制处理错误，提高代码健壮性</li>
<li>异常成为方法签名的一部分，提供文档化</li>
</ul>
<p><strong>Cons</strong>：</p>
<ul>
<li>代码冗长，try-catch 到处都是，很多时候只是简单吞掉或向上抛出</li>
<li>破坏函数式编程（Lambda、Stream）</li>
<li>C#、Kotlin、Scala 等现代语言都不支持 checked exception</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="checked-exception-%E7%9A%84%E4%BA%89%E8%AE%AE-1">Checked Exception 的争议</h1>
<p>&quot;...on the whole I think that exceptions are good, but Java checked exceptions are more trouble than they are worth.&quot;</p>
<div style="text-align:right;">--Martin Fowler
<p>(author of UML Distilled, Refactoring, and Analysis Patterns) </div></p>
<p><strong>现代趋势</strong>：倾向于使用 <code>Optional</code>、<code>Result</code> 类型等函数式方法，而非 checked exception。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="37" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%BC%82%E5%B8%B8%E7%9A%84%E6%80%A7%E8%83%BD%E5%BC%80%E9%94%80">异常的性能开销</h1>
<p>创建异常对象开销较大，因为需要填充完整的堆栈跟踪信息。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 非常慢！</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">1000000</span>; i++) {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Exception</span>();
    } <span class="hljs-keyword">catch</span> (Exception e) { }
}
</code></pre>
<ul>
<li>异常用于真正的异常情况，不要用于控制流程</li>
<li>高频场景考虑使用返回值：<code>Optional&lt;User&gt;</code> 而非抛出异常</li>
<li>使用日志而非频繁抛出异常进行调试</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="38" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E5%BC%82%E5%B8%B8%E5%BC%80%E9%94%80%E5%A4%A7">为什么异常开销大？</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Exception</span>();  <span class="hljs-comment">// 这一行发生了什么？</span>
</code></pre>
<ol>
<li>创建 Exception 对象（分配内存）</li>
<li><strong>遍历当前线程的整个调用栈</strong></li>
<li>记录每一层的调用信息（类名、方法名、文件名、行号）并将这些信息存储在异常对象中</li>
</ol>
<p><strong>核心原因</strong>：<code>Throwable</code> 构造函数会调用 <code>fillInStackTrace()</code> 方法，这是一个 native 方法，需要遍历整个调用栈。调用链越深，开销越大。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="39" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E6%80%A7%E8%83%BD%E5%AF%B9%E6%AF%94">性能对比</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 测试1：创建 100万个异常对象, 约 3000-5000ms</span>
<span class="hljs-type">long</span> <span class="hljs-variable">start</span> <span class="hljs-operator">=</span> System.currentTimeMillis();
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">1000000</span>; i++) {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Exception</span>();
    } <span class="hljs-keyword">catch</span> (Exception e) { }
}
System.out.println(<span class="hljs-string">&quot;抛出异常: &quot;</span> + (System.currentTimeMillis() - start) + <span class="hljs-string">&quot;ms&quot;</span>);

<span class="hljs-comment">// 测试2：创建 100万个普通对象, 约 10-50ms    相差 100-500 倍！</span>
start = System.currentTimeMillis();
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">1000000</span>; i++) {
    <span class="hljs-keyword">new</span> <span class="hljs-title class_">Object</span>();
}
System.out.println(<span class="hljs-string">&quot;创建对象: &quot;</span> + (System.currentTimeMillis() - start) + <span class="hljs-string">&quot;ms&quot;</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="40" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%A0%86%E6%A0%88%E8%B7%9F%E8%B8%AA%E7%A4%BA%E4%BE%8B%E6%AF%8F%E4%B8%80%E5%B1%82%E9%83%BD%E8%A6%81%E8%AE%B0%E5%BD%95">堆栈跟踪示例（每一层都要记录）</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">StackTraceExample</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> { method1(); }
    <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">method1</span><span class="hljs-params">()</span> { method2(); }
    <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">method2</span><span class="hljs-params">()</span> { method3(); }
    <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">method3</span><span class="hljs-params">()</span> { <span class="hljs-keyword">new</span> <span class="hljs-title class_">Exception</span>().printStackTrace(); }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>java.lang.Exception
    at StackTraceExample.method3(StackTraceExample.java:5)
    at StackTraceExample.method2(StackTraceExample.java:4)
    at StackTraceExample.method1(StackTraceExample.java:3)
    at StackTraceExample.main(StackTraceExample.java:2)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="41" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E4%BC%98%E5%8C%96%E6%96%B9%E6%A1%88">优化方案</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">FastException</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Exception</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">synchronized</span> <span class="hljs-type">Throwable</span> <span class="hljs-title function_">fillInStackTrace</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-built_in">this</span>;  <span class="hljs-comment">// 不填充堆栈，速度提升 10-100 倍</span>
    }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 不好 - 用异常控制流程</span>
<span class="hljs-keyword">try</span> { Integer.parseInt(input); <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>; } 
<span class="hljs-keyword">catch</span> (NumberFormatException e) { <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>; }

<span class="hljs-comment">// 好 - 用正则或其他方式</span>
<span class="hljs-keyword">return</span> input.matches(<span class="hljs-string">&quot;\\d+&quot;</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="42" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%AE%9E%E9%99%85%E5%BA%94%E7%94%A8%E5%BB%BA%E8%AE%AE">实际应用建议</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 避免高频场景抛异常</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">User</span> <span class="hljs-title function_">findUser</span><span class="hljs-params">(String id)</span> <span class="hljs-keyword">throws</span> UserNotFoundException {
    <span class="hljs-type">User</span> <span class="hljs-variable">user</span> <span class="hljs-operator">=</span> cache.get(id);
    <span class="hljs-keyword">if</span> (user == <span class="hljs-literal">null</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UserNotFoundException</span>(); <span class="hljs-comment">// 太慢！</span>
    <span class="hljs-keyword">return</span> user;
}

<span class="hljs-comment">// 应该使用 Optional</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">Optional</span>&lt;User&gt; <span class="hljs-title function_">findUser</span><span class="hljs-params">(String id)</span> {
    <span class="hljs-keyword">return</span> Optional.ofNullable(cache.get(id));
}
</code></pre>
<p><strong>核心原则：异常是为异常情况设计的，不是为正常的控制流程设计的！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="43" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="finally"><code>finally</code></h1>
<p>有一些代码片段，可能会希望无论 try 块中的异常是否抛出，它们都能得到执行。可以在异常处理程序后面加上 finally 子句。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">try</span> {
    <span class="hljs-comment">// The guarded region: Dangerous activities</span>
} <span class="hljs-keyword">catch</span>(A a1) {
    <span class="hljs-comment">// Handler for situation A</span>
} <span class="hljs-keyword">finally</span> {
    <span class="hljs-comment">// Activities that happen every time</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="44" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="why-finally">Why <code>finally</code>?</h1>
<p>对于没有垃圾回收和析构函数自动调用机制的语言来说，finally 非常重要。它能使程序员保证：无论 try 块里发生了什么，内存总能得到释放。但 Java 有垃圾回收机制，所以内存释放不再是问题。而且，Java 也没有析构函数可供调用。那么，Java 在什么情况下才能用到 finally 呢？</p>
<p>当要把除内存之外的资源恢复到它们的初始状态时，就要用到 finally 子句。这种需要清理的资源包括：已经打开的文件或网络连接，在屏幕上画的图形，甚至可以是外部世界的某个开关。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="45" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E8%87%AA%E5%AE%9A%E4%B9%89%E5%BC%82%E5%B8%B8">自定义异常</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DividedByZeroException</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Exception</span>{
    DividedByZeroException(){
        <span class="hljs-built_in">super</span>(<span class="hljs-string">&quot;divided by zero&quot;</span>);
    }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> <span class="hljs-keyword">throws</span> DividedByZeroException {
        <span class="hljs-keyword">if</span> (b == <span class="hljs-number">0</span>) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DividedByZeroException</span>();
        }
        <span class="hljs-keyword">return</span> a / b;
    }
    ...
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="46" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%A4%9A%E9%87%8D%E6%8D%95%E8%8E%B7">多重捕获</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SameHandler</span> {
    <span class="hljs-type">void</span> <span class="hljs-title function_">x</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> Except1, Except2, Except3, Except4 {}
    <span class="hljs-type">void</span> <span class="hljs-title function_">process</span><span class="hljs-params">()</span> {}
    <span class="hljs-type">void</span> <span class="hljs-title function_">f</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">try</span> {
            x();
        } <span class="hljs-keyword">catch</span>(Except1 e) {
            process();
        } <span class="hljs-keyword">catch</span>(Except2 e) {
            process();
        } <span class="hljs-keyword">catch</span>(Except3 e) {
            process();
        } <span class="hljs-keyword">catch</span>(Except4 e) {
            process();
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="47" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E7%BB%84%E5%90%88%E6%8D%95%E8%8E%B7">组合捕获</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MultiCatch</span> {
    <span class="hljs-type">void</span> <span class="hljs-title function_">x</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> Except1, Except2, Except3, Except4 {}
    <span class="hljs-type">void</span> <span class="hljs-title function_">process</span><span class="hljs-params">()</span> {}
    <span class="hljs-type">void</span> <span class="hljs-title function_">f</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">try</span> {
            x();
        } <span class="hljs-keyword">catch</span>(Except1 | Except2 | Except3 | Except4 e) {
            process();
        }
    }
}
</code></pre>
<blockquote>
<p>Since Java 7</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="48" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%BC%82%E5%B8%B8%E5%8C%B9%E9%85%8D">异常匹配</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">SuperException</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Exception</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">SubException</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">SuperException</span> { }
<span class="hljs-keyword">class</span> <span class="hljs-title class_">BadCatch</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">goodTry</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">try</span> { 
      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">SubException</span>();
    } <span class="hljs-keyword">catch</span> (SuperException superRef) { ...
    } <span class="hljs-keyword">catch</span> (SubException subRef) {
      ...<span class="hljs-comment">// never be reached</span>
    } <span class="hljs-comment">// an INVALID catch ordering</span>
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="49" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E6%A0%88%E8%BD%A8%E8%BF%B9">栈轨迹</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">DividedByZeroException</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Exception</span>{
    DividedByZeroException(){ <span class="hljs-built_in">super</span>(<span class="hljs-string">&quot;divided by zero&quot;</span>); }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">div</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> <span class="hljs-keyword">throws</span> DividedByZeroException {
        <span class="hljs-keyword">if</span> (b == <span class="hljs-number">0</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DividedByZeroException</span>();
        <span class="hljs-keyword">return</span> a / b;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-keyword">try</span> {
            System.out.println(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>().div(
                Integer.parseInt(args[<span class="hljs-number">0</span>]), Integer.parseInt(args[<span class="hljs-number">1</span>])));
        } <span class="hljs-keyword">catch</span> (Exception e) {
            e.printStackTrace();
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="50" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E6%A0%88%E8%BD%A8%E8%BF%B9%E8%BE%93%E5%87%BA">栈轨迹输出</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">DividedByZeroException: divided by zero
        at Calculator.div(Calculator.java:9)
        at Calculator.main(Calculator.java:15)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E9%87%8D%E6%96%B0%E6%8A%9B%E5%87%BA">重新抛出</h1>
<p>重抛异常会把异常抛给上一级环境中的异常处理程序，同一个 try 块的后续 catch 子句将被忽略。此外，异常对象的所有信息都得以保持，所以高一级环境中捕获此异常的处理程序可以从这个异常对象中得到所有信息。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">catch</span>(Exception e) {
    System.out.println(<span class="hljs-string">&quot;An exception was thrown&quot;</span>);
    <span class="hljs-keyword">throw</span> e;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="52" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h2 id="try-with-resources">Try-With-Resources</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.io.*;
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MessyExceptions</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-type">InputStream</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-literal">null</span>;
        <span class="hljs-keyword">try</span>{ 
          in = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">File</span>(<span class="hljs-string">&quot;MessyExceptions.java&quot;</span>));
             <span class="hljs-type">int</span> <span class="hljs-variable">contents</span> <span class="hljs-operator">=</span> in.read();
             <span class="hljs-comment">// Process contents</span>
        } <span class="hljs-keyword">catch</span>(IOException e) { <span class="hljs-comment">// Handle the error</span>
        } <span class="hljs-keyword">finally</span> {
            <span class="hljs-keyword">if</span>(in != <span class="hljs-literal">null</span>) {
                <span class="hljs-keyword">try</span> {
                    in.close();
                } <span class="hljs-keyword">catch</span>(IOException e) { <span class="hljs-comment">// Handle the close() error</span>
                }
            }
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h2 id="try-with-resources-1">Try-With-Resources</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> java.io.*;
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TryWithResources</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        <span class="hljs-keyword">try</span>(
            <span class="hljs-type">InputStream</span> <span class="hljs-variable">in</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">File</span>(<span class="hljs-string">&quot;TryWithResources.java&quot;</span>))
        ) {
            <span class="hljs-type">int</span> <span class="hljs-variable">contents</span> <span class="hljs-operator">=</span> in.read();
        } <span class="hljs-keyword">catch</span>(IOException e) {
            <span class="hljs-comment">// Handle the error</span>
        }
    }
}
</code></pre>
<blockquote>
<p>Since Java 7 with <code>AutoCloseable</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="autocloseable-vs-closeable">AutoCloseable vs Closeable</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Closeable (Java 1.5) - 只用于 I/O</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Closeable</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">AutoCloseable</span> {
    <span class="hljs-type">void</span> <span class="hljs-title function_">close</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> IOException;
}

<span class="hljs-comment">// AutoCloseable (Java 7) - 更通用</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">AutoCloseable</span> {
    <span class="hljs-type">void</span> <span class="hljs-title function_">close</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> Exception;  <span class="hljs-comment">// 可以抛出任何异常</span>
}
</code></pre>
<ul>
<li><code>Closeable</code> 只抛出 <code>IOException</code>，要求幂等性（多次调用无副作用）</li>
<li><code>AutoCloseable</code> 可以抛出任何 <code>Exception</code>，适用于更广泛的场景</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E8%B5%84%E6%BA%90%E5%85%B3%E9%97%AD%E9%A1%BA%E5%BA%8F">资源关闭顺序</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">try</span> (
    <span class="hljs-type">FileInputStream</span> <span class="hljs-variable">fis</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;file1.txt&quot;</span>);  <span class="hljs-comment">// 1 第1个打开</span>
    <span class="hljs-type">FileOutputStream</span> <span class="hljs-variable">fos</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileOutputStream</span>(<span class="hljs-string">&quot;file2.txt&quot;</span>); <span class="hljs-comment">// 2 第2个打开</span>
    <span class="hljs-type">BufferedReader</span> <span class="hljs-variable">br</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;file3.txt&quot;</span>)) <span class="hljs-comment">// 3 第3个打开</span>
) {
    <span class="hljs-comment">// 使用资源</span>
}
<span class="hljs-comment">// 关闭顺序：br → fos → fis （与声明顺序相反！）</span>
</code></pre>
<p><strong>原因</strong>：后面的资源可能依赖前面的资源，所以要先关闭后面的。</p>
<p><strong>类似栈结构</strong>：后进先出（LIFO）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="56" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="%E5%AD%97%E8%8A%82%E7%A0%81%E5%B1%82%E9%9D%A2%E7%9A%84%E5%AE%9E%E7%8E%B0">字节码层面的实现</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">try</span> (<span class="hljs-type">FileInputStream</span> <span class="hljs-variable">fis</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;file.txt&quot;</span>)) {
    <span class="hljs-comment">// 使用 fis</span>
}

<span class="hljs-comment">// 编译后等价于（简化版）</span>
<span class="hljs-type">FileInputStream</span> <span class="hljs-variable">fis</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">FileInputStream</span>(<span class="hljs-string">&quot;file.txt&quot;</span>);
<span class="hljs-type">Throwable</span> <span class="hljs-variable">primaryEx</span> <span class="hljs-operator">=</span> <span class="hljs-literal">null</span>;
<span class="hljs-keyword">try</span> {
    <span class="hljs-comment">// 使用 fis</span>
} <span class="hljs-keyword">catch</span> (Throwable t) {
    primaryEx = t; <span class="hljs-keyword">throw</span> t;
} <span class="hljs-keyword">finally</span> {
    <span class="hljs-keyword">if</span> (fis != <span class="hljs-literal">null</span>) {
        <span class="hljs-keyword">if</span> (primaryEx != <span class="hljs-literal">null</span>) {
            <span class="hljs-keyword">try</span> { fis.close(); } 
            <span class="hljs-keyword">catch</span> (Throwable closeEx) { primaryEx.addSuppressed(closeEx); }
        } <span class="hljs-keyword">else</span> { fis.close(); }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="57" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="60">
<h1 id="java-9-%E7%9A%84%E6%94%B9%E8%BF%9B">Java 9 的改进</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Java 7-8：必须在 try() 中声明</span>
<span class="hljs-keyword">try</span> (<span class="hljs-type">BufferedReader</span> <span class="hljs-variable">br</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BufferedReader</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">FileReader</span>(<span class="hljs-string">&quot;file.txt&quot;</span>))) {
    <span class="hljs-keyword">return</span> br.readLine();
